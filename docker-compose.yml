x-user: &user "${UID:-0}:${GID:-0}"  # Host UID/GID in dev; root by default.

services:
  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    user: *user
    env_file:
      - .env
    command: sh -c "node packages/bot/dist/deploy-commands.js && node packages/bot/dist/index.js"
    volumes:
      - ./data:/app/data

  ws:
    build:
      context: .
      target: ws
    restart: unless-stopped
    user: *user
    environment:
      - WEB_URL=${NEXTAUTH_URL:-http://localhost}
      - WS_PORT=3001
      - WS_INTERNAL_PORT=4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET}
    command: node packages/ws/dist/server.js
    volumes:
      - ./data:/app/data
    depends_on:
      - bot

  duel:
    build:
      context: .
      target: duel-bundled
      additional_contexts:
        engine: ./.deploy-duel-engine
    restart: unless-stopped
    user: *user
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
      - DUEL_DATA_DIR=/app/data/duel-engine
      # The deploy installs on the host. Restarts verify the existing volume without replacing it.
      - DUEL_BUNDLE_SRC=${DUEL_BUNDLE_SRC_ON_START:-}
      - DUEL_INTERNAL_HOST=0.0.0.0
      - DUEL_INTERNAL_PORT=4003
      - DUEL_INTERNAL_SECRET=${DUEL_INTERNAL_SECRET}
      - WS_INTERNAL_URL=http://ws:4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET}
      - DUEL_ARCHIVE_AFTER_MS=${DUEL_ARCHIVE_AFTER_MS:-600000}
      - DUEL_IDLE_WORKER_MS=${DUEL_IDLE_WORKER_MS:-300000}
      # Tag, 3-player and 4-player tables. Off by default: only 1v1 tables start. The web service needs the same value.
      - MULTIPLAYER_TABLES=${MULTIPLAYER_TABLES:-0}
      # The engine that new 1v1 duels start on. legacy is the engine production ran before the n-seat work (the default).
      # pinned is the merged engine. A duel keeps the engine it started on. Tables with 3 or 4 seats always use the multi core.
      - DUEL_1V1_ENGINE=${DUEL_1V1_ENGINE:-legacy}
    # The VM has 4 GB. The first game loads the card database and scripts (about 114 MB), each game adds a few MB.
    mem_limit: ${DUEL_MEM_LIMIT:-1g}
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    user: *user
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/bot.sqlite
      - WS_INTERNAL_URL=http://ws:4002
      - WS_INTERNAL_SECRET=${WS_INTERNAL_SECRET}
      - DUEL_INTERNAL_URL=http://duel:4003
      - DUEL_INTERNAL_SECRET=${DUEL_INTERNAL_SECRET}
      # Same flag as on the duel service. The web reads it on the server at run time, so a restart switches it.
      - MULTIPLAYER_TABLES=${MULTIPLAYER_TABLES:-0}
      # In-app Report bug button: the web server opens a GitHub issue per report. Without a token the report is only saved.
      - BUG_REPORT_GITHUB_TOKEN=${BUG_REPORT_GITHUB_TOKEN:-}
      - BUG_REPORT_GITHUB_REPO=${BUG_REPORT_GITHUB_REPO:-imran443/yugioh-bot}
    volumes:
      - ./data:/app/data
    depends_on:
      - ws
      - duel

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?Set SITE_DOMAIN in .env (localhost for local dev)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - ws

volumes:
  caddy_data:
  caddy_config:
