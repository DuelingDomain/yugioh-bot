name: remote-video
services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    # Host networking makes the advertised loopback ICE address reachable in WSL2.
    # All listeners bind only to loopback. No volumes, Redis or persistent media.
    network_mode: host
    command: ["--dev", "--bind", "127.0.0.1", "--node-ip", "127.0.0.1", "--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "1"
