name: Site checks

# Static checks for the marketing site (site/public). Python standard library only, no install step.
# Browser layout checks (site/src/verify-browser.mjs) need Caddy and Playwright; run them locally.
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-checks.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static:
    name: Verify static site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check shared header and footer
        run: python3 site/src/sync-chrome.py --check
      - name: Verify pages, metadata, schema, sitemap and llms.txt
        run: python3 site/src/verify-static.py
