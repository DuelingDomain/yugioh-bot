name: Deploy
run-name: ${{ github.event_name == 'workflow_run' && format('Deploy {0} (Test {1})', github.event.workflow_run.head_sha, github.event.workflow_run.conclusion) || format('Deploy {0}', inputs.ref) }}

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref or SHA to deploy (must be on main and have passed a push Test run)"
        required: true
        default: main
        type: string
      force:
        description: "Allow deploy during active gameplay (engine preflight still applies)"
        required: false
        default: false
        type: boolean
      rollback:
        description: "Allow an older production SHA (restore matching DB and env if needed)"
        required: false
        default: false
        type: boolean

# Serialize preparation, cache writes, builds and deploys. Keep every pending run:
# late older runs must never replace a newer pending release.
concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare verified production release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    timeout-minutes: 180
    env:
      VM_DEPLOY_ENABLED: ${{ secrets.VM_HOST != '' && secrets.VM_USER != '' && secrets.VM_SSH_PRIVATE_KEY != '' && 'true' || 'false' }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      DEPLOY_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      DEPLOY_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback && 'true' || 'false' }}
      DEPLOY_WAIT_SECONDS: ${{ github.event_name == 'workflow_run' && '3600' || '0' }}
      DEPLOY_LIVE_ONLY: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
      # Public production key only. The secret remains in the protected VM runtime env.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

    outputs:
      commit: ${{ steps.release.outputs.commit }}
      bundle_artifact_id: ${{ steps.tested-artifacts.outputs.bundle_id }}
      image_artifact_ids: ${{ steps.tested-artifacts.outputs.image_ids }}
      rollback: ${{ env.DEPLOY_ROLLBACK }}
      superseded: ${{ steps.superseded.outputs.skip }}

    steps:
      - name: Skip superseded automatic release
        id: superseded
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.setOutput('skip', 'false');
            if (context.eventName !== 'workflow_run') return;
            const target = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            const { data: branch } = await github.request('GET /repos/{owner}/{repo}/branches/{branch}', {
              owner, repo, branch: 'main'
            });
            const main = branch.commit.sha;
            const newer = new Set();
            for (let page = 1; ; page++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                owner, repo, basehead: `${target}...${main}`, per_page: 100, page
              });
              if (data.status !== 'ahead') return;
              for (const commit of data.commits) newer.add(commit.sha);
              if (newer.size >= data.total_commits) break;
              if (!data.commits.length) throw new Error('Cannot read all newer main commits.');
            }
            const superseded = async (sha, reason) => {
              core.info(`Superseded: ${target}; newer main commit ${sha} ${reason}. Skipping prepare, build and deploy.`);
              await core.summary.addRaw(`Superseded by ${sha}: ${reason}.\n`).write();
              core.setOutput('skip', 'true');
            };
            const tests = await github.paginate('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              owner, repo, workflow_id: 'test.yml', branch: 'main', event: 'push', status: 'success', per_page: 100
            });
            const passed = tests.find(run => newer.has(run.head_sha));
            if (passed) { await superseded(passed.head_sha, 'passed push Test'); return; }
            const queued = await github.paginate('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              owner, repo, workflow_id: 'deploy.yml', branch: 'main', event: 'workflow_run', per_page: 100
            });
            for (const run of queued) {
              if (run.id === context.runId || !['queued', 'pending', 'waiting', 'requested'].includes(run.status)) continue;
              // workflow_run head_sha can describe the workflow revision. Use the trigger SHA in run-name.
              const match = /^Deploy ([0-9a-f]{40}) \(Test success\)$/.exec(run.display_title || '');
              if (match && newer.has(match[1])) { await superseded(match[1], 'has a newer deploy run queued'); return; }
            }

      - name: Fail when VM secrets are not configured
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED != 'true' }}
        run: |
          echo "VM deploy secrets are not configured; production was not deployed." >&2
          exit 1

      - name: Checkout
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # Keep deployment controls from the workflow revision, even when deploying an older main SHA.
      - name: Save deployment activity guard
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          cp scripts/deployment/check-prod-activity.py "$RUNNER_TEMP/check-prod-activity.py"
          cp scripts/deployment/production-images.sh "$RUNNER_TEMP/production-images.sh"
          cp scripts/deployment/prepare-runtime-data.sh "$RUNNER_TEMP/prepare-runtime-data.sh"
          cp scripts/backup/dueling-backup "$RUNNER_TEMP/dueling-backup"

      - name: Checkout deploy ref
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.workflow_sha != env.DEPLOY_REF) }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 1
          persist-credentials: false

      # Ask GitHub for the ancestry so the job needs no full history clone.
      # compare base...head: "ahead" means main is ahead of the deploy ref; "identical" means same commit.
      - name: Verify deploy ref is on main
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          status=$(gh api --method GET "repos/$GITHUB_REPOSITORY/compare/$commit...main" -F per_page=1 --jq '.status')
          case "$status" in
            ahead|identical) ;;
            *)
              echo "Production deploy refused: $commit is not on main (compare status: $status)." >&2
              exit 1
              ;;
          esac

      - name: Record checked-out deploy commit
        id: release
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          commit=$(git rev-parse HEAD)
          echo "DEPLOY_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Verify manual deploy commit passed Test
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs" \
            -f head_sha="$DEPLOY_COMMIT" -f branch=main -f event=push -f status=success --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "Production deploy refused: $DEPLOY_COMMIT has no successful push Test run on main." >&2
            exit 1
          fi

      # Load extracted actions from this workflow revision, even for older manual refs.
      - name: Checkout release build controls
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-controls
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Prepare production bundle for manual release
        if: steps.superseded.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        uses: ./.release-controls/.github/actions/prepare-production-bundle

      - name: Resolve tested production artifacts
        id: tested-artifacts
        if: github.event_name == 'workflow_run' && steps.superseded.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          TEST_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/ci/production-artifacts.mjs

      # Only manual releases produce a bundle here. Automatic releases pass the
      # verified Test artifact IDs to deploy, where the bundle and images download together.
      - name: Upload verified release controls and bundle
        if: ${{ steps.superseded.outputs.skip != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-deploy-${{ env.DEPLOY_COMMIT }}
          path: |
            ${{ runner.temp }}/deploy-bundle.tar.gz
            ${{ runner.temp }}/check-prod-activity.py
            ${{ runner.temp }}/production-images.sh
            ${{ runner.temp }}/prepare-runtime-data.sh
            ${{ runner.temp }}/dueling-backup
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0

  voice-assets:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.superseded != 'true' && needs.prepare.outputs.rollback != 'true'
    uses: ./.github/workflows/prepare-voice-assets.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      save-cache: true

  build:
    name: Build ARM64 ${{ matrix.service }} image
    needs: [prepare, voice-assets]
    if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.superseded != 'true' && needs.prepare.outputs.rollback != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: duel
            target: duel-bundled
          - service: web
            target: web
          - service: bot
            target: bot
          - service: worker
            target: worker
          - service: ws
            target: ws
    env:
      DEPLOY_COMMIT: ${{ needs.prepare.outputs.commit }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      IMAGE: ghcr.io/duelingdomain/yugioh-bot-${{ matrix.service }}
    steps:
      - name: Validate prepare commit output
        shell: bash
        run: |
          if [[ ! "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::prepare commit output missing or invalid (maybe masked as a secret); dispatch a new Deploy" >&2
            exit 1
          fi

      - name: Checkout verified deploy commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # Load extracted actions from this workflow revision, even for older manual refs.
      - name: Checkout release build controls
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-controls
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download pinned voice inputs for web
        if: matrix.service == 'web' && needs.voice-assets.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.voice-assets.outputs.artifact }}
          path: ${{ runner.temp }}/voice-inputs
      - name: Unpack voice image inputs
        if: matrix.service == 'web' && needs.voice-assets.outputs.enabled == 'true'
        run: |
          mkdir -p data/voice-assets
          tar -C data/voice-assets -xzf "$RUNNER_TEMP/voice-inputs/voice-assets.tar.gz"
      - name: Build production image
        uses: ./.release-controls/.github/actions/build-production-image
        with:
          service: ${{ matrix.service }}
          target: ${{ matrix.target }}
          bundle-artifact: production-deploy-${{ needs.prepare.outputs.commit }}
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  deploy:
    name: Deploy to Production VM
    needs: [prepare, build]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.superseded != 'true' &&
      (needs.build.result == 'success' ||
      ((github.event_name == 'workflow_run' || needs.prepare.outputs.rollback == 'true') && needs.build.result == 'skipped')) &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_DEPLOY_ENABLED: ${{ secrets.VM_HOST != '' && secrets.VM_USER != '' && secrets.VM_SSH_PRIVATE_KEY != '' && 'true' || 'false' }}
      VM_PORT: ${{ secrets.VM_PORT || '22' }}
      DEPLOY_COMMIT: ${{ needs.prepare.outputs.commit }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      DEPLOY_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      DEPLOY_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback && 'true' || 'false' }}
      DEPLOY_WAIT_SECONDS: ${{ github.event_name == 'workflow_run' && '3600' || '0' }}
      DEPLOY_LIVE_ONLY: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
      # Public production key only. The secret remains in the protected VM runtime env.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Validate prepare commit output
        shell: bash
        run: |
          if [[ ! "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::prepare commit output missing or invalid (maybe masked as a secret); dispatch a new Deploy" >&2
            exit 1
          fi

      - name: Checkout verified deploy commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Download verified release controls and bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-deploy-${{ needs.prepare.outputs.commit }}
          path: ${{ runner.temp }}/release

      - name: Download runtime image digests
        if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.rollback != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: production-image-*-${{ needs.prepare.outputs.commit }}
          merge-multiple: true
          path: ${{ runner.temp }}/image-digests

      - name: Download tested production artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.bundle_artifact_id }},${{ needs.prepare.outputs.image_artifact_ids }}
          merge-multiple: true
          path: ${{ runner.temp }}/image-digests
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve retained rollback digests
        if: needs.prepare.outputs.rollback == 'true'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/image-digests"
          for service in duel web worker ws bot; do
            # Retained releases from before ADR 0006 have no bot image.
            if [ "$service" = bot ] && ! git show "$DEPLOY_COMMIT:docker-compose.yml" | grep -q '^  bot:'; then continue; fi
            image="ghcr.io/duelingdomain/yugioh-bot-$service"
            if ! docker manifest inspect --verbose "$image:release-$DEPLOY_COMMIT" > "$RUNNER_TEMP/rollback-manifest.json"; then
              # Old releases predate healthy release tags. New releases must never use a mutable build tag.
              git show "$DEPLOY_COMMIT:Dockerfile" > "$RUNNER_TEMP/rollback-Dockerfile"
              if grep -Eq '^FROM scratch AS web-sourcemaps$' "$RUNNER_TEMP/rollback-Dockerfile"; then
                echo "Missing healthy release tag for $service; rollback refused." >&2
                exit 1
              fi
              docker manifest inspect --verbose "$image:$DEPLOY_COMMIT" > "$RUNNER_TEMP/rollback-manifest.json"
            fi
            digest=$(python3 - "$RUNNER_TEMP/rollback-manifest.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as source:
              value=json.load(source)
          entries=value if isinstance(value,list) else [value]
          matching=[item for item in entries if item.get("Descriptor",{}).get("platform",{}).get("os")=="linux"
                    and item["Descriptor"]["platform"].get("architecture")=="arm64"]
          if len(matching)==1:
              print(matching[0]["Descriptor"]["digest"])
          elif len(entries)==1:
              print(entries[0]["Descriptor"]["digest"])
          else:
              sys.exit("Rollback image must have exactly one linux/arm64 manifest.")
          PY
            )
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || exit 1
            printf '%s %s\n' "$service" "$digest" > "$RUNNER_TEMP/image-digests/$service.digest"
          done

      - name: Prepare deployment transfer
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            mv "$RUNNER_TEMP/image-digests/deploy-bundle.tar.gz" "$RUNNER_TEMP/release/"
          fi
          test -s "$RUNNER_TEMP/release/deploy-bundle.tar.gz"
          cp "$RUNNER_TEMP/release/check-prod-activity.py" "$RUNNER_TEMP/check-prod-activity.py"
          cp "$RUNNER_TEMP/release/production-images.sh" "$RUNNER_TEMP/production-images.sh"
          cp "$RUNNER_TEMP/release/prepare-runtime-data.sh" "$RUNNER_TEMP/prepare-runtime-data.sh"
          cp "$RUNNER_TEMP/release/dueling-backup" "$RUNNER_TEMP/dueling-backup"
          : > "$RUNNER_TEMP/release/image-digests"
          for service in duel web worker ws bot; do
            if [ "$service" = bot ] && ! git show "$DEPLOY_COMMIT:docker-compose.yml" | grep -q '^  bot:'; then continue; fi
            cat "$RUNNER_TEMP/image-digests/$service.digest" >> "$RUNNER_TEMP/release/image-digests"
          done
          # Build-input hashes let the VM restart only the services whose images changed.
          # A rollback or an image from an older workflow has none, so the VM restarts everything.
          image_inputs=
          for service in duel web worker ws bot; do
            [ -f "$RUNNER_TEMP/image-digests/$service.inputs" ] || continue
            hash=$(awk -v service="$service" '$1 == service { print $2 }' "$RUNNER_TEMP/image-digests/$service.inputs")
            printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$' || { image_inputs=; break; }
            image_inputs="$image_inputs $service=$hash"
          done
          echo "DEPLOY_IMAGE_INPUTS=${image_inputs# }" >> "$GITHUB_ENV"
          # A reused web image carries the Sentry release of the commit that built it. Keep that value
          # so runtime events and the uploaded source maps share one release.
          sentry_release=$DEPLOY_COMMIT
          if [ -f "$RUNNER_TEMP/image-digests/sentry-release" ]; then
            candidate=$(cat "$RUNNER_TEMP/image-digests/sentry-release")
            if printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'; then sentry_release=$candidate; fi
          fi
          echo "DEPLOY_SENTRY_RELEASE=$sentry_release" >> "$GITHUB_ENV"

      - name: Configure SSH key
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/vm_deploy_key
          chmod 600 ~/.ssh/vm_deploy_key

      - name: Configure pinned VM host keys
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        env:
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          if [ -z "$VM_SSH_KNOWN_HOSTS" ]; then
            echo "Set the VM_SSH_KNOWN_HOSTS secret with the pinned VM host keys." >&2
            exit 1
          fi
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          set -eu
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "Set the production NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository variable." >&2; exit 1 ;;
          esac
          printf '%s' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" | grep -Eq '^pk_live_[A-Za-z0-9_-]+$' || exit 1
          # One SSH connection serves every call below. The pinned host keys still apply to it.
          mux_path=$(mktemp -u "$RUNNER_TEMP/vm-ssh.XXXXXX")
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key
            -o ControlMaster=auto -o ControlPath="$mux_path" -o ControlPersist=300)
          vm_ssh() { ssh "${ssh_opts[@]}" -p "$VM_PORT" "$VM_USER@$VM_HOST" "$@"; }
          vm_scp() { scp "${ssh_opts[@]}" -P "$VM_PORT" "$@"; }
          remote_dir=
          cleanup_transfer() {
            if [ -n "$remote_dir" ]; then
              vm_ssh "rm -rf -- '$remote_dir'" || true
            fi
            ssh "${ssh_opts[@]}" -p "$VM_PORT" -O exit "$VM_USER@$VM_HOST" >/dev/null 2>&1 || true
          }
          trap cleanup_transfer EXIT
          echo "Deploy phase: SSH setup and control transfer"
          # Open the shared connection once. If it fails, each call below connects on its own.
          ssh "${ssh_opts[@]}" -fN -p "$VM_PORT" "$VM_USER@$VM_HOST" || true
          staging=$(vm_ssh 'mktemp -d /tmp/yugidraft-deploy.XXXXXX')
          [[ "$staging" =~ ^/tmp/yugidraft-deploy\.[A-Za-z0-9]{6}$ ]] || exit 1
          remote_dir=$staging
          remote_bundle="$remote_dir/deploy-bundle.tar.gz"
          remote_guard="$remote_dir/check-prod-activity.py"
          remote_prepare="$remote_dir/prepare-runtime-data.sh"
          remote_images="$remote_dir/production-images.sh"
          remote_backup="$remote_dir/dueling-backup"
          remote_refs="$remote_dir/image-digests"
          vm_scp \
            "$RUNNER_TEMP/check-prod-activity.py" "$RUNNER_TEMP/prepare-runtime-data.sh" \
            "$RUNNER_TEMP/production-images.sh" "$RUNNER_TEMP/dueling-backup" \
            "$RUNNER_TEMP/release/image-digests" "$VM_USER@$VM_HOST:$remote_dir/"
          # Start the layer download now. It overlaps the bundle transfer and the VM safety checks, and changes
          # no tag. It warms only services with a new build-input hash, one at a time, for at most 15 minutes.
          # The verified pull on the VM stays in the script below and waits for it. A failure here is ignored.
          vm_ssh \
            "DEPLOY_IMAGE_INPUTS='$DEPLOY_IMAGE_INPUTS' DEPLOY_ROLLBACK='$DEPLOY_ROLLBACK' nohup timeout 900 sh '$remote_images' warm '$DEPLOY_COMMIT' '$remote_refs' </dev/null >/dev/null 2>&1 &" || true
          echo "Deploy phase: engine archive transfer"
          vm_scp "$RUNNER_TEMP/release/deploy-bundle.tar.gz" "$VM_USER@$VM_HOST:$remote_bundle"
          vm_ssh \
            "env DEPLOY_COMMIT='$DEPLOY_COMMIT' DEPLOY_BUNDLE='$remote_bundle' DEPLOY_GUARD='$remote_guard' DEPLOY_RUNTIME_PREPARE='$remote_prepare' DEPLOY_IMAGES='$remote_images' DEPLOY_BACKUP='$remote_backup' DEPLOY_IMAGE_REFS='$remote_refs' DEPLOY_FORCE='$DEPLOY_FORCE' DEPLOY_ROLLBACK='$DEPLOY_ROLLBACK' DEPLOY_WAIT_SECONDS='$DEPLOY_WAIT_SECONDS' DEPLOY_LIVE_ONLY='$DEPLOY_LIVE_ONLY' DEPLOY_SENTRY_RELEASE='$DEPLOY_SENTRY_RELEASE' DEPLOY_IMAGE_INPUTS='$DEPLOY_IMAGE_INPUTS' NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY='$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY' sh -s" <<'REMOTE'
             set -eu
             bundle_src=
             installer=
             runtime_compose=
             resolved_compose=
             cleanup() {
               rm -f "$DEPLOY_BUNDLE" "$DEPLOY_GUARD" "$DEPLOY_RUNTIME_PREPARE" "$DEPLOY_IMAGES" "$DEPLOY_BACKUP" "$DEPLOY_IMAGE_REFS"
               if [ -n "$installer" ]; then rm -rf "$installer"; fi
               if [ -n "$bundle_src" ]; then rm -rf "$bundle_src"; fi
               if [ -n "$runtime_compose" ]; then rm -f "$runtime_compose"; fi
               if [ -n "$resolved_compose" ]; then rm -f "$resolved_compose"; fi
             }
             trap cleanup EXIT
             trap 'exit 1' HUP INT TERM
             echo "Deploy phase: VM lock and ancestry"
             [ -f "$DEPLOY_RUNTIME_PREPARE" ] || { echo "DEPLOY_RUNTIME_PREPARE must be an existing helper" >&2; exit 1; }
             printf '%s' "$DEPLOY_COMMIT" | grep -Eq '^[0-9a-f]{40}$' || exit 1
             case "$DEPLOY_ROLLBACK" in true|false) ;; *) exit 1 ;; esac
             # Keep the lock for production deploys and owner maintenance; these must not overlap.
             if command -v flock >/dev/null 2>&1; then
               exec 9>/var/lock/yugidraft-build.lock
               flock -w 900 9 || { echo "Another production deploy or maintenance task holds the lock." >&2; exit 1; }
             else
               echo "flock is required for the production deployment lock. Install util-linux." >&2
               exit 1
             fi
             cd /opt/yugioh-bot
             git fetch origin "$DEPLOY_COMMIT"
             git fetch origin main && git merge-base --is-ancestor "$DEPLOY_COMMIT" FETCH_HEAD || exit 1
             if [ "$DEPLOY_ROLLBACK" != "true" ] && ! git merge-base --is-ancestor HEAD "$DEPLOY_COMMIT"; then
               echo "Production deploy refused: target is older than or diverges from the VM checkout. Set rollback=true only for an intended rollback." >&2
               exit 1
             fi
             # Ancestry checks are complete.
             # One total idle-wait budget, shared with the check immediately before service stops.
             idle_deadline=$(( $(date +%s) + DEPLOY_WAIT_SECONDS ))
             check_prod_activity() {
               remaining=$(( idle_deadline - $(date +%s) ))
               if [ "$remaining" -lt 0 ]; then remaining=0; fi
               set --
               if [ "$DEPLOY_LIVE_ONLY" = "true" ]; then set -- --live-only; fi
               python3 "$DEPLOY_GUARD" /opt/yugioh-bot/data/bot.sqlite --force "$DEPLOY_FORCE" --wait-seconds "$remaining" "$@"
             }
             echo "Deploy phase: initial gameplay guard"
             check_prod_activity
             # Preflight, before anything on the VM changes: the install script of the new commit, run in check-only
             # mode on the new bundle. Replay forks never block; every kind idle >10 minutes is ignored,
             # regardless of its decision clock. Competitive rows are preserved for host settlement.
             # It refuses while a live duel remains and the bundle would be replaced (or, for a new
             # multi core under an identical bundle, while a Tag or free-for-all duel is active). A refusal here leaves
             # the old checkout, the old images and the old containers as they were.
             echo "Deploy phase: engine bundle preflight"
             bundle_src=$(mktemp -d /tmp/yugidraft-duel-engine-src.XXXXXX)
             # The installer verifies the effect artifact pin relative to its own path, so stage it with the
             # new commit's verifier, pin source and effect data while the checkout still holds the old commit.
             installer=$(mktemp -d /tmp/yugidraft-install-engine-bundle.XXXXXX)
             tar -C "$bundle_src" -xzf "$DEPLOY_BUNDLE"
             git archive "$DEPLOY_COMMIT" packages/duel-server/scripts/install-engine-bundle.sh \
               packages/duel-server/scripts/verify-effect-artifact.py packages/shared/src/cards/effects/artifact.ts \
               packages/shared/data/effects | tar -C "$installer" -xf -
             if ! DUEL_PREFLIGHT=1 DUEL_BUNDLE_SRC="$bundle_src" DUEL_DATA_DIR=/opt/yugioh-bot/data/duel-engine \
               sh "$installer/packages/duel-server/scripts/install-engine-bundle.sh"; then
               echo "Deploy stopped before any change: drain the active duels (see docs/deployment/vm-runbook.md), then run the deploy again." >&2
               exit 1
             fi
             rm -rf "$installer"
             # Restart only the services whose build inputs changed. Every doubt means a full restart:
             # a rollback, no recorded inputs, a changed duel (engine, bundle or schema work), or any kept
             # container that is not running healthy on the confirmed image.
             all_services="duel web worker ws bot"
             deploy_services=
             partial=0
             for service in $all_services; do
               awk -v service="$service" '$1 == service { found=1 } END { exit !found }' "$DEPLOY_IMAGE_REFS" && deploy_services="$deploy_services $service"
             done
             if [ "$DEPLOY_ROLLBACK" != true ] && [ -n "$DEPLOY_IMAGE_INPUTS" ] && [ -f data/production-image-inputs ] && [ -f data/production-image-ids ]; then
               changed=
               for service in $deploy_services; do
                 new_hash=$(printf '%s\n' $DEPLOY_IMAGE_INPUTS | awk -F= -v service="$service" '$1 == service { print $2 }')
                 old_hash=$(awk -v service="$service" '$1 == service { print $2 }' data/production-image-inputs)
                 confirmed_id=$(awk -v service="$service" '$1 == service { print $2 }' data/production-image-ids)
                 container=$(docker compose -f docker-compose.yml ps -q "$service" 2>/dev/null | head -n 1)
                 keep=0
                 if [ -n "$new_hash" ] && [ "$new_hash" = "$old_hash" ] && [ -n "$confirmed_id" ] && [ -n "$container" ] &&
                   [ "$(docker inspect -f '{{.Image}}' "$container")" = "$confirmed_id" ] &&
                   [ "$(docker inspect -f '{{.State.Status}} {{.RestartCount}} {{.State.Health.Status}}' "$container")" = "running 0 healthy" ]; then
                   keep=1
                 fi
                 if [ "$keep" = 0 ]; then changed="$changed $service"; fi
               done
               case " $changed " in
                 *" duel "*) ;;
                 *) if [ -n "$changed" ]; then partial=1; deploy_services=${changed# }; fi ;;
               esac
             fi
             echo "Services to restart: $deploy_services (partial=$partial)"
             # Pull the release digests before backups, retagging or stopping any service.
             # Public GHCR packages need no VM login. A pull failure leaves live tags unchanged.
             echo "Deploy phase: verify and pull runtime images"
             DEPLOY_SERVICES="$deploy_services" sh "$DEPLOY_IMAGES" pull "$DEPLOY_COMMIT" "$DEPLOY_IMAGE_REFS"
             echo "Deploy phase: online backup and cutover preparation"
             # Preserve matching rollback code/env and the actual container image IDs before checkout/promotion.
             # Record the previous service set, including its bot image for PR 1 rollback.
             umask 077
             release_dir="/var/backups/yugioh-bot/pr2-$(date -u +%Y%m%d-%H%M%SZ)"
             mkdir -m 0700 "$release_dir"
             git rev-parse HEAD > "$release_dir/checkout-commit"
             printf '%s\n' "$DEPLOY_COMMIT" > "$release_dir/deploy-commit"
             cp -p .env "$release_dir/runtime.env"
             chmod 0600 "$release_dir/runtime.env"
             cp "$DEPLOY_IMAGE_REFS" "$release_dir/image-digests"
             : > "$release_dir/previous-image-digests.jsonl"
             : > "$release_dir/images.jsonl"
             preserve_previous_image() {
               confirmed_image=
               if [ -f data/production-image-ids ]; then
                 confirmed_image=$(awk -v service="$1" '$1 == service { print $2 }' data/production-image-ids)
               fi
               DEPLOY_CONFIRMED_IMAGE="$confirmed_image" sh "$DEPLOY_IMAGES" preserve "$DEPLOY_COMMIT" "$2" "$3"
             }
             for container in $(docker compose -f docker-compose.yml ps -aq); do
               service=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$container")
               case "$service" in duel|web|bot|ws|worker)
                 image_id=$(docker inspect -f '{{.Image}}' "$container")
                 docker image inspect --format '{{json .RepoDigests}}' "$image_id" >> "$release_dir/previous-image-digests.jsonl"
                 docker inspect -f '{"service":"{{index .Config.Labels "com.docker.compose.service"}}","imageId":"{{.Image}}","imageRef":"{{.Config.Image}}"}' "$container" >> "$release_dir/images.jsonl"
                 preserve_previous_image "$service" "$image_id" "yugioh-bot-$service:prev"
                 ;;
               esac
             done
             # Also keep :latest when a service has no existing container (for example after an owner stop).
             for service in duel web worker ws bot; do
               if ! grep -q "\"service\":\"$service\"" "$release_dir/images.jsonl" && \
                 docker image inspect "yugioh-bot-$service:latest" >/dev/null 2>&1; then
                 preserve_previous_image "$service" "yugioh-bot-$service:latest" "yugioh-bot-$service:prev"
               fi
             done
             DUELING_BACKUP_DIR="$release_dir/online" python3 scripts/backup/dueling-backup
             git reset --hard "$DEPLOY_COMMIT"
             # AGPL source offer: pack the engine source of this commit. Caddy serves site/public/source/ on the
             # marketing domain. A failure keeps the previous zip online and must not stop the release.
             python3 tools/engine-source/build-zip.py site/public/source/dueling-domain-engine.zip "$DEPLOY_COMMIT" \
               || echo "WARNING: engine source zip not updated; see docs/deployment/vm-runbook.md" >&2
             export SENTRY_RELEASE="${DEPLOY_SENTRY_RELEASE:-$DEPLOY_COMMIT}"
             sh scripts/ensure-env-secrets.sh .env DUEL_INTERNAL_SECRET
             DEPLOY_SERVICES="$deploy_services" sh "$DEPLOY_IMAGES" promote "$DEPLOY_COMMIT" "$DEPLOY_IMAGE_REFS"
             # Remove build definitions even from an older rollback checkout. Compose run has no --no-build option.
             # config resolves bind paths against /opt/yugioh-bot; keep the private runtime values in a 0600 temp file.
             runtime_compose=$(mktemp /tmp/yugidraft-runtime-compose.XXXXXX.json)
             docker compose -f docker-compose.yml config --format json | python3 -c '
          import json,os,sys
          config=json.load(sys.stdin)
          for name, service in config["services"].items():
              service.pop("build", None)
              if name in ("duel", "web", "worker", "ws", "bot"):
                  service["image"]="yugioh-bot-"+name+":latest"
              # Older rollback images have no /healthz. Their private listener
              # also opens after startup; GET / returns exactly 404 without DB work.
              if name == "duel" and os.environ["DEPLOY_ROLLBACK"] == "true" and "healthcheck" not in service:
                  service["healthcheck"]={
                      "test": ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:4003/\",{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.status===404?0:1),()=>process.exit(1))"],
                      "interval": "10s", "timeout": "5s", "retries": 3,
                      "start_period": "5m0s", "start_interval": "5s",
                  }
          json.dump(config, sys.stdout)
             ' > "$runtime_compose"
             # Re-read the generated model before any service stops. Never print private values.
             resolved_compose=$(mktemp /tmp/yugidraft-resolved-compose.XXXXXX.json)
             if ! docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot config --format json > "$resolved_compose" 2>/dev/null; then
               echo "Deploy stopped: runtime Compose configuration cannot be resolved." >&2
               exit 1
             fi
             python3 - "$runtime_compose" "$resolved_compose" <<'PY'
          import json,sys
          with open(sys.argv[1]) as before, open(sys.argv[2]) as after:
              if json.load(before) != json.load(after):
                  sys.exit("Deploy stopped: runtime Compose configuration changed after re-read; no service was stopped.")
          PY
             # Refuse a missing local worker image before stopping production.
             docker image inspect yugioh-bot-worker:latest >/dev/null
             # Recheck after the pulls and promotion, immediately before any production service is stopped.
             # A game may have started since the first check. Refusal leaves production running.
             echo "Deploy phase: final gameplay guard"
             if ! check_prod_activity; then
               echo "Do not run compose up. Run Deploy again." >&2
               exit 1
             fi
             # Retire the bot container before migration, including rollback to a release without it.
             echo "Deploy phase: stop writers"
             project=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$runtime_compose")
             if [ "$partial" = 1 ]; then
               stop_services=
               case " $deploy_services " in *" bot "*) retire_bot=1 ;; *) retire_bot=0 ;; esac
               for service in web worker ws; do
                 case " $deploy_services " in *" $service "*) stop_services="$stop_services $service" ;; esac
               done
             else
               stop_services="web duel worker ws"
               retire_bot=1
             fi
             if [ "$retire_bot" = 1 ]; then
               retired_ids=$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter label=com.docker.compose.service=bot)
               for container in $retired_ids; do docker stop "$container"; done
             fi
             if [ -n "$stop_services" ]; then
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot stop $stop_services
             fi
             # Once schema work can begin, failure must leave traffic stopped. Never restart old binaries.
             trap cleanup EXIT
             bot_service=$(python3 -c 'import json,sys; print("bot" if "bot" in json.load(open(sys.argv[1])).get("services", {}) else "")' "$runtime_compose")
             if [ "$partial" = 1 ]; then
               # Duel keeps running with the same engine, bundle and database schema: no drain, no
               # idle-close pass and no migration check are needed. Only the changed services restart.
               up_bot=$bot_service
               case " $deploy_services " in *" bot "*) ;; *) up_bot= ;; esac
               up_services=
               for service in web worker ws; do
                 case " $deploy_services " in *" $service "*) up_services="$up_services $service" ;; esac
               done
               # Caddy is recreated as before, which refreshes its Caddyfile bind mount.
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot rm -f -s $up_services caddy
               echo "Deploy phase: prepare runtime data"
               sh "$DEPLOY_RUNTIME_PREPARE" data
               echo "Deploy phase: start services"
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot up -d --no-build --no-deps $up_services caddy $up_bot
             else
               echo "Deploy phase: drained database backup"
               DUELING_BACKUP_DIR="$release_dir/drained" python3 scripts/backup/dueling-backup
               # With all gameplay services stopped, cancel stale forks and interrupt other stale casual duels without winners.
               # The earlier preflight and gameplay guard only read activity; replay journals survive cleanup.
               echo "Deploy phase: install engine bundle and settle idle duels"
               if ! DUEL_IDLE_CLOSE=1 DUEL_BUNDLE_SRC="$bundle_src" DUEL_DATA_DIR=/opt/yugioh-bot/data/duel-engine \
                 sh packages/duel-server/scripts/install-engine-bundle.sh; then
                 exit 1
               fi
               echo "Deploy phase: prepare runtime data for migration"
               sh "$DEPLOY_RUNTIME_PREPARE" data
               echo "Deploy phase: migration container"
               # The whole script comes on stdin (sh -s): every docker run/exec in it must read /dev/null, or it eats the rest of the script.
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot run --rm --no-deps --pull never worker node --input-type=module -e '
                 import {openDatabase} from "@yugidraft/shared/db";
                 const db=openDatabase(process.env.DATABASE_PATH);
                 try {
                   if(db.pragma("foreign_key_check").length)throw new Error("Foreign key check failed");
                   if(db.pragma("integrity_check",{simple:true})!=="ok")throw new Error("Integrity check failed");
                   console.log("identity migration verified");
                 } finally {db.close();}
               ' </dev/null
               echo "Deploy phase: remove old containers"
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot down --remove-orphans
               echo "Deploy phase: prepare runtime data for startup"
               sh "$DEPLOY_RUNTIME_PREPARE" data
               echo "Deploy phase: start services"
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot up -d --no-build ws duel web worker caddy $bot_service
             fi
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot logs --tail=40
             for service in duel ws worker; do
               echo "Deploy phase: wait for $service health"
               healthy=0
               # Duel can retry several startup DB phases. A ready service passes
               # immediately; the five-minute health start period is not a sleep.
               health_wait=180
               if [ "$service" = duel ]; then health_wait=360; fi
               health_deadline=$(( $(date +%s) + health_wait ))
               while :; do
                 container=$(docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps -q "$service")
                 state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}} {{.State.Health.Status}}' "$container")
                 restarts=$(printf '%s\n' "$state" | awk '{print $2}')
                 if [ "$service" = duel ] && [ "$restarts" -gt 0 ]; then
                   echo "The duel container restarted during startup: $state" >&2
                   break
                 fi
                 if [ "$state" = "running 0 healthy" ]; then healthy=1; break; fi
                 remaining=$(( health_deadline - $(date +%s) ))
                 if [ "$remaining" -le 0 ]; then break; fi
                 if [ "$remaining" -gt 2 ]; then remaining=2; fi
                 sleep "$remaining"
               done
               [ "$healthy" = 1 ] || { docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot logs --tail=60 "$service"; exit 1; }
             done
             # Anonymous login and sign-up checks, on the full and the partial path: no redirects, exact 200
             # for /sign-in, /sign-up, /waitlist and /api/auth/session, and an exact null session body.
             # Next listens on the container's HOSTNAME, not on 127.0.0.1. A restarted web needs time to
             # listen, so retry for up to three minutes. Failure keeps traffic as it is, the same as every
             # other failed check here, and fails the deploy.
             echo "Deploy phase: login flow smoke check"
             auth_ok=0
             for _attempt in $(seq 1 36); do
               if docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot exec -T web node -e '
                 const base = `http://${process.env.HOSTNAME}:3000`;
                 const get = path => fetch(`${base}${path}`, {redirect:"manual", signal: AbortSignal.timeout(10000)});
                 Promise.all(["/sign-in", "/sign-up", "/waitlist", "/api/auth/session"].map(get))
                   .then(async responses => { if(responses.some(response => response.status !== 200) || (await responses[3].text()).trim() !== "null") process.exit(1); })
                   .catch(() => process.exit(1));
               ' </dev/null; then auth_ok=1; break; fi
               sleep 5
             done
             [ "$auth_ok" = 1 ] || { docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot logs --tail=60 web; echo "The login, sign-up or waitlist check failed." >&2; exit 1; }
             echo "Deploy phase: final health and rollback records"
             # The web container must also still run with no restarts (it has no Compose healthcheck).
             web_state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$(docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps -q web)")
             if [ "$web_state" != "running 0" ]; then
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot logs --tail=60 web
               echo "The web container is not running with zero restarts: $web_state" >&2
               exit 1
             fi
             # Duel must still be healthy with no restarts after the other checks,
             # immediately before confirming any images as good for rollback.
             duel_state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}} {{.State.Health.Status}}' "$(docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps -q duel)")
             echo "duel container: $duel_state"
             if [ "$duel_state" != "running 0 healthy" ]; then
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot logs --tail=60 duel
               echo "The duel container is not healthy with zero restarts." >&2
               exit 1
             fi
             # Record success only after every health check passes. Retries keep the good :prev.
             : > data/production-image-ids.tmp
             for service in duel web worker ws $bot_service; do
               container=$(docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps -q "$service")
               # A bot outage must not fail a gameplay deploy or confirm a broken bot image.
               if [ "$service" = bot ] && [ "$(docker inspect -f '{{.State.Health.Status}}' "$container")" != healthy ]; then
                 echo "Bot has not passed its health check; use DISCORD_BOT_ENABLED=0 to disable it."
                 continue
               fi
               image_id=$(docker inspect -f '{{.Image}}' "$container")
               printf '%s %s\n' "$service" "$image_id" >> data/production-image-ids.tmp
             done
             mv data/production-image-ids.tmp data/production-image-ids
             # The inputs behind the confirmed images. Without them the next deploy restarts everything.
             if [ "$DEPLOY_ROLLBACK" != true ] && [ -n "$DEPLOY_IMAGE_INPUTS" ]; then
               printf '%s\n' $DEPLOY_IMAGE_INPUTS | tr '=' ' ' > data/production-image-inputs.tmp
               mv data/production-image-inputs.tmp data/production-image-inputs
             else
               rm -f data/production-image-inputs
             fi
             printf '%s\n' "$DEPLOY_COMMIT" > data/production-image-commit.tmp
             mv data/production-image-commit.tmp data/production-image-commit
             # Everything is healthy and recorded: free the disk. Rollbacks pull from GHCR, so the local :prev
             # images, old SHA tags and old release DB copies are no longer needed. Never fails the deploy.
             # DEPLOY_BACKUP is the workflow revision's script; an older rollback checkout may lack the flag.
             sh "$DEPLOY_IMAGES" drop-prev || echo "WARNING: could not remove previous images" >&2
             python3 "$DEPLOY_BACKUP" --prune-releases \
               || echo "WARNING: could not prune old release DB copies" >&2
             cleanup
             trap - EXIT
             echo "Production deployed SHA: $DEPLOY_COMMIT"
          REMOTE
          # The backticks are literal Markdown for the Actions summary.
          # shellcheck disable=SC2016
          printf 'Production deployed SHA: `%s`\n' "$DEPLOY_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Record healthy deployment attempt
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/release/confirmed-attempt"
          if [ "$DEPLOY_ROLLBACK" != true ]; then
            cp "$RUNNER_TEMP/image-digests/web-sourcemaps.tar.gz" "$RUNNER_TEMP/release/"
            printf '%s\n' "$DEPLOY_SENTRY_RELEASE" > "$RUNNER_TEMP/release/sentry-release"
          fi

      - name: Upload healthy deployment record
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-deployed-${{ env.DEPLOY_COMMIT }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/image-digests
            ${{ runner.temp }}/release/confirmed-attempt
            ${{ runner.temp }}/release/web-sourcemaps.tar.gz
            ${{ runner.temp }}/release/sentry-release
          if-no-files-found: error
          retention-days: 1

  retain:
    name: Retain healthy production images in GHCR
    needs: [prepare, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      GHCR_TOKEN: ${{ github.token }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      DEPLOY_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Download healthy deployment record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-deployed-${{ needs.prepare.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployed-release

      - name: Tag deployed and previous healthy manifests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const release = `${process.env.RUNNER_TEMP}/deployed-release`;
            let confirmedAttempt, imageDigests;
            try {
              confirmedAttempt = (await readFile(`${release}/confirmed-attempt`, 'utf8')).trim();
              imageDigests = await readFile(`${release}/image-digests`, 'utf8');
            } catch {
              throw new Error('Missing healthy deployment record; no tags were changed.');
            }
            // A failed-job retry can follow a newer deploy. Require fresh health checks.
            if (!/^[1-9][0-9]*$/.test(process.env.RUN_ATTEMPT || '') ||
                confirmedAttempt !== process.env.RUN_ATTEMPT) {
              throw new Error('Registry retention requires deploy health checks in the current run attempt. Dispatch a new Deploy run for the intended current release.');
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.DEPLOY_COMMIT || '')) throw new Error('Invalid healthy release SHA.');
            const { createHash } = await import('node:crypto');
            const services = ["duel", "web", "worker", "ws"];
            if (imageDigests.split('\n').some(line => line.startsWith('bot '))) services.push('bot');
            const digests = new Map();
            for (const line of imageDigests.trim().split('\n')) {
              const [service, digest, extra] = line.trim().split(/\s+/);
              if (!services.includes(service) || !/^sha256:[0-9a-f]{64}$/.test(digest || '') || extra || digests.has(service)) {
                throw new Error('Invalid deployed image digest list; no tags were changed.');
              }
              digests.set(service, digest);
            }
            if (digests.size !== services.length) throw new Error('Missing deployed image digests; no tags were changed.');
            const mediaTypes = [
              "application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"
            ];
            // Read every current and target manifest before changing any registry tags.
            const releases = await Promise.all(services.map(async service => {
              const repository = `${context.repo.owner.toLowerCase()}/yugioh-bot-${service}`;
              const auth = Buffer.from(`${context.actor}:${process.env.GHCR_TOKEN}`).toString('base64');
              const response = await fetch(`https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull,push`, {
                headers: { Authorization: `Basic ${auth}` }
              });
              if (!response.ok) throw new Error(`Cannot get registry token for ${repository}: HTTP ${response.status}`);
              const { token } = await response.json();
              if (!token) throw new Error(`Missing registry token for ${repository}`);
              const headers = { Authorization: `Bearer ${token}`, Accept: mediaTypes.join(', ') };
              const base = `https://ghcr.io/v2/${repository}/manifests/`;
              const read = async (reference, optional = false) => {
                const manifest = await fetch(`${base}${reference}`, { headers });
                if (optional && manifest.status === 404) return null;
                if (!manifest.ok) throw new Error(`Cannot read ${repository} manifest ${reference}: HTTP ${manifest.status}`);
                const type = (manifest.headers.get('content-type') || '').split(';')[0];
                const body = await manifest.text();
                const digest = `sha256:${createHash('sha256').update(body).digest('hex')}`;
                if (!mediaTypes.includes(type) || (reference.startsWith('sha256:') && digest !== reference)) {
                  throw new Error(`Invalid ${repository} manifest ${reference}`);
                }
                return { body, type, digest };
              };
              const [current, next] = await Promise.all([read('production', true), read(digests.get(service))]);
              return { repository, base, headers, current, next };
            }));
            // Keep tag order within each repository and finish all writes before releasing
            // workflow concurrency. A failed write still fails the job.
            const results = await Promise.allSettled(releases.map(async ({ repository, base, headers, current, next }) => {
              const tag = async (name, manifest) => {
                // Copy the original manifest bytes: retain the digest without wrapping it in a new index.
                const response = await fetch(`${base}${name}`, {
                  method: 'PUT', headers: { ...headers, 'Content-Type': manifest.type }, body: manifest.body
                });
                if (!response.ok) throw new Error(`Cannot tag ${repository}:${name}: HTTP ${response.status}`);
              };
              // An identical retry must keep the existing rollback digest.
              if (current && current.digest !== next.digest) await tag('production-prev', current);
              await tag(`release-${process.env.DEPLOY_COMMIT}`, next);
              await tag('production', next);
              core.info(`${repository}:production retains ${next.digest}`);
            }));
            const failures = results.filter(result => result.status === 'rejected').map(result => result.reason);
            if (failures.length) throw new AggregateError(failures, failures.map(error => error.message).join('\n'));

  report-release:
    name: Report healthy release to Sentry
    needs: [prepare, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.prepare.outputs.rollback != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check whether Sentry reporting is configured
        id: config
        env:
          SENTRY_CONFIGURED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' && 'true' || 'false' }}
        run: |
          if [ "$SENTRY_CONFIGURED" != true ]; then
            echo "Sentry upload is not configured; skip release reporting."
          fi
          echo "configured=$SENTRY_CONFIGURED" >> "$GITHUB_OUTPUT"

      - name: Checkout reporting tools from workflow revision
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download healthy deployment source maps
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-deployed-${{ needs.prepare.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployed-release
      - name: Setup Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install locked reporting tools without lifecycle scripts
        if: steps.config.outputs.configured == 'true'
        run: npm ci --ignore-scripts
      - name: Upload source maps and record healthy Sentry release
        if: steps.config.outputs.configured == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ needs.prepare.outputs.commit }}
        run: |
          # A reused web image keeps the release its source maps were built for.
          if [ -f "$RUNNER_TEMP/deployed-release/sentry-release" ]; then
            candidate=$(cat "$RUNNER_TEMP/deployed-release/sentry-release")
            if printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'; then SENTRY_RELEASE=$candidate; fi
          fi
          mkdir -p "$RUNNER_TEMP/sentry-maps"
          tar -C "$RUNNER_TEMP/sentry-maps" -xzf "$RUNNER_TEMP/deployed-release/web-sourcemaps.tar.gz"
          IFS=',' read -ra projects <<< "$SENTRY_PROJECT"
          for project in "${projects[@]}"; do
            export SENTRY_PROJECT="$(echo "$project" | xargs)"
            test -n "$SENTRY_PROJECT"
            node_modules/.bin/sentry-cli releases new "$SENTRY_RELEASE"
            if find "$RUNNER_TEMP/sentry-maps" -type f -name '*.map' -print -quit | grep -q .; then
              node_modules/.bin/sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" "$RUNNER_TEMP/sentry-maps"
            else
              echo "Older release has no exported source maps; skip upload."
            fi
            node_modules/.bin/sentry-cli releases finalize "$SENTRY_RELEASE"
            node_modules/.bin/sentry-cli releases deploys "$SENTRY_RELEASE" new -e production
          done

  # Best effort: tell IndexNow search engines about changed marketing pages after a healthy deploy.
  # The script only warns on failure and the job cannot fail the release.
  indexnow:
    name: Ping IndexNow for changed site pages
    needs: [prepare, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.prepare.outputs.rollback != 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 2
          persist-credentials: false
      - name: Ping IndexNow
        env:
          DEPLOY_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 site/src/indexnow.py --base "$DEPLOY_COMMIT^1" --head "$DEPLOY_COMMIT" || echo "WARNING: IndexNow ping skipped" >&2
