name: Deploy
run-name: ${{ github.event_name == 'workflow_run' && format('Deploy {0} (Test {1})', github.event.workflow_run.head_sha, github.event.workflow_run.conclusion) || format('Deploy {0}', inputs.ref) }}

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref or SHA to deploy (must be on main and have passed a push Test run)"
        required: true
        default: main
        type: string
      force:
        description: "Allow deploy during active gameplay (engine preflight still applies)"
        required: false
        default: false
        type: boolean
      rollback:
        description: "Allow an older production SHA (restore matching DB and env if needed)"
        required: false
        default: false
        type: boolean

# Serialize preparation, cache writes, builds and deploys. Keep every pending run:
# late older runs must never replace a newer pending release.
concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare verified production release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      VM_DEPLOY_ENABLED: ${{ secrets.VM_HOST != '' && secrets.VM_USER != '' && secrets.VM_SSH_PRIVATE_KEY != '' && 'true' || 'false' }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      DEPLOY_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      DEPLOY_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback && 'true' || 'false' }}
      DEPLOY_WAIT_SECONDS: ${{ github.event_name == 'workflow_run' && '3600' || '0' }}
      DEPLOY_LIVE_ONLY: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
      # Public production key only. The secret remains in the protected VM runtime env.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

    outputs:
      commit: ${{ steps.release.outputs.commit }}
      rollback: ${{ env.DEPLOY_ROLLBACK }}
      superseded: ${{ steps.superseded.outputs.skip }}

    steps:
      - name: Skip superseded automatic release
        id: superseded
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.setOutput('skip', 'false');
            if (context.eventName !== 'workflow_run') return;
            const target = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            const { data: branch } = await github.request('GET /repos/{owner}/{repo}/branches/{branch}', {
              owner, repo, branch: 'main'
            });
            const main = branch.commit.sha;
            const newer = new Set();
            for (let page = 1; ; page++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                owner, repo, basehead: `${target}...${main}`, per_page: 100, page
              });
              if (data.status !== 'ahead') return;
              for (const commit of data.commits) newer.add(commit.sha);
              if (newer.size >= data.total_commits) break;
              if (!data.commits.length) throw new Error('Cannot read all newer main commits.');
            }
            const superseded = async (sha, reason) => {
              core.info(`Superseded: ${target}; newer main commit ${sha} ${reason}. Skipping prepare, build and deploy.`);
              await core.summary.addRaw(`Superseded by ${sha}: ${reason}.\n`).write();
              core.setOutput('skip', 'true');
            };
            const tests = await github.paginate('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              owner, repo, workflow_id: 'test.yml', branch: 'main', event: 'push', status: 'success', per_page: 100
            });
            const passed = tests.find(run => newer.has(run.head_sha));
            if (passed) { await superseded(passed.head_sha, 'passed push Test'); return; }
            const queued = await github.paginate('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              owner, repo, workflow_id: 'deploy.yml', branch: 'main', event: 'workflow_run', per_page: 100
            });
            for (const run of queued) {
              if (run.id === context.runId || !['queued', 'pending', 'waiting', 'requested'].includes(run.status)) continue;
              // workflow_run head_sha can describe the workflow revision. Use the trigger SHA in run-name.
              const match = /^Deploy ([0-9a-f]{40}) \(Test success\)$/.exec(run.display_title || '');
              if (match && newer.has(match[1])) { await superseded(match[1], 'has a newer deploy run queued'); return; }
            }

      - name: Fail when VM secrets are not configured
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED != 'true' }}
        run: |
          echo "VM deploy secrets are not configured; production was not deployed." >&2
          exit 1

      - name: Checkout
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Keep deployment controls from the workflow revision, even when deploying an older main SHA.
      - name: Save deployment activity guard
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          cp scripts/deployment/check-prod-activity.py "$RUNNER_TEMP/check-prod-activity.py"
          cp scripts/deployment/production-images.sh "$RUNNER_TEMP/production-images.sh"
          cp scripts/deployment/prepare-runtime-data.sh "$RUNNER_TEMP/prepare-runtime-data.sh"

      - name: Checkout deploy ref
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Verify deploy ref is on main
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: git fetch origin main && git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Record checked-out deploy commit
        id: release
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          commit=$(git rev-parse HEAD)
          echo "DEPLOY_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Verify manual deploy commit passed Test
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs" \
            -f head_sha="$DEPLOY_COMMIT" -f branch=main -f event=push -f status=success --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "Production deploy refused: $DEPLOY_COMMIT has no successful push Test run on main." >&2
            exit 1
          fi

      - name: Compute bundle cache key
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: echo "BUNDLE_CACHE_KEY=duel-engine-${{ hashFiles('packages/duel-server/scripts/prepare-data.ts', 'packages/duel-server/scripts/card-script-patches.ts', 'packages/duel-server/card-script-patches/**', 'packages/duel-server/scripts/released-card-data.ts', 'packages/duel-server/scripts/prerelease-history.ts', 'packages/duel-server/scripts/prerelease-graduations.ts', 'packages/duel-server/scripts/prerelease-script-smoke.ts', 'packages/duel-server/scripts/prerelease-script-exclusions.ts', 'packages/duel-server/card-remap-overrides.json', 'packages/duel-server/scripts/build-domain-core.ts', 'packages/duel-server/scripts/build-domain-core.sh', 'packages/duel-server/scripts/build-standard-core.sh', 'packages/duel-server/domain-core/pins.json', 'packages/duel-server/domain-core/src/**', 'packages/duel-server/domain-core/lua/**', 'packages/duel-server/legacy-1v1/**', 'packages/duel-server/domain-core/multi-scripts/**', 'packages/duel-server/src/multi-scripts.ts', 'packages/duel-server/src/released-database-files.ts', 'packages/duel-server/src/cards.ts', 'packages/shared/src/duels/**', 'packages/shared/package.json', 'packages/shared/tsconfig*.json', 'tsconfig.json', 'patches/ocgcore-wasm+0.1.2.patch', 'package-lock.json') }}" >> "$GITHUB_ENV"

      - name: Restore pinned duel-engine bundle
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        id: bundle
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/duel-engine
          key: ${{ env.BUNDLE_CACHE_KEY }}

      - name: Setup Node.js
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && steps.bundle.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install duel-engine build dependencies
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && steps.bundle.outputs.cache-hit != 'true' }}
        run: |
          npm ci --ignore-scripts
          npx patch-package --error-on-fail
          # duel:prepare merges release card databases with better-sqlite3.
          npm rebuild better-sqlite3

      - name: Build shared for card preparation
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && steps.bundle.outputs.cache-hit != 'true' }}
        run: npm run build --workspace=packages/shared

      - name: Prepare card data and scripts
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && steps.bundle.outputs.cache-hit != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run duel:prepare

      - name: Build pinned duel-engine cores
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && steps.bundle.outputs.cache-hit != 'true' }}
        run: |
          docker pull docker.io/emscripten/emsdk:4.0.9@sha256:3c853ef9c3b4c2708da1adac2fdfdba49c775fdc4144ceef4989423963e96811
          npx tsx packages/duel-server/scripts/build-domain-core.ts
          npx tsx packages/duel-server/scripts/build-domain-core.ts standard
          # The approved legacy Domain core, next to the merged cores. Domain 1v1 uses it by default.
          npx tsx packages/duel-server/scripts/build-domain-core.ts legacy-domain

      - name: Save pinned duel-engine bundle
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && steps.bundle.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/duel-engine
          key: ${{ env.BUNDLE_CACHE_KEY }}

      # The pinned bundle above (data/duel-engine) now holds the merged cores (ocgcore.standard.wasm, ocgcore.domain.wasm) AND the
      # legacy 1v1 files (ocgcore.domain.legacy.wasm, card-scripts/domain.legacy.lua). Its cache key hashes legacy-1v1/** and
      # build-standard-core.sh too, so the first deploy of the merge builds the bundle again and the bundle changes: the deploy
      # preflight then needs an empty server (no active duel), see docs/deployment/vm-runbook.md. Compose defaults Standard 1v1
      # to DUEL_STANDARD_1V1_ENGINE=pinned; Domain keeps DUEL_1V1_ENGINE=legacy (docs/deployment/duel-engine-switch.md).
      # The multi-duelist core (Tag and 3 and 4 player tables) is NOT part of the pinned bundle: it travels next to the bundle in the
      # deploy tarball and is installed by packages/duel-server/scripts/install-engine-bundle.sh. The server loads it only for tables
      # with more than 2 seats, and MULTIPLAYER_TABLES (default on; set 0 in .env to close) controls those tables.
      # Production cache inputs: pins, full series, build scripts and Domain sources.
      # The version prefix is a literal: raise it when the build step below changes (the hash cannot see it).
      - name: Compute multi core cache key
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: echo "MULTI_CACHE_KEY=duel-multi-cores-v2-${{ hashFiles('packages/duel-server/scripts/build-deploy-multi-cores.sh', 'packages/duel-server/scripts/package-deploy-multi-cores.mjs', 'packages/duel-server/scripts/build-multi-core.sh', 'packages/duel-server/scripts/prepare-multi-core-tree.sh', 'packages/duel-server/scripts/multi-core-common.sh', 'packages/duel-server/domain-core/pins.json', 'packages/duel-server/domain-core/patches/*.patch', 'packages/duel-server/domain-core/src/**') }}" >> "$GITHUB_ENV"

      - name: Read the emsdk image from pins.json
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: node -p "const e = require('./packages/duel-server/domain-core/pins.json').emscripten; 'EMSDK_IMAGE=' + e.image + '@' + e.digest" >> "$GITHUB_ENV"

      - name: Restore multi cores
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        id: multi
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
            packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
            packages/duel-server/domain-core/dist/ocgcore.multi-build-info.json
            packages/duel-server/domain-core/dist/ocgcore.multi-domain-build-info.json
          key: ${{ env.MULTI_CACHE_KEY }}

      # Both cores use the full patch series. Domain also uses APPLY_DOMAIN=1 DOMAIN_MULTI=1.
      # Production Lua randomness: no LUA_FIXED_SEED (test.yml keeps that flag for differential tests).
      - name: Build multi cores
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && steps.multi.outputs.cache-hit != 'true' }}
        run: bash packages/duel-server/scripts/build-deploy-multi-cores.sh

      - name: Save multi cores
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' && steps.multi.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
            packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
            packages/duel-server/domain-core/dist/ocgcore.multi-build-info.json
            packages/duel-server/domain-core/dist/ocgcore.multi-domain-build-info.json
          key: ${{ env.MULTI_CACHE_KEY }}

      - name: Verify duel-engine bundle
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          DUEL_DATA_DIR="$PWD/data/duel-engine" sh packages/duel-server/scripts/install-engine-bundle.sh
          # The legacy 1v1 files must match the approved legacy pin (sha256 pinned in legacy-1v1/expected-sha256.txt), also when the bundle came from the cache.
          sh packages/duel-server/scripts/check-legacy-pin.sh "$PWD/data/duel-engine"

      # The deploy tarball is made here, not from data/duel-engine: that folder stays the pinned bundle.
      # The check at the end runs the install script on this exact content, in a scratch folder of the runner.
      - name: Add both multi cores to the deploy bundle
        if: ${{ steps.superseded.outputs.skip != 'true' && env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          set -eu
          bundle="$RUNNER_TEMP/deploy-bundle"
          rm -rf "$bundle" "$RUNNER_TEMP/deploy-bundle-check"
          mkdir -p "$bundle"
          cp -a data/duel-engine/. "$bundle/"
          node packages/duel-server/scripts/package-deploy-multi-cores.mjs "$bundle"
          DUEL_BUNDLE_SRC="$bundle" DUEL_DATA_DIR="$RUNNER_TEMP/deploy-bundle-check/duel-engine" \
            sh packages/duel-server/scripts/install-engine-bundle.sh
          for core in ocgcore.multi ocgcore.multi-domain; do
            cmp "$RUNNER_TEMP/deploy-bundle-check/duel-engine/$core.wasm" "$bundle/$core.wasm"
            cat "$bundle/$core.SOURCE" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -rf "$RUNNER_TEMP/deploy-bundle-check"
          tar -C "$bundle" -czf "$RUNNER_TEMP/deploy-bundle.tar.gz" .

      - name: Upload verified release controls and bundle
        if: ${{ steps.superseded.outputs.skip != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-deploy-${{ env.DEPLOY_COMMIT }}
          path: |
            ${{ runner.temp }}/deploy-bundle.tar.gz
            ${{ runner.temp }}/check-prod-activity.py
            ${{ runner.temp }}/production-images.sh
            ${{ runner.temp }}/prepare-runtime-data.sh
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0

  build:
    name: Build ARM64 ${{ matrix.service }} image
    needs: prepare
    if: needs.prepare.outputs.superseded != 'true' && needs.prepare.outputs.rollback != 'true'
    runs-on: ubuntu-24.04-arm
    # Only web needs the production environment source-map upload secret.
    environment: ${{ matrix.service == 'web' && 'production' || '' }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: duel
            target: duel-bundled
          - service: web
            target: web
          - service: worker
            target: worker
          - service: ws
            target: ws
    env:
      DEPLOY_COMMIT: ${{ needs.prepare.outputs.commit }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      IMAGE: ghcr.io/duelingdomain/yugioh-bot-${{ matrix.service }}
    steps:
      - name: Validate prepare commit output
        shell: bash
        run: |
          if [[ ! "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::prepare commit output missing or invalid (maybe masked as a secret); dispatch a new Deploy" >&2
            exit 1
          fi

      - name: Checkout verified deploy commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Check production public key
        run: |
          printf '%s' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" | grep -Eq '^pk_live_[A-Za-z0-9_-]+$' || {
            echo "Set the production NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository variable." >&2
            exit 1
          }

      - name: Download verified engine bundle
        if: matrix.service == 'duel'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-deploy-${{ needs.prepare.outputs.commit }}
          path: ${{ runner.temp }}/release

      - name: Prepare named engine context
        run: |
          mkdir -p "$RUNNER_TEMP/engine"
          if [ "$IMAGE" = ghcr.io/duelingdomain/yugioh-bot-duel ]; then
            tar -C "$RUNNER_TEMP/engine" -xzf "$RUNNER_TEMP/release/deploy-bundle.tar.gz"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Find previous Next.js cache
        if: matrix.service == 'web'
        id: next-cache
        run: |
          if docker buildx imagetools inspect "$IMAGE:nextcache" >/dev/null 2>&1; then
            echo "context=nextcache=docker-image://$IMAGE:nextcache" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push runtime image
        id: runtime-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.DEPLOY_COMMIT }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ matrix.service == 'web' && vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
            SENTRY_ORG=${{ matrix.service == 'web' && vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ matrix.service == 'web' && vars.SENTRY_PROJECT || '' }}
            SENTRY_ENVIRONMENT=${{ matrix.service == 'web' && 'production' || '' }}
            SENTRY_RELEASE=${{ matrix.service == 'web' && env.DEPLOY_COMMIT || '' }}
            SENTRY_UPLOAD_SOURCEMAPS=${{ matrix.service == 'web' && secrets.SENTRY_AUTH_TOKEN != '' && '1' || '0' }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ matrix.service == 'web' && secrets.SENTRY_AUTH_TOKEN || '' }}
          build-contexts: |
            engine=${{ runner.temp }}/engine
            ${{ steps.next-cache.outputs.context }}
          labels: |
            org.opencontainers.image.source=https://github.com/DuelingDomain/yugioh-bot
            org.opencontainers.image.revision=${{ env.DEPLOY_COMMIT }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Record runtime image digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_DIGEST: ${{ steps.runtime-image.outputs.digest }}
        run: |
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || exit 1
          mkdir -p "$RUNNER_TEMP/image-digests"
          printf '%s %s\n' "$SERVICE" "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digests/$SERVICE.digest"
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-${{ matrix.service }}-${{ env.DEPLOY_COMMIT }}
          path: ${{ runner.temp }}/image-digests/${{ matrix.service }}.digest
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Save Next.js cache for the next source revision
        if: matrix.service == 'web'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web-cache
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:nextcache
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ matrix.service == 'web' && vars.NEXT_PUBLIC_SENTRY_DSN || '' }}
            SENTRY_ORG=${{ matrix.service == 'web' && vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ matrix.service == 'web' && vars.SENTRY_PROJECT || '' }}
            SENTRY_ENVIRONMENT=${{ matrix.service == 'web' && 'production' || '' }}
            SENTRY_RELEASE=${{ matrix.service == 'web' && env.DEPLOY_COMMIT || '' }}
            SENTRY_UPLOAD_SOURCEMAPS=${{ matrix.service == 'web' && secrets.SENTRY_AUTH_TOKEN != '' && '1' || '0' }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ matrix.service == 'web' && secrets.SENTRY_AUTH_TOKEN || '' }}
          build-contexts: ${{ steps.next-cache.outputs.context }}
          labels: |
            org.opencontainers.image.source=https://github.com/DuelingDomain/yugioh-bot
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

  deploy:
    name: Deploy to Production VM
    needs: [prepare, build]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.superseded != 'true' &&
      (needs.build.result == 'success' ||
      (needs.prepare.outputs.rollback == 'true' && needs.build.result == 'skipped')) &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_DEPLOY_ENABLED: ${{ secrets.VM_HOST != '' && secrets.VM_USER != '' && secrets.VM_SSH_PRIVATE_KEY != '' && 'true' || 'false' }}
      VM_PORT: ${{ secrets.VM_PORT || '22' }}
      DEPLOY_COMMIT: ${{ needs.prepare.outputs.commit }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      DEPLOY_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      DEPLOY_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback && 'true' || 'false' }}
      DEPLOY_WAIT_SECONDS: ${{ github.event_name == 'workflow_run' && '3600' || '0' }}
      DEPLOY_LIVE_ONLY: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
      # Public production key only. The secret remains in the protected VM runtime env.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Validate prepare commit output
        shell: bash
        run: |
          if [[ ! "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::prepare commit output missing or invalid (maybe masked as a secret); dispatch a new Deploy" >&2
            exit 1
          fi

      - name: Checkout verified deploy commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Download verified release controls and bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-deploy-${{ needs.prepare.outputs.commit }}
          path: ${{ runner.temp }}/release

      - name: Download runtime image digests
        if: needs.prepare.outputs.rollback != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: production-image-*-${{ needs.prepare.outputs.commit }}
          merge-multiple: true
          path: ${{ runner.temp }}/image-digests

      - name: Resolve retained rollback digests
        if: needs.prepare.outputs.rollback == 'true'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/image-digests"
          for service in duel web worker ws; do
            image="ghcr.io/duelingdomain/yugioh-bot-$service:$DEPLOY_COMMIT"
            docker manifest inspect --verbose "$image" > "$RUNNER_TEMP/rollback-manifest.json"
            digest=$(python3 - "$RUNNER_TEMP/rollback-manifest.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as source:
              value=json.load(source)
          entries=value if isinstance(value,list) else [value]
          matching=[item for item in entries if item.get("Descriptor",{}).get("platform",{}).get("os")=="linux"
                    and item["Descriptor"]["platform"].get("architecture")=="arm64"]
          if len(matching)==1:
              print(matching[0]["Descriptor"]["digest"])
          elif len(entries)==1:
              print(entries[0]["Descriptor"]["digest"])
          else:
              sys.exit("Rollback image must have exactly one linux/arm64 manifest.")
          PY
            )
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || exit 1
            printf '%s %s\n' "$service" "$digest" > "$RUNNER_TEMP/image-digests/$service.digest"
          done

      - name: Prepare deployment transfer
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-bundle"
          tar -C "$RUNNER_TEMP/deploy-bundle" -xzf "$RUNNER_TEMP/release/deploy-bundle.tar.gz"
          cp "$RUNNER_TEMP/release/check-prod-activity.py" "$RUNNER_TEMP/check-prod-activity.py"
          cp "$RUNNER_TEMP/release/production-images.sh" "$RUNNER_TEMP/production-images.sh"
          cp "$RUNNER_TEMP/release/prepare-runtime-data.sh" "$RUNNER_TEMP/prepare-runtime-data.sh"
          : > "$RUNNER_TEMP/release/image-digests"
          for service in duel web worker ws; do
            cat "$RUNNER_TEMP/image-digests/$service.digest" >> "$RUNNER_TEMP/release/image-digests"
          done

      - name: Configure SSH key
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/vm_deploy_key
          chmod 600 ~/.ssh/vm_deploy_key

      - name: Configure pinned VM host keys
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        env:
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          if [ -z "$VM_SSH_KNOWN_HOSTS" ]; then
            echo "Set the VM_SSH_KNOWN_HOSTS secret with the pinned VM host keys." >&2
            exit 1
          fi
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        run: |
          set -eu
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "Set the production NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository variable." >&2; exit 1 ;;
          esac
          printf '%s' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" | grep -Eq '^pk_live_[A-Za-z0-9_-]+$' || exit 1
          bundle_tar=$(mktemp "$RUNNER_TEMP/duel-engine.XXXXXX.tar.gz")
          remote_bundle=
          remote_guard=
          remote_prepare=
          remote_images=
          remote_refs=
          cleanup_transfer() {
            rm -f "$bundle_tar"
            if [ -n "$remote_bundle" ]; then
              ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
                "rm -f -- '$remote_bundle'" || true
            fi
            if [ -n "$remote_guard" ]; then
              ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
                "rm -f -- '$remote_guard'" || true
            fi
            if [ -n "$remote_prepare" ]; then
              ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
                "rm -f -- '$remote_prepare'" || true
            fi
            if [ -n "$remote_images" ]; then
              ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
                "rm -f -- '$remote_images'" || true
            fi
            if [ -n "$remote_refs" ]; then
              ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
                "rm -f -- '$remote_refs'" || true
            fi
          }
          trap cleanup_transfer EXIT
          remote_bundle=$(ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            'mktemp /tmp/yugidraft-duel-engine.XXXXXX.tar.gz')
          printf '%s' "$remote_bundle" | grep -Eq '^/tmp/yugidraft-duel-engine\.[A-Za-z0-9]{6}\.tar\.gz$' || exit 1
          remote_guard=$(ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            'mktemp /tmp/yugidraft-activity-guard.XXXXXX.py')
          printf '%s' "$remote_guard" | grep -Eq '^/tmp/yugidraft-activity-guard\.[A-Za-z0-9]{6}\.py$' || exit 1
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -P "$VM_PORT" \
            "$RUNNER_TEMP/check-prod-activity.py" "$VM_USER@$VM_HOST:$remote_guard"
          remote_prepare=$(ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            'mktemp /tmp/yugidraft-runtime-prepare.XXXXXX.sh')
          printf '%s' "$remote_prepare" | grep -Eq '^/tmp/yugidraft-runtime-prepare\.[A-Za-z0-9]{6}\.sh$' || exit 1
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -P "$VM_PORT" \
            "$RUNNER_TEMP/prepare-runtime-data.sh" "$VM_USER@$VM_HOST:$remote_prepare"
          remote_images=$(ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            'mktemp /tmp/yugidraft-images.XXXXXX.sh')
          printf '%s' "$remote_images" | grep -Eq '^/tmp/yugidraft-images\.[A-Za-z0-9]{6}\.sh$' || exit 1
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -P "$VM_PORT" \
            "$RUNNER_TEMP/production-images.sh" "$VM_USER@$VM_HOST:$remote_images"
          remote_refs=$(ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            'mktemp /tmp/yugidraft-image-digests.XXXXXX.txt')
          printf '%s' "$remote_refs" | grep -Eq '^/tmp/yugidraft-image-digests\.[A-Za-z0-9]{6}\.txt$' || exit 1
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -P "$VM_PORT" \
            "$RUNNER_TEMP/release/image-digests" "$VM_USER@$VM_HOST:$remote_refs"
          tar -C "$RUNNER_TEMP/deploy-bundle" -czf "$bundle_tar" .
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key -P "$VM_PORT" \
            "$bundle_tar" \
            "$VM_USER@$VM_HOST:$remote_bundle"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -i ~/.ssh/vm_deploy_key \
            -p "$VM_PORT" \
            "$VM_USER@$VM_HOST" \
            "env DEPLOY_COMMIT='$DEPLOY_COMMIT' DEPLOY_BUNDLE='$remote_bundle' DEPLOY_GUARD='$remote_guard' DEPLOY_RUNTIME_PREPARE='$remote_prepare' DEPLOY_IMAGES='$remote_images' DEPLOY_IMAGE_REFS='$remote_refs' DEPLOY_FORCE='$DEPLOY_FORCE' DEPLOY_ROLLBACK='$DEPLOY_ROLLBACK' DEPLOY_WAIT_SECONDS='$DEPLOY_WAIT_SECONDS' DEPLOY_LIVE_ONLY='$DEPLOY_LIVE_ONLY' NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY='$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY' sh -s" <<'REMOTE'
             set -eu
             bundle_src=
             installer=
             runtime_compose=
             resolved_compose=
             cleanup() {
               rm -f "$DEPLOY_BUNDLE" "$DEPLOY_GUARD" "$DEPLOY_RUNTIME_PREPARE" "$DEPLOY_IMAGES" "$DEPLOY_IMAGE_REFS"
               if [ -n "$installer" ]; then rm -f "$installer"; fi
               if [ -n "$bundle_src" ]; then rm -rf "$bundle_src"; fi
               if [ -n "$runtime_compose" ]; then rm -f "$runtime_compose"; fi
               if [ -n "$resolved_compose" ]; then rm -f "$resolved_compose"; fi
             }
             trap cleanup EXIT
             trap 'exit 1' HUP INT TERM
             [ -f "$DEPLOY_RUNTIME_PREPARE" ] || { echo "DEPLOY_RUNTIME_PREPARE must be an existing helper" >&2; exit 1; }
             printf '%s' "$DEPLOY_COMMIT" | grep -Eq '^[0-9a-f]{40}$' || exit 1
             case "$DEPLOY_ROLLBACK" in true|false) ;; *) exit 1 ;; esac
             # Keep the lock for production deploys and owner maintenance; these must not overlap.
             if command -v flock >/dev/null 2>&1; then
               exec 9>/var/lock/yugidraft-build.lock
               flock -w 900 9 || { echo "Another production deploy or maintenance task holds the lock." >&2; exit 1; }
             else
               echo "flock is required for the production deployment lock. Install util-linux." >&2
               exit 1
             fi
             cd /opt/yugioh-bot
             git fetch origin "$DEPLOY_COMMIT"
             git fetch origin main && git merge-base --is-ancestor "$DEPLOY_COMMIT" FETCH_HEAD || exit 1
             if [ "$DEPLOY_ROLLBACK" != "true" ] && ! git merge-base --is-ancestor HEAD "$DEPLOY_COMMIT"; then
               echo "Production deploy refused: target is older than or diverges from the VM checkout. Set rollback=true only for an intended rollback." >&2
               exit 1
             fi
             # Ancestry checks are complete.
             # One total idle-wait budget, shared with the check immediately before service stops.
             idle_deadline=$(( $(date +%s) + DEPLOY_WAIT_SECONDS ))
             check_prod_activity() {
               remaining=$(( idle_deadline - $(date +%s) ))
               if [ "$remaining" -lt 0 ]; then remaining=0; fi
               set --
               if [ "$DEPLOY_LIVE_ONLY" = "true" ]; then set -- --live-only; fi
               python3 "$DEPLOY_GUARD" /opt/yugioh-bot/data/bot.sqlite --force "$DEPLOY_FORCE" --wait-seconds "$remaining" "$@"
             }
             check_prod_activity
             # Preflight, before anything on the VM changes: the install script of the new commit, run in check-only
             # mode on the new bundle. It refuses while a duel is active and the bundle would be replaced (or, for a new
             # multi core under an identical bundle, while a Tag or free-for-all duel is active). A refusal here leaves
             # the old checkout, the old images and the old containers as they were.
             bundle_src=$(mktemp -d /tmp/yugidraft-duel-engine-src.XXXXXX)
             installer=$(mktemp /tmp/yugidraft-install-engine-bundle.XXXXXX.sh)
             tar -C "$bundle_src" -xzf "$DEPLOY_BUNDLE"
             git show "$DEPLOY_COMMIT":packages/duel-server/scripts/install-engine-bundle.sh > "$installer"
             if ! DUEL_PREFLIGHT=1 DUEL_BUNDLE_SRC="$bundle_src" DUEL_DATA_DIR=/opt/yugioh-bot/data/duel-engine \
               sh "$installer"; then
               echo "Deploy stopped before any change: drain the active duels (see docs/deployment/vm-runbook.md), then run the deploy again." >&2
               exit 1
             fi
             rm -f "$installer"
             # Pull all four immutable release digests before backups, retagging or stopping any service.
             # Public GHCR packages need no VM login. A pull failure leaves live tags unchanged.
             sh "$DEPLOY_IMAGES" pull "$DEPLOY_COMMIT" "$DEPLOY_IMAGE_REFS"
             # Preserve matching rollback code/env and the actual container image IDs before checkout/promotion.
             # Record the previous service set, including its bot image for PR 1 rollback.
             umask 077
             release_dir="/var/backups/yugioh-bot/pr2-$(date -u +%Y%m%d-%H%M%SZ)"
             mkdir -m 0700 "$release_dir"
             git rev-parse HEAD > "$release_dir/checkout-commit"
             printf '%s\n' "$DEPLOY_COMMIT" > "$release_dir/deploy-commit"
             cp -p .env "$release_dir/runtime.env"
             chmod 0600 "$release_dir/runtime.env"
             cp "$DEPLOY_IMAGE_REFS" "$release_dir/image-digests"
             : > "$release_dir/previous-image-digests.jsonl"
             : > "$release_dir/images.jsonl"
             preserve_previous_image() {
               confirmed_image=
               if [ -f data/production-image-ids ]; then
                 confirmed_image=$(awk -v service="$1" '$1 == service { print $2 }' data/production-image-ids)
               fi
               DEPLOY_CONFIRMED_IMAGE="$confirmed_image" sh "$DEPLOY_IMAGES" preserve "$DEPLOY_COMMIT" "$2" "$3"
             }
             for container in $(docker compose -f docker-compose.yml ps -aq); do
               service=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$container")
               case "$service" in duel|web|bot|ws|worker)
                 image_id=$(docker inspect -f '{{.Image}}' "$container")
                 docker image inspect --format '{{json .RepoDigests}}' "$image_id" >> "$release_dir/previous-image-digests.jsonl"
                 docker inspect -f '{"service":"{{index .Config.Labels "com.docker.compose.service"}}","imageId":"{{.Image}}","imageRef":"{{.Config.Image}}"}' "$container" >> "$release_dir/images.jsonl"
                 preserve_previous_image "$service" "$image_id" "yugioh-bot-$service:prev"
                 ;;
               esac
             done
             # Also keep :latest when a service has no existing container (for example after an owner stop).
             for service in duel web worker ws; do
               if ! grep -q "\"service\":\"$service\"" "$release_dir/images.jsonl" && \
                 docker image inspect "yugioh-bot-$service:latest" >/dev/null 2>&1; then
                 preserve_previous_image "$service" "yugioh-bot-$service:latest" "yugioh-bot-$service:prev"
               fi
             done
             DUELING_BACKUP_DIR="$release_dir/online" python3 scripts/backup/dueling-backup
             git reset --hard "$DEPLOY_COMMIT"
             export SENTRY_RELEASE="$DEPLOY_COMMIT"
             sh scripts/ensure-env-secrets.sh .env DUEL_INTERNAL_SECRET
             sh "$DEPLOY_IMAGES" promote "$DEPLOY_COMMIT" "$DEPLOY_IMAGE_REFS"
             # Remove build definitions even from an older rollback checkout. Compose run has no --no-build option.
             # config resolves bind paths against /opt/yugioh-bot; keep the private runtime values in a 0600 temp file.
             runtime_compose=$(mktemp /tmp/yugidraft-runtime-compose.XXXXXX.json)
             docker compose -f docker-compose.yml config --format json | python3 -c '
          import json,sys
          config=json.load(sys.stdin)
          for name, service in config["services"].items():
              service.pop("build", None)
              if name in ("duel", "web", "worker", "ws"):
                  service["image"]="yugioh-bot-"+name+":latest"
          json.dump(config, sys.stdout)
             ' > "$runtime_compose"
             # Re-read the generated model before any service stops. Never print private values.
             resolved_compose=$(mktemp /tmp/yugidraft-resolved-compose.XXXXXX.json)
             if ! docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot config --format json > "$resolved_compose" 2>/dev/null; then
               echo "Deploy stopped: runtime Compose configuration cannot be resolved." >&2
               exit 1
             fi
             python3 - "$runtime_compose" "$resolved_compose" <<'PY'
          import json,sys
          with open(sys.argv[1]) as before, open(sys.argv[2]) as after:
              if json.load(before) != json.load(after):
                  sys.exit("Deploy stopped: runtime Compose configuration changed after re-read; no service was stopped.")
          PY
             # Refuse a missing local worker image before stopping production.
             docker image inspect yugioh-bot-worker:latest >/dev/null
             # Recheck after the pulls and promotion, immediately before any production service is stopped.
             # A game may have started since the first check. Refusal leaves production running.
             if ! check_prod_activity; then
               echo "Do not run compose up. Run Deploy again." >&2
               exit 1
             fi
             # Retire the bot container from the previous release before migration.
             project=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$runtime_compose")
             retired_ids=$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter label=com.docker.compose.service=bot)
             for container in $retired_ids; do docker stop "$container"; done
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot stop web duel worker ws
             # Once schema work can begin, failure must leave traffic stopped. Never restart old binaries.
             trap cleanup EXIT
             DUELING_BACKUP_DIR="$release_dir/drained" python3 scripts/backup/dueling-backup
             if ! DUEL_BUNDLE_SRC="$bundle_src" DUEL_DATA_DIR=/opt/yugioh-bot/data/duel-engine \
               sh packages/duel-server/scripts/install-engine-bundle.sh; then
               exit 1
             fi
             sh "$DEPLOY_RUNTIME_PREPARE" data
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot run --rm --no-deps --pull never worker node --input-type=module -e '
               import {openDatabase} from "@yugidraft/shared/db";
               const db=openDatabase(process.env.DATABASE_PATH);
               try {
                 if(db.pragma("foreign_key_check").length)throw new Error("Foreign key check failed");
                 if(db.pragma("integrity_check",{simple:true})!=="ok")throw new Error("Integrity check failed");
                 console.log("identity migration verified");
               } finally {db.close();}
             '
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot down --remove-orphans
             sh "$DEPLOY_RUNTIME_PREPARE" data
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot up -d --no-build ws duel web worker caddy
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot logs --tail=40
             sleep 20
             duel_state=$(docker inspect -f "{{.State.Status}} restarts={{.RestartCount}}" "$(docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps -q duel)")
             echo "duel container: $duel_state"
             if [ "$duel_state" != "running restarts=0" ]; then
               docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot logs --tail=60 duel
               echo "The duel container is not running cleanly." >&2
               exit 1
             fi
             for service in ws worker; do
               healthy=0
               for _attempt in $(seq 1 36); do
                 container=$(docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps -q "$service")
                 state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}} {{.State.Health.Status}}' "$container")
                 if [ "$state" = "running 0 healthy" ]; then healthy=1; break; fi
                 sleep 5
               done
               [ "$healthy" = 1 ] || { docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot logs --tail=60 "$service"; exit 1; }
             done
             # Anonymous auth checks: no redirects, no cookies and exact null body.
             # Next listens on the container's HOSTNAME, not on 127.0.0.1.
             docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot exec -T web node -e '
               const base = `http://${process.env.HOSTNAME}:3000`;
               Promise.all([fetch(`${base}/sign-in`, {redirect:"manual"}), fetch(`${base}/api/auth/session`, {redirect:"manual"})])
                 .then(async ([page, session]) => { if(page.status !== 200 || session.status !== 200 || (await session.text()).trim() !== "null") process.exit(1); })
                 .catch(() => process.exit(1));
             '
             # Record success only after every health check passes. Retries keep the good :prev.
             : > data/production-image-ids.tmp
             for service in duel web worker ws; do
               container=$(docker compose -f "$runtime_compose" --project-directory /opt/yugioh-bot ps -q "$service")
               image_id=$(docker inspect -f '{{.Image}}' "$container")
               printf '%s %s\n' "$service" "$image_id" >> data/production-image-ids.tmp
             done
             mv data/production-image-ids.tmp data/production-image-ids
             printf '%s\n' "$DEPLOY_COMMIT" > data/production-image-commit.tmp
             mv data/production-image-commit.tmp data/production-image-commit
             sh "$DEPLOY_IMAGES" prune
             cleanup
             trap - EXIT
             echo "Production deployed SHA: $DEPLOY_COMMIT"
          REMOTE
          # The backticks are literal Markdown for the Actions summary.
          # shellcheck disable=SC2016
          printf 'Production deployed SHA: `%s`\n' "$DEPLOY_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Record healthy deployment attempt
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        run: printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/release/confirmed-attempt"

      - name: Upload healthy deployment record
        if: ${{ env.VM_DEPLOY_ENABLED == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-deployed-${{ env.DEPLOY_COMMIT }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/image-digests
            ${{ runner.temp }}/release/confirmed-attempt
          if-no-files-found: error
          retention-days: 1

  retain:
    name: Retain healthy production images in GHCR
    needs: [prepare, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      GHCR_TOKEN: ${{ github.token }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Download healthy deployment record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-deployed-${{ needs.prepare.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployed-release

      - name: Tag deployed and previous healthy manifests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const release = `${process.env.RUNNER_TEMP}/deployed-release`;
            let confirmedAttempt, imageDigests;
            try {
              confirmedAttempt = (await readFile(`${release}/confirmed-attempt`, 'utf8')).trim();
              imageDigests = await readFile(`${release}/image-digests`, 'utf8');
            } catch {
              throw new Error('Missing healthy deployment record; no tags were changed.');
            }
            // A failed-job retry can follow a newer deploy. Require fresh health checks.
            if (!/^[1-9][0-9]*$/.test(process.env.RUN_ATTEMPT || '') ||
                confirmedAttempt !== process.env.RUN_ATTEMPT) {
              throw new Error('Registry retention requires deploy health checks in the current run attempt. Dispatch a new Deploy run for the intended current release.');
            }
            const { createHash } = await import('node:crypto');
            const services = ["duel", "web", "worker", "ws"];
            const digests = new Map();
            for (const line of imageDigests.trim().split('\n')) {
              const [service, digest, extra] = line.trim().split(/\s+/);
              if (!services.includes(service) || !/^sha256:[0-9a-f]{64}$/.test(digest || '') || extra || digests.has(service)) {
                throw new Error('Invalid deployed image digest list; no tags were changed.');
              }
              digests.set(service, digest);
            }
            if (digests.size !== services.length) throw new Error('Missing deployed image digests; no tags were changed.');
            const mediaTypes = [
              "application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"
            ];
            const releases = [];
            // Read every current and target manifest before changing any registry tags.
            for (const service of services) {
              const repository = `${context.repo.owner.toLowerCase()}/yugioh-bot-${service}`;
              const auth = Buffer.from(`${context.actor}:${process.env.GHCR_TOKEN}`).toString('base64');
              const response = await fetch(`https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull,push`, {
                headers: { Authorization: `Basic ${auth}` }
              });
              if (!response.ok) throw new Error(`Cannot get registry token for ${repository}: HTTP ${response.status}`);
              const { token } = await response.json();
              if (!token) throw new Error(`Missing registry token for ${repository}`);
              const headers = { Authorization: `Bearer ${token}`, Accept: mediaTypes.join(', ') };
              const base = `https://ghcr.io/v2/${repository}/manifests/`;
              const read = async (reference, optional = false) => {
                const manifest = await fetch(`${base}${reference}`, { headers });
                if (optional && manifest.status === 404) return null;
                if (!manifest.ok) throw new Error(`Cannot read ${repository} manifest ${reference}: HTTP ${manifest.status}`);
                const type = (manifest.headers.get('content-type') || '').split(';')[0];
                const body = await manifest.text();
                const digest = `sha256:${createHash('sha256').update(body).digest('hex')}`;
                if (!mediaTypes.includes(type) || (reference.startsWith('sha256:') && digest !== reference)) {
                  throw new Error(`Invalid ${repository} manifest ${reference}`);
                }
                return { body, type, digest };
              };
              releases.push({ repository, base, headers, current: await read('production', true), next: await read(digests.get(service)) });
            }
            for (const { repository, base, headers, current, next } of releases) {
              const tag = async (name, manifest) => {
                // Copy the original manifest bytes: retain the digest without wrapping it in a new index.
                const response = await fetch(`${base}${name}`, {
                  method: 'PUT', headers: { ...headers, 'Content-Type': manifest.type }, body: manifest.body
                });
                if (!response.ok) throw new Error(`Cannot tag ${repository}:${name}: HTTP ${response.status}`);
              };
              // An identical retry must keep the existing rollback digest.
              if (current && current.digest !== next.digest) await tag('production-prev', current);
              await tag('production', next);
              core.info(`${repository}:production retains ${next.digest}`);
            }
