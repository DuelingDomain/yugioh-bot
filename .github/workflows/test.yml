name: Test

# PRs use explicit path ownership and file-level test selection inside each area.
# Hubs run their tests, fixed consumer smokes and all workspace typechecks.
# Workflow/CI wiring runs CI helper checks and fixed smokes. Global inputs or
# unavailable PR diffs run all groups. Engine jobs need a direct engine input,
# with native/differential limited to core inputs. See ADR 0003 for the map.
# Main runs the full release gate before Deploy. Nightly and manual runs use
# full suites and can run the extended nduel fuzz matrix.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Run the nightly nduel fuzz and golden check"
        type: boolean
        required: false
        default: true
      new_card_smoke:
        description: "Run new/changed-card smoke for the open chore/engine-data-update PR (dispatch that branch)"
        type: boolean
        required: false
        default: false
      nduel_seeds:
        description: "Seeds per nduel case in the nightly fuzz"
        required: false
        default: "100"

concurrency:
  # Superseded main tests cancel to free runner slots; production Deploy stays serialized.
  # Bot PR/dispatch runs for one head share a serial group so an older PASS cannot
  # overwrite a newer FAIL. Different heads and ordinary nightly/main runs stay independent.
  group: test-${{ github.workflow }}-${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/engine-data-update' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.new_card_smoke && github.ref == 'refs/heads/chore/engine-data-update')) && format('card-data-{0}', github.event.pull_request.head.sha || github.sha) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request' && (github.event.pull_request.head.ref != 'chore/engine-data-update' || github.event.pull_request.head.repo.full_name != github.repository) }}

permissions:
  contents: read

env:
  # onnxruntime-node's install script downloads a CUDA package from nuget.org; CI uses the CPU
  # binaries bundled in the package; that download timed out in 6 runs in 3 days.
  ONNXRUNTIME_NODE_INSTALL: skip
  # Retry registry downloads in npm ci instead of failing on one dropped connection.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "2000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"
  # The engine bundle for CI. Not data/duel-engine (that is the deploy bundle, with no multi cores).
  # data/duel-engine-next is also the folder the native nduel tools read by default.
  BUNDLE_DIR: data/duel-engine-next

jobs:
  # PR file lists come from the paginated API, including old names for renames.
  changes:
    name: Changed layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.selection.outputs.web || steps.diff.outputs.web }}
      bot: ${{ steps.selection.outputs.bot || steps.diff.outputs.bot }}
      ws: ${{ steps.selection.outputs.ws || steps.diff.outputs.ws }}
      worker: ${{ steps.selection.outputs.worker || steps.diff.outputs.worker }}
      shared: ${{ steps.selection.outputs.shared || steps.diff.outputs.shared }}
      duel_unit: ${{ steps.selection.outputs.duel_unit || steps.diff.outputs.duel_unit }}
      vision: ${{ steps.selection.outputs.vision || steps.diff.outputs.vision }}
      web_build: ${{ steps.selection.outputs.web_build || steps.diff.outputs.web_build }}
      e2e: ${{ steps.selection.outputs.e2e || steps.diff.outputs.e2e }}
      ci_scripts: ${{ steps.selection.outputs.ci_scripts || steps.diff.outputs.ci_scripts }}
      docs_only: ${{ steps.selection.outputs.docs_only || steps.diff.outputs.docs_only }}
      checks_only: ${{ steps.selection.outputs.checks_only || steps.diff.outputs.checks_only }}
      effects: ${{ steps.selection.outputs.effects || steps.diff.outputs.effects }}
      effect_types: ${{ steps.selection.outputs.effect_types || steps.diff.outputs.effect_types }}
      prod_build: ${{ steps.selection.outputs.prod_build || steps.diff.outputs.prod_build }}
      engine: ${{ steps.selection.outputs.engine || steps.diff.outputs.engine }}
      core: ${{ steps.selection.outputs.core || steps.diff.outputs.core }}
      golden: ${{ steps.selection.outputs.golden || steps.diff.outputs.golden }}
      tests_only: ${{ steps.selection.outputs.tests_only || steps.diff.outputs.tests_only }}
      engine_matrix: ${{ steps.selection.outputs.engine_matrix || steps.diff.outputs.engine_matrix }}
      smoke_enabled: ${{ steps.smoke.outputs.smoke_enabled }}
      smoke_pr: ${{ steps.smoke.outputs.smoke_pr }}
      smoke_base: ${{ steps.smoke.outputs.smoke_base }}
      smoke_head: ${{ steps.smoke.outputs.smoke_head }}
      core_key: ${{ steps.key.outputs.key }}
      core_hit: ${{ steps.bundle.outputs.cache-hit }}
      core_status: >-
        ${{ (steps.wrapper.outcome == 'failure' && 'engine wrapper pin failed') ||
        (steps.key.outcome == 'failure' && 'engine cache key failed') ||
        (steps.emsdk.outcome == 'failure' && 'emsdk pin read failed') || steps.bundle.outcome }}
      typecheck: ${{ steps.selection.outputs.typecheck || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.typecheck) || '' }}
      effect_smoke: ${{ steps.selection.outputs.effect_smoke || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.effect_smoke) || '' }}
      web_files: ${{ steps.selection.outputs.web_files || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.web_files) || '' }}
      shared_files: ${{ steps.selection.outputs.shared_files || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.shared_files) || '' }}
      duel_unit_files: ${{ steps.selection.outputs.duel_unit_files || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.duel_unit_files) || '' }}
      bot_files: ${{ steps.selection.outputs.bot_files || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.bot_files) || '' }}
      ws_files: ${{ steps.selection.outputs.ws_files || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.ws_files) || '' }}
      worker_files: ${{ steps.selection.outputs.worker_files || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.worker_files) || '' }}
      vision_files: ${{ steps.selection.outputs.vision_files || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.vision_files) || '' }}
      web_shards: ${{ steps.selection.outputs.web_shards || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.web_shards) || '[1,2,3]' }}
      shared_shards: ${{ steps.selection.outputs.shared_shards || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.shared_shards) || '["1/2","2/2"]' }}
      duel_unit_shards: ${{ steps.selection.outputs.duel_unit_shards || (steps.diff.outputs.scan != 'true' && steps.diff.outputs.duel_unit_shards) || '["1/2","2/2"]' }}
      engine_files: ${{ steps.selection.outputs.engine_files }}
      engine_web_files: ${{ steps.selection.outputs.engine_web_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Type-only classification compares the synthetic merge with its first parent.
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}

      - name: Check admin spectate service configuration
        if: ${{ !cancelled() }}
        run: prlimit --core=0 -- node scripts/ci/check-admin-spectate-compose.mjs

      - name: Diff changed files
        if: ${{ !cancelled() }}
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/changed-layers.mjs

      - name: Restore dependencies for PR test selection
        if: ${{ steps.diff.outputs.scan == 'true' }}
        uses: ./.github/actions/setup-ci-node

      - name: Select PR test files
        id: selection
        if: ${{ steps.diff.outputs.scan == 'true' }}
        run: node scripts/ci/select-pr-test-files.mjs

      - name: Resolve new-card smoke PR
        if: ${{ !cancelled() }}
        id: smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: prlimit --core=0 -- node scripts/ci/new-card-smoke-context.mjs

      # Cores use pinned source/toolchain trees, not the app's npm or TS configuration.
      # The bundle also contains the npm wrapper: hash only that locked package's
      # integrity, not unrelated dependencies. Keep its local patch in hashFiles below.
      - name: Compute engine wrapper pin
        id: wrapper
        if: >-
          !cancelled() && ((steps.selection.outputs.engine || steps.diff.outputs.engine) == 'true' ||
          steps.smoke.outputs.smoke_enabled == 'true')
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          const wrapper = JSON.parse(readFileSync('package-lock.json', 'utf8')).packages['node_modules/ocgcore-wasm'];
          if (!wrapper?.integrity) throw new Error('Missing locked engine wrapper integrity');
          appendFileSync(process.env.GITHUB_OUTPUT, `hash=${createHash('sha256').update(wrapper.integrity).digest('hex')}\n`);
          JS
      # Raise the literal version when workflow build flags or bundle metadata change.
      # The emsdk image comes from pins.json; independent builders read the same pin.
      - name: Compute bundle cache key
        id: key
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        continue-on-error: true
        run: echo "key=duel-engine-ci-v6-${{ hashFiles('scripts/ci/build-core.sh', 'scripts/ci/parallel-emxx.py', 'scripts/ci/bin/em++', 'scripts/ci/core-cache-key.mjs', 'scripts/ci/assemble-core-bundle.mjs', 'packages/duel-server/scripts/prepare-data.ts', 'packages/duel-server/scripts/card-script-patches.ts', 'packages/duel-server/card-script-patches/**', 'packages/duel-server/scripts/released-card-data.ts', 'packages/duel-server/scripts/prerelease-history.ts', 'packages/duel-server/scripts/prerelease-graduations.ts', 'packages/duel-server/scripts/prerelease-script-smoke.ts', 'packages/duel-server/scripts/prerelease-script-exclusions.ts', 'packages/duel-server/card-remap-overrides.json', 'packages/duel-server/scripts/build-domain-core.ts', 'packages/duel-server/scripts/build-domain-core.sh', 'packages/duel-server/scripts/build-standard-core.sh', 'packages/duel-server/scripts/build-multi-core.sh', 'packages/duel-server/scripts/prepare-multi-core-tree.sh', 'packages/duel-server/scripts/multi-core-common.sh', 'packages/duel-server/domain-core/pins.json', 'packages/duel-server/domain-core/expected-sha256.txt', 'packages/duel-server/domain-core/patches/*.patch', 'packages/duel-server/domain-core/src/**', 'packages/duel-server/domain-core/lua/**', 'packages/duel-server/legacy-1v1/**', 'packages/duel-server/domain-core/multi-scripts/**', 'packages/duel-server/src/multi-scripts.ts', 'packages/duel-server/src/released-database-files.ts', 'packages/duel-server/src/cards.ts', 'packages/duel-server/src/card-script-source.ts', 'packages/duel-server/src/card-name-search.ts', 'packages/duel-server/src/card-script-patches.ts', 'packages/shared/src/duels/**', 'patches/ocgcore-wasm+0.1.2.patch') }}-${{ steps.wrapper.outputs.hash }}" >> "$GITHUB_OUTPUT"
      - name: Read the emsdk image from pins.json
        id: emsdk
        if: ${{ !cancelled() && steps.key.outcome == 'success' }}
        continue-on-error: true
        run: node -p "const e = require('./packages/duel-server/domain-core/pins.json').emscripten; 'EMSDK_IMAGE=' + e.image + '@' + e.digest" >> "$GITHUB_ENV"
      - name: Look up engine bundle
        id: bundle
        if: ${{ !cancelled() && steps.key.outcome == 'success' && steps.emsdk.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ steps.key.outputs.key }}

  core-build:
    name: Build cores (${{ matrix.first }}, ${{ matrix.second }}, ${{ matrix.third }})
    if: needs.changes.outputs.core_status == 'success' && needs.changes.outputs.core_hit != 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Balance the groups by cold compile time. Each target uses all runner CPUs.
        include:
          - first: domain
            second: multi
            third: multi-domain-trap
          - first: legacy-domain
            second: multi-domain
            third: multi-trap
          - first: standard
            second: multi-ref
            third: multi-ref-domain
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build or restore and verify ${{ matrix.first }}
        uses: ./.github/actions/build-ci-core-target
        with:
          target: ${{ matrix.first }}
      - name: Build or restore and verify ${{ matrix.second }}
        uses: ./.github/actions/build-ci-core-target
        with:
          target: ${{ matrix.second }}
      - name: Build or restore and verify ${{ matrix.third }}
        uses: ./.github/actions/build-ci-core-target
        with:
          target: ${{ matrix.third }}
      - name: Upload verified cores
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.first }}-${{ matrix.second }}-${{ matrix.third }}
          path: ci-core/
          if-no-files-found: error
          retention-days: 1

  cores:
    name: Engine cores (build or restore)
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.core_status == 'success' }}
    needs: [changes, core-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ needs.changes.outputs.core_key }}
    steps:
      - name: Check core build results
        env:
          CORE_BUILD: ${{ needs.core-build.result }}
        run: |
          case "$CORE_BUILD" in
            success|skipped) ;;
            *) echo "Core build result: $CORE_BUILD" >&2; exit 1 ;;
          esac
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore engine bundle
        if: needs.changes.outputs.core_hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.changes.outputs.core_key }}
          fail-on-cache-miss: true
      - name: Restore Node dependencies and Turbo cache
        if: needs.changes.outputs.core_hit != 'true'
        uses: ./.github/actions/setup-ci-node
      # The prerelease smoke check uses the shared artwork resolver through src/cards.ts.
      - name: Build shared for card preparation
        if: needs.changes.outputs.core_hit != 'true'
        run: npx --no-install turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Prepare card data and scripts
        if: needs.changes.outputs.core_hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
        run: npm run duel:prepare
      - name: Download all cores
        if: needs.changes.outputs.core_hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: ci-core
          merge-multiple: true
      # Targets have separate manifests. Only this step writes the final manifest, in serial build order.
      - name: Assemble engine bundle
        if: needs.changes.outputs.core_hit != 'true'
        env:
          DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
        run: node scripts/ci/assemble-core-bundle.mjs

      - name: Install multi cores into the bundle
        if: needs.changes.outputs.core_hit != 'true'
        run: |
          set -eu
          dist=packages/duel-server/domain-core/dist
          cp "$dist/ocgcore.multi.sync.wasm" "$BUNDLE_DIR/ocgcore.multi.wasm"
          cp "$dist/ocgcore.multi-domain.sync.wasm" "$BUNDLE_DIR/ocgcore.multi-domain.wasm"
          for stem in ocgcore.multi ocgcore.multi-domain; do
            printf 'tag=ci-%s\nsource=%s\nsha256=%s\ncapabilities=ffa3-facing-extra-zones,ffa4-facing-extra-zones,tag-facing-extra-zones\ninstalled=%s\nnote=built by .github/workflows/test.yml\n' \
              "${GITHUB_SHA::12}" "$dist/$stem.sync.wasm" \
              "$(sha256sum "$dist/$stem.sync.wasm" | cut -d' ' -f1)" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$BUNDLE_DIR/$stem.SOURCE"
          done

      - name: Verify engine bundle
        run: |
          set -eu
          for f in ocgcore.standard.wasm ocgcore.domain.wasm ocgcore.multi.wasm ocgcore.multi-domain.wasm ocgcore.multi.SOURCE ocgcore.multi-domain.SOURCE cards.cdb; do
            test -s "$BUNDLE_DIR/$f" || { echo "bundle file missing or empty: $BUNDLE_DIR/$f" >&2; exit 1; }
          done
          for f in ocgcore.multi.sync.wasm ocgcore.multi-ref.sync.wasm ocgcore.multi-domain.sync.wasm ocgcore.multi-ref-domain.sync.wasm ocgcore.multi-trap.sync.wasm ocgcore.multi-domain-trap.sync.wasm; do
            test -s "packages/duel-server/domain-core/dist/$f" || { echo "differential core missing or empty: $f" >&2; exit 1; }
          done
          DUEL_DATA_DIR="$PWD/$BUNDLE_DIR" sh packages/duel-server/scripts/install-engine-bundle.sh
          # The legacy 1v1 files must match the approved legacy pin (sha256 pinned in legacy-1v1/expected-sha256.txt), also when the bundle came from the cache.
          sh packages/duel-server/scripts/check-legacy-pin.sh "$PWD/$BUNDLE_DIR"

      - name: Verify pinned core hashes
        run: |
          set -eu
          dist=packages/duel-server/domain-core/dist
          (cd "$dist" && sha256sum --check ../expected-sha256.txt)
          for target in domain multi multi-domain; do
            cmp "$dist/ocgcore.$target.sync.wasm" "$BUNDLE_DIR/ocgcore.$target.wasm"
          done

      - name: Save engine bundle
        if: needs.changes.outputs.core_hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.changes.outputs.core_key }}

  # Dispatch job checks cannot satisfy PR rulesets. Explicit commit statuses use
  # the report's stable context; hold it pending before any smoke can start.
  new-card-smoke-status-pending:
    name: New card smoke merge gate (pending)
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/engine-data-update' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.new_card_smoke && github.ref == 'refs/heads/chore/engine-data-update')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      SMOKE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout status helper without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js without dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hold the merge gate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: prlimit --core=0 -- node scripts/ci/new-card-smoke-status.mjs pending

  new-card-smoke:
    name: New card engine smoke (${{ matrix.shard }}/4)
    if: ${{ !cancelled() && needs.cores.result == 'success' && needs.new-card-smoke-status-pending.result == 'success' && needs.changes.outputs.smoke_enabled == 'true' }}
    needs: [changes, cores, new-card-smoke-status-pending]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      SMOKE_BASE: ${{ needs.changes.outputs.smoke_base }}
      SMOKE_HEAD: ${{ needs.changes.outputs.smoke_head }}
      SMOKE_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout base and head history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore engine bundle and test dependencies
        uses: ./.github/actions/restore-engine-bundle
        with:
          key: ${{ needs.cores.outputs.key }}

      # Engine data update PRs only (this job): the generated Remote Duels card logic must match the new data.
      - name: Check Remote Duels card logic is current
        if: matrix.shard == 1
        run: prlimit --core=0 -- node --import tsx packages/duel-server/scripts/build-card-logic.ts --check

      - name: Check Remote Duels card behaviour is current
        if: matrix.shard == 1
        run: prlimit --core=0 -- node --import tsx packages/duel-server/scripts/build-card-behaviour.ts --check

      # The runner reads prepare-data.ts at these exact refs. Its own selection adds
      # the fixed 150-card sample when shared Lua helpers change; do not select again here.
      - name: Smoke new and changed cards
        id: smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          result=0
          prlimit --core=0 -- node --import tsx packages/duel-server/scripts/new-card-smoke.ts \
            --from-pin "$SMOKE_BASE" --to-pin "$SMOKE_HEAD" \
            --jobs 4 --shard "$SMOKE_SHARD/4" --output ".status/new-card-smoke-$SMOKE_SHARD" || result=$?
          case "$result" in
            0) ;;
            1) echo "::error::New-card smoke FAIL. Read the shard report for card names and reasons."; exit 1 ;;
            2) echo "::error::New-card smoke input/download/infrastructure error. Read the runner logs."; exit 2 ;;
            3) echo "::warning::New-card smoke incomplete: time budget reached. Review unfinished cards in the report." ;;
            *) echo "::error::Unexpected new-card smoke exit code: $result"; exit "$result" ;;
          esac

      - name: Save shard JSON and Markdown even on FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-card-smoke-${{ matrix.shard }}
          path: |
            .status/new-card-smoke-${{ matrix.shard }}.json
            .status/new-card-smoke-${{ matrix.shard }}.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  new-card-smoke-report:
    name: New card engine smoke report
    # Eligibility must not depend on resolver outputs: resolver/checkout failures
    # still need an ERROR report and failed merge gate.
    if: >-
      always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/engine-data-update' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.new_card_smoke && github.ref == 'refs/heads/chore/engine-data-update'))
    needs: [changes, cores, new-card-smoke, new-card-smoke-status-pending]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    # Serialize comment creation across PR and dispatch runs for the same PR head.
    concurrency:
      group: new-card-smoke-report-${{ github.repository }}-${{ needs.changes.outputs.smoke_pr || github.event.pull_request.number || github.ref }}-${{ needs.changes.outputs.smoke_head || github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    env:
      SMOKE_PR: ${{ needs.changes.outputs.smoke_pr || github.event.pull_request.number }}
      SMOKE_BASE: ${{ needs.changes.outputs.smoke_base || github.event.pull_request.base.sha || 'unavailable' }}
      SMOKE_HEAD: ${{ needs.changes.outputs.smoke_head || github.event.pull_request.head.sha || github.sha }}
      SMOKE_RESULT: ${{ needs.new-card-smoke.result }}
      SMOKE_CONTEXT_RESULT: ${{ needs.changes.result }}
      SMOKE_SHARD_COUNT: "4"
    steps:
      - name: Checkout report helpers without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js without dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download all available shard reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: new-card-smoke-*
          path: .status/new-card-smoke-shards
          merge-multiple: true

      # No install or candidate engine code executes with this write token.
      # The helper checks the current PR branch/repo/head before creating or editing its marker.
      - name: Merge reports, write summary and update sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: prlimit --core=0 -- node scripts/ci/new-card-smoke-report.mjs

      - name: Save the complete merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-card-smoke-report
          path: |
            .status/new-card-smoke-report.json
            .status/new-card-smoke-report.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  new-card-smoke-status:
    name: New card smoke merge gate (final)
    if: >-
      always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/engine-data-update' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.new_card_smoke && github.ref == 'refs/heads/chore/engine-data-update'))
    needs: [new-card-smoke-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      SMOKE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SMOKE_REPORT_RESULT: ${{ needs.new-card-smoke-report.result }}
    steps:
      - name: Checkout status helper without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js without dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish the required merge-gate result
        env:
          GH_TOKEN: ${{ github.token }}
        run: prlimit --core=0 -- node scripts/ci/new-card-smoke-status.mjs final

  effect-protocol:
    name: Effect tagging protocol
    needs: changes
    if: needs.changes.outputs.effects == 'true' || needs.changes.outputs.effect_types == 'true' || needs.changes.outputs.effect_smoke != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Test fixed effects smoke
        if: needs.changes.outputs.effect_smoke != ''
        env:
          EFFECT_SMOKE: ${{ needs.changes.outputs.effect_smoke }}
        run: node scripts/ci/run-pr-tests.mjs effects
      - name: Typecheck effect scripts
        run: prlimit --core=0 -- npx tsc -p scripts/effects/tsconfig.json --noEmit
      - name: Validate effect tagging protocol without paid requests
        if: needs.changes.outputs.effects == 'true'
        run: |
          prlimit --core=0 -- npx vitest run scripts/effects/tests/effect-tagging.integration.test.ts scripts/effects/tests/bridge-batch.integration.test.ts --maxWorkers=1
      - name: Evaluate bridge precision and recall
        if: needs.changes.outputs.effects == 'true'
        run: |
          prlimit --core=0 -- npx tsx scripts/effects/evaluate-bridges.ts --check
          prlimit --core=0 -- npx vitest run packages/shared/tests/archetype-bridges.integration.test.ts packages/shared/tests/bridge-judge.integration.test.ts packages/duel-server/tests/bridge-workers packages/duel-server/tests/bridge-search-jobs packages/duel-server/tests/bridge-api.integration.test.ts scripts/effects/tests/bridge-artifacts.integration.test.ts --maxWorkers=1 --testTimeout=15000

  unit-web-build:
    name: Web production build
    needs: changes
    if: needs.changes.outputs.web_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Generate Next route types
        run: npm exec --workspace=packages/web -- next typegen
      - name: Typecheck web
        run: npm run typecheck --workspace=packages/web
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/web/.next/cache
          key: next-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
      - name: Build web with a dummy Clerk public key
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          NEXT_BUILD_FS_CACHE: "1"
        run: bash scripts/ci/build-web.sh
      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

  unit-shared:
    name: Shared unit tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shared_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Typecheck shared
        if: startsWith(matrix.shard, '1/')
        run: npm run typecheck --workspace=packages/shared
      - name: Test shared
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.shared_files }}
        run: |
          if [ -n "$CI_TEST_FILES" ]; then
            node scripts/ci/run-selected-unit-tests.mjs shared ${{ matrix.shard }}
          else
            node scripts/ci/run-pr-tests.mjs shared --shard=${{ matrix.shard }}
          fi

  small-checks:
    name: Service tests, typechecks and rule coverage
    needs: changes
    if: >-
      needs.changes.outputs.bot == 'true' || needs.changes.outputs.ws == 'true' ||
      needs.changes.outputs.worker == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.engine == 'true' || needs.changes.outputs.vision == 'true' ||
      needs.changes.outputs.typecheck != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (needs.changes.outputs.bot == 'true' || needs.changes.outputs.ws == 'true' || needs.changes.outputs.worker == 'true') && 15 || 10 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Run all selected checks
        if: ${{ !cancelled() }}
        env:
          CHECK_BOT: ${{ needs.changes.outputs.bot }}
          CHECK_WS: ${{ needs.changes.outputs.ws }}
          CHECK_WORKER: ${{ needs.changes.outputs.worker }}
          CHECK_E2E: ${{ needs.changes.outputs.e2e }}
          CHECK_VISION: ${{ needs.changes.outputs.vision }}
          CHECK_WEB_BUILD: ${{ needs.changes.outputs.web_build }}
          CHECK_SHARED: ${{ needs.changes.outputs.shared }}
          CHECK_DUEL_UNIT: ${{ needs.changes.outputs.duel_unit }}
          CHECK_TYPES: ${{ needs.changes.outputs.typecheck }}
          VISION_TEST_FILES: ${{ needs.changes.outputs.vision_files }}
          CHECK_RULE_COVERAGE: ${{ needs.changes.outputs.engine }}
          BOT_TEST_FILES: ${{ needs.changes.outputs.bot_files }}
          WS_TEST_FILES: ${{ needs.changes.outputs.ws_files }}
          WORKER_TEST_FILES: ${{ needs.changes.outputs.worker_files }}
        run: bash scripts/ci/run-small-checks.sh

  unit-duel:
    name: Duel tests and typecheck (no core) (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.duel_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.duel_unit_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Typecheck duel-server
        if: startsWith(matrix.shard, '1/')
        run: npm run typecheck --workspace=packages/duel-server
      - name: Test duel-server (no core)
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.duel_unit_files }}
        run: |
          if [ -n "$CI_TEST_FILES" ]; then
            node scripts/ci/run-selected-unit-tests.mjs duel_unit ${{ matrix.shard }}
          else
            node scripts/ci/run-pr-tests.mjs duel-server --shard=${{ matrix.shard }}
          fi

  unit-web:
    name: Web unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.web_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      # The shard runner receives the whole eligible file list before splitting it.
      - name: Test web
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.web_files }}
        run: node scripts/ci/run-web-tests.mjs ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload web file timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-web-${{ strategy.job-total }}-shards-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings/web-${{ strategy.job-total }}-shards-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  ci-scripts:
    name: CI and deployment script checks
    needs: changes
    if: needs.changes.outputs.ci_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/shared/package.json
      - name: Install CI helper dependencies
        run: |
          # Shared supplies Vitest, TypeScript, and Vite's YAML peer.
          # The root postinstall patches the engine workspace. Build only the
          # native dependencies of shared.
          npm ci --workspace=packages/shared --ignore-scripts
          npm rebuild better-sqlite3 sharp
      - name: Build shared
        run: npm run build --workspace=packages/shared
      - name: Deployment script tests
        run: node_modules/.bin/vitest run scripts/deployment/deploy.test.ts
      - name: Test CI helpers
        shell: bash
        run: |
          pids=()
          node --test --test-concurrency="$(nproc)" --test-reporter=spec scripts/ci/*.test.mjs &
          pids+=("$!")
          python3 -B scripts/ci/parallel_emxx_test.py -v &
          pids+=("$!")
          python3 -B -m unittest discover -s scripts/deployment -p test_deploy_safety.py -v &
          pids+=("$!")

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Validate workflow syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP" --clobber && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 5))
          done
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/test.yml

  engine-shards:
    name: >-
      Engine tests shard (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.count }})${{ matrix.suite == 'compact' && matrix.shard == matrix.count && ' - smoke pool' || '' }}
    if: ${{ !cancelled() && needs.cores.result == 'success' && needs.changes.outputs.engine == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.engine_matrix) }}
    env:
      DUEL_REQUIRE_CORES: "1"
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      # The cores of the cores job have the canonical names. Without these paths cores.ts would look for the
      # local tagged builds first. NSEAT_LIVE opens the live N-seat scenarios (a missing flag fails in require mode).
      MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
      DOMAIN_MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
      NSEAT_LIVE: "1"
      # The Table test (tests/multi-scripts-table.test.ts) needs the debug core of the cores job; in require mode a missing file fails.
      TABLE_TRAP_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-trap.sync.wasm
      TABLE_TRAP_DOMAIN_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain-trap.sync.wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine bundle and test dependencies
        uses: ./.github/actions/restore-engine-bundle
        with:
          key: ${{ needs.cores.outputs.key }}

      - name: Verify engine test file coverage
        if: matrix.suite != 'surrender' && matrix.shard == 1
        run: node scripts/ci/check-engine-test-coverage.mjs

      # The generated Remote Duels tables must match the engine data. This also runs when only their scanner or encoder changed.
      - name: Check Remote Duels card logic and behaviour are current
        if: matrix.suite != 'surrender' && matrix.shard == 1
        run: |
          prlimit --core=0 -- node --import tsx packages/duel-server/scripts/build-card-logic.ts --check
          prlimit --core=0 -- node --import tsx packages/duel-server/scripts/build-card-behaviour.ts --check

      - name: Engine tests
        if: needs.changes.outputs.engine == 'true'
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.engine_files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.count }}

      # Web tests that run a real stock-core duel. The unit job has no engine bundle, so they skip there.
      # DUEL_REQUIRE_CORES=1 (from the job env) makes a missing bundle a failure here.
      # The step finds the files itself: every web test that imports the shared cores helper
      # (describeWithCores / itWithCores) runs here, so a new engine test needs no edit of this file.
      # Only direct imports of the cores helper are found. A web test that gets the helper through another module is not run here.
      # The full web suite (about 400 files) already runs in the unit job, so only the matching files run again.
      - name: Web tests with the engine
        if: matrix.suite != 'surrender' && matrix.shard == 1 && needs.changes.outputs.engine_files == ''
        run: |
          set -o pipefail
          # Lines that start with // or * are comments: a comment that names the helper does not count.
          files=$({ grep -rE "duel-server/tests/support/cores(\.js)?[\"']" packages/web/tests --include='*.test.ts' --include='*.test.tsx' || true; } | { grep -vE '^[^:]*:[[:space:]]*(//|\*)' || true; } | cut -d: -f1 | sed 's#^packages/web/##' | sort -u)
          if [ -z "$files" ]; then echo "No web test imports the cores helper. Fix this step."; exit 1; fi
          echo "$files"
          mapfile -t test_files <<< "$files"
          prlimit --core=1:1 -- npm exec --workspace=packages/web -- vitest run "${test_files[@]}"

      - name: Web engine tests that depend on changed duel helpers
        if: matrix.suite != 'surrender' && matrix.shard == 1 && needs.changes.outputs.engine_files != ''
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.engine_web_files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs web 1/1

      # tests/*.smoke.ts are plain assert scripts (vitest does not match them); one failing script fails the step.
      - name: Engine smoke scripts
        if: needs.changes.outputs.engine == 'true' && matrix.suite != 'surrender' && matrix.shard == 1
        run: prlimit --core=1:1 -- npm run test:smoke --workspace=packages/duel-server

      - name: Upload engine file timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-engine-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings/engine-${{ matrix.suite }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  engine-legacy-shards:
    name: Legacy 1v1 tests shard (${{ matrix.shard }}/1)
    if: ${{ !cancelled() && needs.cores.result == 'success' && needs.changes.outputs.engine == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      DUEL_REQUIRE_CORES: "1"
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
      DOMAIN_MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
      NSEAT_LIVE: "1"
      TABLE_TRAP_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-trap.sync.wasm
      TABLE_TRAP_DOMAIN_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain-trap.sync.wasm
      # Production starts 1v1 duels on the legacy engine. Run only its tests and host/worker gates. The setup file
      # (tests/support/setup.ts) keeps a value that is already set. tests/legacy-main is main's engine tests, unchanged
      # except for the import paths, and they always use the legacy engine.
      DUEL_1V1_ENGINE: legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine bundle and test dependencies
        uses: ./.github/actions/restore-engine-bundle
        with:
          key: ${{ needs.cores.outputs.key }}

      - name: Engine tests, legacy 1v1 engine
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.engine_files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs legacy ${{ matrix.shard }}/1

      - name: Upload legacy file timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-engine-legacy-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings/engine-legacy-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  engine-differential:
    name: Differential engine tests (${{ matrix.shard }}/2)
    if: ${{ !cancelled() && needs.cores.result == 'success' && needs.changes.outputs.core == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DUEL_REQUIRE_CORES: "1"
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
      DOMAIN_MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
      NSEAT_LIVE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine bundle and test dependencies
        uses: ./.github/actions/restore-engine-bundle
        with:
          key: ${{ needs.cores.outputs.key }}

      - name: Differential engine tests
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs differential ${{ matrix.shard }}/2

  native:
    name: Native checks (ASan and UBSan)
    if: ${{ !cancelled() && needs.cores.result == 'success' && needs.changes.outputs.core == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The native tools read cards.cdb and the card scripts from data/duel-engine-next.
      - name: Restore engine bundle
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.cores.outputs.key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # scripts/native/checks/run.sh in duel-server builds the repo patch series with ASan and UBSan and runs the
      # committed checks that are marked ready in checks.tsv. The fuzz matrix stays in nduel-nightly.
      - name: Native tests
        run: npm run test:native

      # Within selected core runs, only golden inputs (or a nightly/manual run) check the hashes.
      # Reuse test:native's repo-series library, pinned Lua and trap/ASan/UBSan flags; only compile the driver.
      - name: nduel golden hashes (--check)
        if: needs.changes.outputs.golden == 'true'
        env:
          NDUEL_DIR: ${{ github.workspace }}/packages/duel-server/domain-core/.build/nduel
          NDUEL_SKIP_BUILD: "1"
        run: |
          native="$GITHUB_WORKSPACE/packages/duel-server/domain-core/.build/native-checks"
          mkdir -p "$NDUEL_DIR"
          prlimit --core=1:1 -- g++ -std=c++17 -Wall -Wextra -Wno-unused-parameter -O1 -g1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -fno-rtti \
            -DYGO_N_TRAP -D_GLIBCXX_ASSERTIONS -I"$native/lua-src" -I"$native/multi-core-tree" \
            packages/duel-server/scripts/native/nduel.cpp "$native/libocgcore-multi.a" -o "$NDUEL_DIR/nduel"
          prlimit --core=1:1 -- bash packages/duel-server/scripts/run-nduel.sh --check

      - name: Upload native status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-status
          path: .status/
          if-no-files-found: ignore

  nduel-nightly:
    name: nduel fuzz (${{ matrix.case }})
    if: ${{ !cancelled() && needs.cores.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)) }}
    needs: cores
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        case: [n2, n3, n4, tag]
    env:
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      # Seeds 1..N for the case of this leg. --check-future turns the "future" checks (turn order, first attack,
      # elimination, one win, Tag LP) into failures.
      NDUEL_SEEDS: ${{ inputs.nduel_seeds || '100' }}
      NDUEL_CASES: ${{ matrix.case }}
      NDUEL_FUTURE: "1"
      NDUEL_DIR: ${{ github.workspace }}/nduel-work/${{ matrix.case }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine bundle
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.cores.outputs.key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # run-nduel.sh builds the core with -DYGO_N_TRAP and ASan/UBSan, then runs seeds 1..NDUEL_SEEDS of the case.
      - name: nduel fuzz with --check-future
        run: bash packages/duel-server/scripts/run-nduel.sh

      # Golden hashes: one leg is enough. Reuses the build of the step before. golden.tsv was recorded without
      # --check-future, so it is off here. It runs also when the fuzz step failed (run-nduel.sh fails loudly if the
      # binary is missing).
      - name: nduel golden hashes (--check)
        if: matrix.case == 'n2' && !cancelled()
        env:
          NDUEL_SKIP_BUILD: "1"
          NDUEL_FUTURE: "0"
        run: bash packages/duel-server/scripts/run-nduel.sh --check

      - name: Upload nduel status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nduel-status-${{ matrix.case }}
          path: |
            .status/nduel-summary.json
            .status/nduel-check.json
            nduel-work/${{ matrix.case }}/runs/*.err
          if-no-files-found: ignore

  # These artifacts are unverified until this whole main push Test run succeeds.
  # Deploy uses this exact run ID and commit. Only main publishes these deploy artifacts.
  production-bundle:
    name: Prepare production image bundle
    outputs:
      artifact: ${{ steps.bundle-name.outputs.artifact }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare production engine bundle
        uses: ./.github/actions/prepare-production-bundle
      - name: Record production bundle artifact name
        id: bundle-name
        run: echo "artifact=production-bundle-${{ github.sha }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload production image bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.bundle-name.outputs.artifact }}
          overwrite: true
          path: ${{ runner.temp }}/deploy-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  production-voice-assets:
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name != 'push' && (needs.changes.outputs.prod_build == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tests_only != 'true' && needs.changes.outputs.checks_only != 'true')))
    uses: ./.github/workflows/prepare-voice-assets.yml
    with:
      ref: ${{ github.sha }}
      save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  production-images:
    name: Build ARM64 ${{ matrix.service }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [production-bundle, production-voice-assets]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      actions: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: duel
            target: duel-bundled
          - service: web
            target: web
          - service: bot
            target: bot
          - service: worker
            target: worker
          - service: ws
            target: ws
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      IMAGE: ghcr.io/duelingdomain/yugioh-bot-${{ matrix.service }}
    steps:
      - name: Checkout main push commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - name: Download verified engine bundle for hashing
        if: matrix.service == 'duel'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.production-bundle.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Compute build-input hash
        id: inputs
        env:
          IMAGE_SERVICE: ${{ matrix.service }}
          IMAGE_SALT_ENV: ${{ matrix.service == 'web' && 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_POSTHOG_KEY,NEXT_PUBLIC_SENTRY_DSN,SENTRY_ORG,SENTRY_PROJECT' || '' }}
          IMAGE_SALT_EXTRA: target:${{ matrix.target }}
          IMAGE_BUNDLE: ${{ runner.temp }}/release/deploy-bundle.tar.gz
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: node scripts/ci/image-inputs.mjs
      # Same inputs as an image built earlier (often on the PR): stamp it with this commit instead of building.
      - name: Reuse an image built from the same inputs
        id: reuse
        uses: ./.github/actions/reuse-production-image
        with:
          service: ${{ matrix.service }}
          inputs-hash: ${{ steps.inputs.outputs.hash }}
          artifact-suffix: -${{ github.run_attempt }}
      - name: Download pinned voice inputs for web
        if: steps.reuse.outputs.reused != 'true' && matrix.service == 'web' && needs.production-voice-assets.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.production-voice-assets.outputs.artifact }}
          path: ${{ runner.temp }}/voice-inputs
      - name: Unpack voice image inputs
        if: steps.reuse.outputs.reused != 'true' && matrix.service == 'web' && needs.production-voice-assets.outputs.enabled == 'true'
        run: |
          mkdir -p data/voice-assets
          tar -C data/voice-assets -xzf "$RUNNER_TEMP/voice-inputs/voice-assets.tar.gz"
      - name: Build production image
        if: steps.reuse.outputs.reused != 'true'
        uses: ./.github/actions/build-production-image
        with:
          service: ${{ matrix.service }}
          target: ${{ matrix.target }}
          bundle-artifact: ${{ needs.production-bundle.outputs.artifact }}
          artifact-suffix: -${{ github.run_attempt }}
          inputs-hash: ${{ steps.inputs.outputs.hash }}
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  # Builds the images a PR changes, so the merge to main only stamps them with the merge commit.
  # Skipped for forks (no package write access). A failure never blocks the PR: main then builds as before.
  image-prebuild:
    name: Prebuild ARM64 web image
    needs: [changes, production-voice-assets]
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tests_only != 'true' && needs.changes.outputs.checks_only != 'true'
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      actions: read
    timeout-minutes: 45
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      IMAGE: ghcr.io/duelingdomain/yugioh-bot-web
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compute build-input hash
        id: inputs
        env:
          IMAGE_SERVICE: web
          IMAGE_SALT_ENV: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_POSTHOG_KEY,NEXT_PUBLIC_SENTRY_DSN,SENTRY_ORG,SENTRY_PROJECT
          IMAGE_SALT_EXTRA: target:web
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: node scripts/ci/image-inputs.mjs
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download pinned voice inputs for web
        if: needs.production-voice-assets.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.production-voice-assets.outputs.artifact }}
          path: ${{ runner.temp }}/voice-inputs
      - name: Unpack voice image inputs
        if: needs.production-voice-assets.outputs.enabled == 'true'
        run: |
          mkdir -p data/voice-assets
          tar -C data/voice-assets -xzf "$RUNNER_TEMP/voice-inputs/voice-assets.tar.gz"
      # Always builds: the tag is overwritten, so a broken earlier push of this PR is never reused.
      - name: Build production image
        uses: ./.github/actions/build-production-image
        with:
          service: web
          target: web
          bundle-artifact: unused
          inputs-hash: ${{ steps.inputs.outputs.hash }}
          publish-artifacts: 'false'
          write-caches: 'false'
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  service-image-prebuild:
    name: Prebuild ARM64 ws, worker and bot images
    needs: changes
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tests_only != 'true' && needs.changes.outputs.checks_only != 'true'
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compute ws build-input hash
        id: ws
        env:
          IMAGE_SERVICE: ws
          IMAGE_SALT_EXTRA: target:ws
        run: node scripts/ci/image-inputs.mjs
      - name: Compute worker build-input hash
        id: worker
        env:
          IMAGE_SERVICE: worker
          IMAGE_SALT_EXTRA: target:worker
        run: node scripts/ci/image-inputs.mjs
      - name: Compute bot build-input hash
        id: bot
        env:
          IMAGE_SERVICE: bot
          IMAGE_SALT_EXTRA: target:bot
        run: node scripts/ci/image-inputs.mjs
      - name: Set up shared Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        id: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prebuild ws
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        uses: ./.github/actions/build-production-image
        env:
          IMAGE: ghcr.io/duelingdomain/yugioh-bot-ws
        with:
          service: ws
          target: ws
          builder: ${{ steps.builder.outputs.name }}
          bundle-artifact: unused
          inputs-hash: ${{ steps.ws.outputs.hash }}
          publish-artifacts: 'false'
          write-caches: 'false'
      - name: Prebuild worker
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        uses: ./.github/actions/build-production-image
        env:
          IMAGE: ghcr.io/duelingdomain/yugioh-bot-worker
        with:
          service: worker
          target: worker
          builder: ${{ steps.builder.outputs.name }}
          bundle-artifact: unused
          inputs-hash: ${{ steps.worker.outputs.hash }}
          publish-artifacts: 'false'
          write-caches: 'false'
      - name: Prebuild bot
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        uses: ./.github/actions/build-production-image
        env:
          IMAGE: ghcr.io/duelingdomain/yugioh-bot-bot
        with:
          service: bot
          target: bot
          builder: ${{ steps.builder.outputs.name }}
          bundle-artifact: unused
          inputs-hash: ${{ steps.bot.outputs.hash }}
          publish-artifacts: 'false'
          write-caches: 'false'

  # Keep both jobs outside CI result. The x64 job uses the same bundle preparation as main
  # and only requests an ARM64 runner when the latest main image has different inputs.
  duel-prebuild-inputs:
    name: Prepare duel prebuild inputs
    needs: changes
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tests_only != 'true' && needs.changes.outputs.checks_only != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      IMAGE: ghcr.io/duelingdomain/yugioh-bot-duel
      BUNDLE_ARTIFACT: duel-prebuild-bundle-${{ github.sha }}-${{ github.run_attempt }}
    outputs:
      hash: ${{ steps.inputs.outputs.hash }}
      artifact: ${{ steps.upload.outputs.artifact-id != '' && env.BUNDLE_ARTIFACT || '' }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare production engine bundle
        uses: ./.github/actions/prepare-production-bundle
        with:
          save-cache: 'false'
      - name: Compute build-input hash
        id: inputs
        env:
          IMAGE_SERVICE: duel
          IMAGE_SALT_EXTRA: target:duel-bundled
          IMAGE_BUNDLE: ${{ runner.temp }}/deploy-bundle.tar.gz
        run: node scripts/ci/image-inputs.mjs
      - name: Compare with the latest successful main image
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_HASH: ${{ steps.inputs.outputs.hash }}
        shell: bash
        run: |
          if main_commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha') &&
             [[ "$main_commit" =~ ^[0-9a-f]{40}$ ]] &&
             main_image=$(docker buildx imagetools inspect --format '{{json .Image}}' "$IMAGE:$main_commit") &&
             python3 -c '
          import json, sys
          image = json.load(sys.stdin)
          labels = image.get("config", {}).get("Labels", {})
          sys.exit(not (image.get("os") == "linux" and image.get("architecture") == "arm64"
                        and labels.get("org.opencontainers.image.revision") == sys.argv[1]
                        and labels.get("dev.duelingdomain.inputs") == sys.argv[2]))
          ' "$main_commit" "$INPUTS_HASH" <<< "$main_image"; then
            echo "The latest successful main duel image already has these inputs."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload verified duel prebuild bundle
        id: upload
        if: steps.compare.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BUNDLE_ARTIFACT }}
          path: ${{ runner.temp }}/deploy-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  duel-image-prebuild:
    name: Prebuild ARM64 duel image
    needs: [duel-prebuild-inputs]
    if: needs.duel-prebuild-inputs.outputs.artifact != ''
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      IMAGE: ghcr.io/duelingdomain/yugioh-bot-duel
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build production image
        uses: ./.github/actions/build-production-image
        with:
          service: duel
          target: duel-bundled
          bundle-artifact: ${{ needs.duel-prebuild-inputs.outputs.artifact }}
          inputs-hash: ${{ needs.duel-prebuild-inputs.outputs.hash }}
          publish-artifacts: 'false'
          write-caches: 'false'

  production-dry-run:
    name: Production composites dry run (bundle, bot and voice assets)
    needs: [changes, production-voice-assets]
    if: github.event_name != 'push' && needs.changes.outputs.prod_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      IMAGE: ghcr.io/duelingdomain/yugioh-bot-bot
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare production engine bundle without publishing
        uses: ./.github/actions/prepare-production-bundle
        with:
          save-cache: 'false'
      - name: Build bot image without publishing
        uses: ./.github/actions/build-production-image
        with:
          service: bot
          target: bot
          bundle-artifact: unused
          push: 'false'
          platform: linux/amd64

      - name: Download pinned voice inputs for stage smoke
        if: needs.production-voice-assets.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.production-voice-assets.outputs.artifact }}
          path: ${{ runner.temp }}/voice-inputs
      - name: Build only the voice assembly stage using the warm bot dependencies
        if: needs.production-voice-assets.outputs.enabled == 'true'
        run: |
          mkdir -p data/voice-assets
          tar -C data/voice-assets -xzf "$RUNNER_TEMP/voice-inputs/voice-assets.tar.gz"
          docker buildx build --platform linux/amd64 --target voice-assets-check \
            --output "type=local,dest=$RUNNER_TEMP/voice-stage" .
          test -s "$RUNNER_TEMP/voice-stage/app/vision-code/asr/worker.js"
          test -s "$RUNNER_TEMP/voice-stage/app/vision-code/kws/sherpa-kws.wasm"

  ci-result:
    name: CI result
    if: always()
    # PR prebuilds only warm image reuse. The main image jobs still verify or build each image.
    needs: [changes, core-build, cores, new-card-smoke-status-pending, new-card-smoke, new-card-smoke-report, new-card-smoke-status, effect-protocol, unit-web-build, unit-shared, small-checks, unit-duel, unit-web, ci-scripts, engine-shards, engine-legacy-shards, engine-differential, native, nduel-nightly, production-bundle, production-voice-assets, production-images, production-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          const failures = new Set();
          const requireSuccess = (name) => {
            if (jobs[name]?.result !== 'success') failures.add(`${name} was required: ${jobs[name]?.result}`);
          };
          requireSuccess('changes');
          for (const [name, job] of Object.entries(jobs)) {
            if (!['success', 'skipped'].includes(job.result)) failures.add(`${name}: ${job.result}`);
          }
          const selected = jobs.changes.outputs;
          if (['engine', 'smoke_enabled'].some(area => selected[area] === 'true') && selected.core_status !== 'success') {
            failures.add(`Engine core cache lookup: ${selected.core_status || 'missing'}`);
          }
          for (const [area, names] of Object.entries({
            web: ['unit-web'], web_build: ['unit-web-build'], shared: ['unit-shared'], bot: ['small-checks'],
            ws: ['small-checks'], worker: ['small-checks'], duel_unit: ['unit-duel'], e2e: ['small-checks'],
            ci_scripts: ['ci-scripts'], engine: ['cores', 'engine-shards', 'engine-legacy-shards', 'small-checks'],
            vision: ['small-checks'],
            core: ['native', 'engine-differential'],
          })) if (selected[area] === 'true') names.forEach(requireSuccess);
          if (process.env.NIGHTLY === 'true') requireSuccess('nduel-nightly');
          if (selected.typecheck) requireSuccess('small-checks');
          if (selected.effects === 'true' || selected.effect_types === 'true' || selected.effect_smoke) requireSuccess('effect-protocol');
          if (selected.smoke_enabled === 'true') requireSuccess('new-card-smoke-report');
          if (process.env.EVENT === 'push') ['production-bundle', 'production-voice-assets', 'production-images'].forEach(requireSuccess);
          if (process.env.EVENT !== 'push' && selected.prod_build === 'true') requireSuccess('production-dry-run');
          if (failures.size) {
            const { appendFileSync } = await import('node:fs');
            const summary = [...failures].map(failure => '- ' + failure).join('\n');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Failed CI checks\n${summary}\n`);
            console.error(summary);
            process.exitCode = 1;
          }
          JS
      - name: Report nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = 'Nightly full Test failed';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
            if (issues.some(issue => !issue.pull_request && issue.title === title)) return;
            await github.rest.issues.create({ owner, repo, title,
              body: `Full nightly CI failed for ${context.sha}.\n\nhttps://github.com/${owner}/${repo}/actions/runs/${context.runId}\n\nSee docs/runbooks/test-and-nightly.md.` });
