  ci-result:
    name: CI result
    if: always()
    needs: [changes, core-cache, core-build, cores, new-card-smoke-status-pending, new-card-smoke, new-card-smoke-report, new-card-smoke-status, effect-protocol, unit-web-build, unit-shared, unit-bot, unit-ws, unit-worker, unit-duel, unit-web, unit-e2e, ci-scripts, engine-shards, engine-legacy-shards, native, rule-coverage, nduel-nightly, production-bundle, production-images, production-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          const requireSuccess = (name) => {
            if (jobs[name]?.result !== 'success') throw new Error(`${name} was required: ${jobs[name]?.result}`);
          };
          requireSuccess('changes');
          for (const [name, job] of Object.entries(jobs)) {
            if (!['success', 'skipped'].includes(job.result)) throw new Error(`${name}: ${job.result}`);
          }
          const selected = jobs.changes.outputs;
          if (process.env.EVENT !== 'schedule') {
            for (const [area, names] of Object.entries({
              web: selected.data_only === 'true' ? ['unit-web'] : ['unit-web', 'unit-web-build'], shared: ['unit-shared'], bot: ['unit-bot'],
              ws: ['unit-ws'], worker: ['unit-worker'], duel_unit: ['unit-duel'], e2e: ['unit-e2e'],
              ci_scripts: ['ci-scripts'], engine: ['core-cache', 'cores', 'engine-shards', 'engine-legacy-shards', 'native', 'rule-coverage'],
            })) if (selected[area] === 'true') names.forEach(requireSuccess);
            requireSuccess('effect-protocol');
          }
          if (selected.smoke_enabled === 'true') requireSuccess('new-card-smoke-report');
          if (process.env.EVENT === 'push') ['production-bundle', 'production-images'].forEach(requireSuccess);
          if (process.env.EVENT === 'pull_request') requireSuccess('production-dry-run');
          JS
