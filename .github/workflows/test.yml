name: Test

# Path-selected app groups: web, bot, ws, worker, shared, duel (no core), e2e and CI scripts.
# Shared source selects all app consumers; only shared imports reachable from duel-server/src
# select engine suites. Root build/install/workflow configuration selects everything.
# Docs-only changes run detection and the final CI result, with no test groups.
# Engine suites and their sharding are described in docs/adr/0003-duel-test-layers.md.
# Main uses the same paths, diffing from its last successful tested ancestor.
# Missing diffs and manual runs select all groups. Nightly behavior is documented below.
# PRs never publish production images; Deploy requires a successful main push Test.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Run the nightly nduel fuzz and golden check"
        type: boolean
        required: false
        default: true
      new_card_smoke:
        description: "Run new/changed-card smoke for the open chore/engine-data-update PR (dispatch that branch)"
        type: boolean
        required: false
        default: false
      nduel_seeds:
        description: "Seeds per nduel case in the nightly fuzz"
        required: false
        default: "100"

concurrency:
  # Superseded main tests cancel to free runner slots; production Deploy stays serialized.
  # Bot PR/dispatch runs for one head share a serial group so an older PASS cannot
  # overwrite a newer FAIL. Different heads and ordinary nightly/main runs stay independent.
  group: test-${{ github.workflow }}-${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/engine-data-update' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.new_card_smoke && github.ref == 'refs/heads/chore/engine-data-update')) && format('card-data-{0}', github.event.pull_request.head.sha || github.sha) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request' && (github.event.pull_request.head.ref != 'chore/engine-data-update' || github.event.pull_request.head.repo.full_name != github.repository) }}

permissions:
  contents: read

env:
  # The engine bundle for CI. Not data/duel-engine (that is the deploy bundle, with no multi cores).
  # data/duel-engine-next is also the folder the native nduel tools read by default.
  BUNDLE_DIR: data/duel-engine-next

jobs:
  # PR file lists come from the paginated API (including old names for renames).
  # Main keeps full history for the last-successful-ancestor diff; missing diffs run everything.
  changes:
    name: Changed layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      web: ${{ steps.diff.outputs.web }}
      bot: ${{ steps.diff.outputs.bot }}
      ws: ${{ steps.diff.outputs.ws }}
      worker: ${{ steps.diff.outputs.worker }}
      shared: ${{ steps.diff.outputs.shared }}
      duel_unit: ${{ steps.diff.outputs.duel_unit }}
      e2e: ${{ steps.diff.outputs.e2e }}
      ci_scripts: ${{ steps.diff.outputs.ci_scripts }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
      data_only: ${{ steps.diff.outputs.data_only }}
      effects: ${{ steps.diff.outputs.effects }}
      prod_build: ${{ steps.diff.outputs.prod_build }}
      engine: ${{ steps.diff.outputs.engine }}
      golden: ${{ steps.diff.outputs.golden }}
      tests_only: ${{ steps.diff.outputs.tests_only }}
      base: ${{ steps.diff.outputs.base }}
      head: ${{ steps.diff.outputs.head }}
      smoke_enabled: ${{ steps.smoke.outputs.smoke_enabled }}
      smoke_pr: ${{ steps.smoke.outputs.smoke_pr }}
      smoke_base: ${{ steps.smoke.outputs.smoke_base }}
      smoke_head: ${{ steps.smoke.outputs.smoke_head }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      - name: Check admin spectate service configuration
        run: prlimit --core=0 -- node scripts/ci/check-admin-spectate-compose.mjs

      - name: Find tested main ancestor
        id: baseline
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/tested-main-base.mjs

      - name: Diff changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ steps.baseline.outputs.base }}
          PUSH_AFTER: ${{ github.sha }}
        run: node scripts/ci/changed-layers.mjs

      - name: Resolve new-card smoke PR
        id: smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: prlimit --core=0 -- node scripts/ci/new-card-smoke-context.mjs

  core-cache:
    name: Engine core cache
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.smoke_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.bundle.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # v5 keeps the parallel build inputs and invalidates bundles from before PR #124.
      # Raise the literal version when workflow build flags or bundle metadata change.
      # The emsdk image comes from pins.json; the independent builders read the same pin.
      - name: Compute bundle cache key
        id: key
        run: echo "key=duel-engine-ci-v5-${{ hashFiles('scripts/ci/build-core.sh', 'scripts/ci/parallel-emxx.py', 'scripts/ci/bin/em++', 'scripts/ci/core-cache-key.mjs', 'scripts/ci/assemble-core-bundle.mjs', 'packages/duel-server/scripts/prepare-data.ts', 'packages/duel-server/scripts/card-script-patches.ts', 'packages/duel-server/card-script-patches/**', 'packages/duel-server/scripts/released-card-data.ts', 'packages/duel-server/scripts/prerelease-history.ts', 'packages/duel-server/scripts/prerelease-graduations.ts', 'packages/duel-server/scripts/prerelease-script-smoke.ts', 'packages/duel-server/scripts/prerelease-script-exclusions.ts', 'packages/duel-server/card-remap-overrides.json', 'packages/duel-server/scripts/build-domain-core.ts', 'packages/duel-server/scripts/build-domain-core.sh', 'packages/duel-server/scripts/build-standard-core.sh', 'packages/duel-server/scripts/build-multi-core.sh', 'packages/duel-server/scripts/prepare-multi-core-tree.sh', 'packages/duel-server/scripts/multi-core-common.sh', 'packages/duel-server/domain-core/pins.json', 'packages/duel-server/domain-core/expected-sha256.txt', 'packages/duel-server/domain-core/patches/*.patch', 'packages/duel-server/domain-core/src/**', 'packages/duel-server/domain-core/lua/**', 'packages/duel-server/legacy-1v1/**', 'packages/duel-server/domain-core/multi-scripts/**', 'packages/duel-server/src/multi-scripts.ts', 'packages/duel-server/src/released-database-files.ts', 'packages/duel-server/src/cards.ts', 'packages/shared/src/duels/**', 'packages/shared/package.json', 'packages/shared/tsconfig*.json', 'tsconfig.json', 'patches/ocgcore-wasm+0.1.2.patch', 'package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Read the emsdk image from pins.json
        run: node -p "const e = require('./packages/duel-server/domain-core/pins.json').emscripten; 'EMSDK_IMAGE=' + e.image + '@' + e.digest" >> "$GITHUB_ENV"
      - name: Look up engine bundle
        id: bundle
        uses: actions/cache/restore@v4
        with:
          lookup-only: true
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ steps.key.outputs.key }}

  core-build:
    name: Build core (${{ matrix.target }})
    if: needs.core-cache.outputs.hit != 'true'
    needs: core-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [standard, domain, legacy-domain, multi, multi-domain, multi-ref, multi-ref-domain, multi-trap, multi-domain-trap]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute core cache key
        id: key
        run: node scripts/ci/core-cache-key.mjs ${{ matrix.target }}
      - name: Restore compiled core
        id: core
        uses: actions/cache/restore@v4
        with:
          path: ci-core/${{ matrix.target }}
          key: ${{ steps.key.outputs.key }}
      - name: Setup Node.js
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore compiler libraries
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/emscripten
          key: emcache-v1-${{ matrix.target }}-${{ hashFiles('packages/duel-server/domain-core/pins.json', 'packages/duel-server/legacy-1v1/domain-core/pins.json') }}-${{ steps.key.outputs.key }}
          # Emscripten validates its system-library flags. A previous patch series can reuse those libraries.
          restore-keys: |
            emcache-v1-${{ matrix.target }}-${{ hashFiles('packages/duel-server/domain-core/pins.json', 'packages/duel-server/legacy-1v1/domain-core/pins.json') }}-
      - name: Install
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          npm ci --ignore-scripts
          npx patch-package --error-on-fail
      - name: Build core with all runner CPUs
        if: steps.core.outputs.cache-hit != 'true'
        run: prlimit --core=1:1 -- bash scripts/ci/build-core.sh ${{ matrix.target }}
      - name: Verify compiled core hashes
        run: prlimit --core=1:1 -- bash scripts/ci/build-core.sh ${{ matrix.target }} --verify-only
      - name: Save compiled core
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ci-core/${{ matrix.target }}
          key: ${{ steps.key.outputs.key }}
      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: ci-core/
          if-no-files-found: error
          retention-days: 1

  cores:
    name: Engine cores (build or restore)
    if: always() && needs.core-cache.result == 'success'
    needs: [core-cache, core-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ needs.core-cache.outputs.key }}
    steps:
      - name: Check core build results
        env:
          CORE_BUILD: ${{ needs.core-build.result }}
        run: |
          case "$CORE_BUILD" in
            success|skipped) ;;
            *) echo "Core build result: $CORE_BUILD" >&2; exit 1 ;;
          esac
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore engine bundle
        if: needs.core-cache.outputs.hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.core-cache.outputs.key }}
          fail-on-cache-miss: true
      - name: Setup Node.js
        if: needs.core-cache.outputs.hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: needs.core-cache.outputs.hit != 'true'
        run: npm ci
      # The prerelease smoke check uses the shared artwork resolver through src/cards.ts.
      - name: Build shared for card preparation
        if: needs.core-cache.outputs.hit != 'true'
        run: npm run build --workspace=packages/shared
      - name: Prepare card data and scripts
        if: needs.core-cache.outputs.hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
        run: npm run duel:prepare
      - name: Download all cores
        if: needs.core-cache.outputs.hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: ci-core
          merge-multiple: true
      # Build jobs have separate manifests. Only this step writes the final manifest, in serial build order.
      - name: Assemble engine bundle
        if: needs.core-cache.outputs.hit != 'true'
        env:
          DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
        run: node scripts/ci/assemble-core-bundle.mjs

      - name: Install multi cores into the bundle
        if: needs.core-cache.outputs.hit != 'true'
        run: |
          set -eu
          dist=packages/duel-server/domain-core/dist
          cp "$dist/ocgcore.multi.sync.wasm" "$BUNDLE_DIR/ocgcore.multi.wasm"
          cp "$dist/ocgcore.multi-domain.sync.wasm" "$BUNDLE_DIR/ocgcore.multi-domain.wasm"
          for stem in ocgcore.multi ocgcore.multi-domain; do
            printf 'tag=ci-%s\nsource=%s\nsha256=%s\ncapabilities=ffa3-facing-extra-zones,ffa4-facing-extra-zones,tag-facing-extra-zones\ninstalled=%s\nnote=built by .github/workflows/test.yml\n' \
              "${GITHUB_SHA::12}" "$dist/$stem.sync.wasm" \
              "$(sha256sum "$dist/$stem.sync.wasm" | cut -d' ' -f1)" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$BUNDLE_DIR/$stem.SOURCE"
          done

      - name: Verify engine bundle
        run: |
          set -eu
          for f in ocgcore.standard.wasm ocgcore.domain.wasm ocgcore.multi.wasm ocgcore.multi-domain.wasm ocgcore.multi.SOURCE ocgcore.multi-domain.SOURCE cards.cdb; do
            test -s "$BUNDLE_DIR/$f" || { echo "bundle file missing or empty: $BUNDLE_DIR/$f" >&2; exit 1; }
          done
          for f in ocgcore.multi.sync.wasm ocgcore.multi-ref.sync.wasm ocgcore.multi-domain.sync.wasm ocgcore.multi-ref-domain.sync.wasm ocgcore.multi-trap.sync.wasm ocgcore.multi-domain-trap.sync.wasm; do
            test -s "packages/duel-server/domain-core/dist/$f" || { echo "differential core missing or empty: $f" >&2; exit 1; }
          done
          DUEL_DATA_DIR="$PWD/$BUNDLE_DIR" sh packages/duel-server/scripts/install-engine-bundle.sh
          # The legacy 1v1 files must match the approved legacy pin (sha256 pinned in legacy-1v1/expected-sha256.txt), also when the bundle came from the cache.
          sh packages/duel-server/scripts/check-legacy-pin.sh "$PWD/$BUNDLE_DIR"

      - name: Verify pinned core hashes
        run: |
          set -eu
          dist=packages/duel-server/domain-core/dist
          (cd "$dist" && sha256sum --check ../expected-sha256.txt)
          for target in domain multi multi-domain; do
            cmp "$dist/ocgcore.$target.sync.wasm" "$BUNDLE_DIR/ocgcore.$target.wasm"
          done

      - name: Save engine bundle
        if: needs.core-cache.outputs.hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.core-cache.outputs.key }}

  # Dispatch job checks cannot satisfy PR rulesets. Explicit commit statuses use
  # the report's stable context; hold it pending before any smoke can start.
  new-card-smoke-status-pending:
    name: New card smoke merge gate (pending)
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/engine-data-update' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.new_card_smoke && github.ref == 'refs/heads/chore/engine-data-update')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      SMOKE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout status helper without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js without dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hold the merge gate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: prlimit --core=0 -- node scripts/ci/new-card-smoke-status.mjs pending

  new-card-smoke:
    name: New card engine smoke (${{ matrix.shard }}/4)
    if: ${{ !cancelled() && needs.cores.result == 'success' && needs.new-card-smoke-status-pending.result == 'success' && needs.changes.outputs.smoke_enabled == 'true' }}
    needs: [changes, cores, new-card-smoke-status-pending]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      SMOKE_BASE: ${{ needs.changes.outputs.smoke_base }}
      SMOKE_HEAD: ${{ needs.changes.outputs.smoke_head }}
      SMOKE_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout base and head history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore engine bundle and test dependencies
        uses: ./.github/actions/restore-engine-bundle
        with:
          key: ${{ needs.cores.outputs.key }}

      # The runner reads prepare-data.ts at these exact refs. Its own selection adds
      # the fixed 150-card sample when shared Lua helpers change; do not select again here.
      - name: Smoke new and changed cards
        id: smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          result=0
          prlimit --core=0 -- node --import tsx packages/duel-server/scripts/new-card-smoke.ts \
            --from-pin "$SMOKE_BASE" --to-pin "$SMOKE_HEAD" \
            --jobs 4 --shard "$SMOKE_SHARD/4" --output ".status/new-card-smoke-$SMOKE_SHARD" || result=$?
          case "$result" in
            0) ;;
            1) echo "::error::New-card smoke FAIL. Read the shard report for card names and reasons."; exit 1 ;;
            2) echo "::error::New-card smoke input/download/infrastructure error. Read the runner logs."; exit 2 ;;
            3) echo "::warning::New-card smoke incomplete: time budget reached. Review unfinished cards in the report." ;;
            *) echo "::error::Unexpected new-card smoke exit code: $result"; exit "$result" ;;
          esac

      - name: Save shard JSON and Markdown even on FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-card-smoke-${{ matrix.shard }}
          path: |
            .status/new-card-smoke-${{ matrix.shard }}.json
            .status/new-card-smoke-${{ matrix.shard }}.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  new-card-smoke-report:
    name: New card engine smoke report
    # Eligibility must not depend on resolver outputs: resolver/checkout failures
    # still need an ERROR report and failed merge gate.
    if: >-
      always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/engine-data-update' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.new_card_smoke && github.ref == 'refs/heads/chore/engine-data-update'))
    needs: [changes, cores, new-card-smoke, new-card-smoke-status-pending]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    # Serialize comment creation across PR and dispatch runs for the same PR head.
    concurrency:
      group: new-card-smoke-report-${{ github.repository }}-${{ needs.changes.outputs.smoke_pr || github.event.pull_request.number || github.ref }}-${{ needs.changes.outputs.smoke_head || github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    env:
      SMOKE_PR: ${{ needs.changes.outputs.smoke_pr || github.event.pull_request.number }}
      SMOKE_BASE: ${{ needs.changes.outputs.smoke_base || github.event.pull_request.base.sha || 'unavailable' }}
      SMOKE_HEAD: ${{ needs.changes.outputs.smoke_head || github.event.pull_request.head.sha || github.sha }}
      SMOKE_RESULT: ${{ needs.new-card-smoke.result }}
      SMOKE_CONTEXT_RESULT: ${{ needs.changes.result }}
      SMOKE_SHARD_COUNT: "4"
    steps:
      - name: Checkout report helpers without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js without dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download all available shard reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: new-card-smoke-*
          path: .status/new-card-smoke-shards
          merge-multiple: true

      # No install or candidate engine code executes with this write token.
      # The helper checks the current PR branch/repo/head before creating or editing its marker.
      - name: Merge reports, write summary and update sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: prlimit --core=0 -- node scripts/ci/new-card-smoke-report.mjs

      - name: Save the complete merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-card-smoke-report
          path: |
            .status/new-card-smoke-report.json
            .status/new-card-smoke-report.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  new-card-smoke-status:
    name: New card smoke merge gate (final)
    if: >-
      always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/engine-data-update' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.new_card_smoke && github.ref == 'refs/heads/chore/engine-data-update'))
    needs: [new-card-smoke-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      SMOKE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SMOKE_REPORT_RESULT: ${{ needs.new-card-smoke-report.result }}
    steps:
      - name: Checkout status helper without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js without dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish the required merge-gate result
        env:
          GH_TOKEN: ${{ github.token }}
        run: prlimit --core=0 -- node scripts/ci/new-card-smoke-status.mjs final

  effect-protocol:
    name: Effect tagging protocol
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Validate effect tagging protocol without paid requests
        run: |
          prlimit --core=0 -- npx tsc -p scripts/effects/tsconfig.json --noEmit
          prlimit --core=0 -- npx vitest run scripts/effects/tests/effect-tagging.integration.test.ts --maxWorkers=1

  unit-web-build:
    name: Web production build
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.web == 'true' && needs.changes.outputs.data_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Generate Next route types
        run: npm exec --workspace=packages/web -- next typegen
      - name: Typecheck web
        run: npm run typecheck --workspace=packages/web
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/web/.next/cache
          key: next-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
      - name: Build web with a dummy Clerk public key
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          NEXT_BUILD_FS_CACHE: "1"
        run: bash scripts/ci/build-web.sh
      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

  unit-shared:
    name: Shared unit tests
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Typecheck shared
        if: needs.changes.outputs.data_only != 'true'
        run: npm run typecheck --workspace=packages/shared
      - name: Test shared
        if: needs.changes.outputs.data_only != 'true'
        run: npm test --workspace=packages/shared
      - name: Test shared effects and staple data consumers
        if: needs.changes.outputs.data_only == 'true'
        run: npm test --workspace=packages/shared -- tests/effect-artifact.integration.test.ts tests/effect-search.integration.test.ts tests/cube-effect-search.integration.test.ts

  unit-bot:
    name: Bot tests and typecheck
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build dependencies
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Typecheck bot
        run: npm run typecheck --workspace=packages/bot
      - name: Test bot
        run: npm test --workspace=packages/bot

  unit-ws:
    name: WS tests and typecheck
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.ws == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build dependencies
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Typecheck ws
        run: npm run typecheck --workspace=packages/ws
      - name: Test ws
        run: npm test --workspace=packages/ws

  unit-worker:
    name: Worker tests and typecheck
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build dependencies
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/worker
      - name: Typecheck worker
        run: npm run typecheck --workspace=packages/worker
      - name: Test worker
        run: npm test --workspace=packages/worker

  unit-duel:
    name: Duel tests and typecheck (no core)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.duel_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.changes.outputs.tests_only == 'true' && '0' || '1' }}
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Typecheck duel-server
        if: needs.changes.outputs.data_only != 'true'
        run: npm run typecheck --workspace=packages/duel-server
      - name: Select changed test files
        id: selection
        if: needs.changes.outputs.tests_only == 'true'
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/select-engine-tests.mjs

      # Needs the test:unit script of duel-server: the tests that load no wasm core.
      - name: Test duel-server (no core)
        env:
          CI_TEST_FILES: ${{ steps.selection.outputs.files }}
          DATA_ONLY: ${{ needs.changes.outputs.data_only }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const selected = process.env.CI_TEST_FILES ? JSON.parse(process.env.CI_TEST_FILES) : undefined;
          const narrow = selected?.length > 0;
          const files = process.env.DATA_ONLY === 'true'
            ? ['tests/host-deck-suggestions.integration.test.ts', 'tests/host-deck-suggestion-scope.integration.test.ts', 'tests/deck-suggestion-workers.integration.test.ts']
            : narrow ? selected : ['tests'];
          if (selected?.length === 0) console.warn('Empty CI test selection; falling back to the full suite.');
          const result = spawnSync('npm', ['exec', '--workspace=packages/duel-server', '--', 'vitest', 'run', ...files,
            '--config=vitest.unit.config.ts', '--testTimeout=15000', ...(narrow ? ['--passWithNoTests'] : [])], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          JS

  unit-web:
    name: Web unit tests (${{ matrix.shard }}/3)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Test web
        if: needs.changes.outputs.data_only != 'true'
        run: npm test --workspace=packages/web -- --shard=${{ matrix.shard }}/3
      - name: Test web effects and staple data consumers
        if: needs.changes.outputs.data_only == 'true'
        run: npm test --workspace=packages/web -- tests/cube-effects-routes.integration.test.ts tests/effect-startup.integration.test.ts tests/deck-effect-search-route.integration.test.ts tests/deck-effect-search-ui.integration.test.tsx tests/effect-standalone.integration.test.ts --shard=${{ matrix.shard }}/3

  unit-e2e:
    name: E2E typecheck
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Typecheck E2E
        run: npm run typecheck --workspace=packages/e2e

  ci-scripts:
    name: CI and deployment script checks
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.ci_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Node dependencies and Turbo cache
        uses: ./.github/actions/setup-ci-node
      - name: Build shared
        run: npx turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
      - name: Deployment script tests
        run: npx vitest run scripts/deployment/deploy.test.ts
      - name: Test CI helpers
        run: |
          node --test scripts/ci/*.test.mjs
          python3 -B scripts/ci/parallel_emxx_test.py
          python3 -B -m unittest discover -s scripts/deployment -p test_deploy_safety.py
      - name: Validate workflow syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/test.yml

  engine-shards:
    name: Engine tests shard (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.count }})
    if: ${{ !cancelled() && needs.cores.result == 'success' && github.event_name != 'schedule' && needs.changes.outputs.engine == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [pinned]
        shard: [1, 2, 3, 4, 5, 6]
        count: [6]
        # Keep the slow host/differential files off the regular+Table shards.
        # Both surrender modes and all differential seeds still run across these groups.
        include:
          - { suite: surrender, shard: 1, count: 2 }
          - { suite: surrender, shard: 2, count: 2 }
          - { suite: differential, shard: 1, count: 2 }
          - { suite: differential, shard: 2, count: 2 }
    env:
      DUEL_REQUIRE_CORES: "1"
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      # The cores of the cores job have the canonical names. Without these paths cores.ts would look for the
      # local tagged builds first. NSEAT_LIVE opens the live N-seat scenarios (a missing flag fails in require mode).
      MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
      DOMAIN_MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
      NSEAT_LIVE: "1"
      # The Table test (tests/multi-scripts-table.test.ts) needs the debug core of the cores job; in require mode a missing file fails.
      TABLE_TRAP_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-trap.sync.wasm
      TABLE_TRAP_DOMAIN_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain-trap.sync.wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.changes.outputs.tests_only == 'true' && '0' || '1' }}

      - name: Restore engine bundle and test dependencies
        uses: ./.github/actions/restore-engine-bundle
        with:
          key: ${{ needs.cores.outputs.key }}

      - name: Select changed test files
        id: selection
        if: needs.changes.outputs.tests_only == 'true'
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/select-engine-tests.mjs

      - name: Engine tests
        if: needs.changes.outputs.engine == 'true'
        env:
          CI_TEST_FILES: ${{ steps.selection.outputs.files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.count }}

      # Web tests that run a real stock-core duel. The unit job has no engine bundle, so they skip there.
      # DUEL_REQUIRE_CORES=1 (from the job env) makes a missing bundle a failure here.
      # The step finds the files itself: every web test that imports the shared cores helper
      # (describeWithCores / itWithCores) runs here, so a new engine test needs no edit of this file.
      # Only direct imports of the cores helper are found. A web test that gets the helper through another module is not run here.
      # The full web suite (about 400 files) already runs in the unit job, so only the matching files run again.
      - name: Web tests with the engine
        if: matrix.suite == 'pinned' && matrix.shard == 1 && needs.changes.outputs.tests_only != 'true'
        run: |
          set -o pipefail
          # Lines that start with // or * are comments: a comment that names the helper does not count.
          files=$({ grep -rE "duel-server/tests/support/cores(\.js)?[\"']" packages/web/tests --include='*.test.ts' --include='*.test.tsx' || true; } | { grep -vE '^[^:]*:[[:space:]]*(//|\*)' || true; } | cut -d: -f1 | sed 's#^packages/web/##' | sort -u)
          if [ -z "$files" ]; then echo "No web test imports the cores helper. Fix this step."; exit 1; fi
          echo "$files"
          mapfile -t test_files <<< "$files"
          prlimit --core=1:1 -- npm exec --workspace=packages/web -- vitest run "${test_files[@]}"

      - name: Web engine tests that depend on changed duel helpers
        if: matrix.suite == 'pinned' && matrix.shard == 1 && needs.changes.outputs.tests_only == 'true'
        env:
          CI_TEST_FILES: ${{ steps.selection.outputs.web_files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs web 1/1

      # tests/*.smoke.ts are plain assert scripts (vitest does not match them); one failing script fails the step.
      - name: Engine smoke scripts
        if: needs.changes.outputs.engine == 'true' && matrix.suite == 'pinned' && matrix.shard == 1
        run: prlimit --core=1:1 -- npm run test:smoke --workspace=packages/duel-server

  engine-legacy-shards:
    name: Legacy 1v1 tests shard (${{ matrix.shard }}/2)
    if: ${{ !cancelled() && needs.cores.result == 'success' && github.event_name != 'schedule' && needs.changes.outputs.engine == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DUEL_REQUIRE_CORES: "1"
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi.sync.wasm
      DOMAIN_MULTI_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain.sync.wasm
      NSEAT_LIVE: "1"
      TABLE_TRAP_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-trap.sync.wasm
      TABLE_TRAP_DOMAIN_WASM: ${{ github.workspace }}/packages/duel-server/domain-core/dist/ocgcore.multi-domain-trap.sync.wasm
      # Production starts 1v1 duels on the legacy engine. Run only its tests and host/worker gates. The setup file
      # (tests/support/setup.ts) keeps a value that is already set. tests/legacy-main is main's engine tests, unchanged
      # except for the import paths, and they always use the legacy engine.
      DUEL_1V1_ENGINE: legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.changes.outputs.tests_only == 'true' && '0' || '1' }}

      - name: Restore engine bundle and test dependencies
        uses: ./.github/actions/restore-engine-bundle
        with:
          key: ${{ needs.cores.outputs.key }}

      - name: Select changed test files
        id: selection
        if: needs.changes.outputs.tests_only == 'true'
        env:
          BASE: ${{ needs.changes.outputs.base }}
          HEAD: ${{ needs.changes.outputs.head }}
        run: node scripts/ci/select-engine-tests.mjs

      - name: Engine tests, legacy 1v1 engine
        env:
          CI_TEST_FILES: ${{ steps.selection.outputs.files }}
        run: prlimit --core=1:1 -- node scripts/ci/run-engine-tests.mjs legacy ${{ matrix.shard }}/2

  native:
    name: Native checks (ASan and UBSan)
    if: ${{ !cancelled() && needs.cores.result == 'success' && github.event_name != 'schedule' && needs.changes.outputs.engine == 'true' }}
    needs: [cores, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The native tools read cards.cdb and the card scripts from data/duel-engine-next.
      - name: Restore engine bundle
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.cores.outputs.key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # scripts/native/checks/run.sh: builds the core from the repo patch series with ASan and UBSan and runs the
      # committed checks that are marked ready in checks.tsv. The fuzz matrix stays in nduel-nightly.
      - name: Native tests
        run: npm run test:native

      # The job runs for all engine changes; only core/overlay/data/native inputs (or a manual run) check golden.
      # Reuse test:native's repo-series library, pinned Lua and trap/ASan/UBSan flags; only compile the driver.
      - name: nduel golden hashes (--check)
        if: needs.changes.outputs.golden == 'true'
        env:
          NDUEL_DIR: ${{ github.workspace }}/packages/duel-server/domain-core/.build/nduel
          NDUEL_SKIP_BUILD: "1"
        run: |
          native="$GITHUB_WORKSPACE/packages/duel-server/domain-core/.build/native-checks"
          mkdir -p "$NDUEL_DIR"
          prlimit --core=1:1 -- g++ -std=c++17 -Wall -Wextra -Wno-unused-parameter -O1 -g1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -fno-rtti \
            -DYGO_N_TRAP -D_GLIBCXX_ASSERTIONS -I"$native/lua-src" -I"$native/multi-core-tree" \
            packages/duel-server/scripts/native/nduel.cpp "$native/libocgcore-multi.a" -o "$NDUEL_DIR/nduel"
          prlimit --core=1:1 -- bash packages/duel-server/scripts/run-nduel.sh --check

      - name: Upload native status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-status
          path: .status/
          if-no-files-found: ignore

  rule-coverage:
    name: Rule coverage (strict)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # The script imports @yugidraft/shared/dist/duels, which only exists after the build.
      - name: Build shared
        run: npm run build --workspace=@yugidraft/shared

      # --check prints the table and writes no file. --strict fails when a rule of ADR-0002 has no covering test.
      - name: Rule coverage
        run: npx tsx packages/duel-server/scripts/rule-coverage.ts --check --strict

  nduel-nightly:
    name: nduel fuzz (${{ matrix.case }})
    if: ${{ !cancelled() && needs.cores.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)) }}
    needs: cores
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        case: [n2, n3, n4, tag]
    env:
      DUEL_DATA_DIR: ${{ github.workspace }}/data/duel-engine-next
      # Seeds 1..N for the case of this leg. --check-future turns the "future" checks (turn order, first attack,
      # elimination, one win, Tag LP) into failures.
      NDUEL_SEEDS: ${{ inputs.nduel_seeds || '100' }}
      NDUEL_CASES: ${{ matrix.case }}
      NDUEL_FUTURE: "1"
      NDUEL_DIR: ${{ github.workspace }}/nduel-work/${{ matrix.case }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine bundle
        uses: actions/cache/restore@v4
        with:
          path: |
            data/duel-engine-next
            packages/duel-server/domain-core/dist
          key: ${{ needs.cores.outputs.key }}
          fail-on-cache-miss: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # run-nduel.sh builds the core with -DYGO_N_TRAP and ASan/UBSan, then runs seeds 1..NDUEL_SEEDS of the case.
      - name: nduel fuzz with --check-future
        run: bash packages/duel-server/scripts/run-nduel.sh

      # Golden hashes: one leg is enough. Reuses the build of the step before. golden.tsv was recorded without
      # --check-future, so it is off here. It runs also when the fuzz step failed (run-nduel.sh fails loudly if the
      # binary is missing).
      - name: nduel golden hashes (--check)
        if: matrix.case == 'n2' && !cancelled()
        env:
          NDUEL_SKIP_BUILD: "1"
          NDUEL_FUTURE: "0"
        run: bash packages/duel-server/scripts/run-nduel.sh --check

      - name: Upload nduel status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nduel-status-${{ matrix.case }}
          path: |
            .status/nduel-summary.json
            .status/nduel-check.json
            nduel-work/${{ matrix.case }}/runs/*.err
          if-no-files-found: ignore

  # These artifacts are unverified until this whole main push Test run succeeds.
  # Deploy uses this exact run ID and commit; PRs never publish production images.
  production-bundle:
    name: Prepare production image bundle
    outputs:
      artifact: ${{ steps.bundle-name.outputs.artifact }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare production engine bundle
        uses: ./.github/actions/prepare-production-bundle
      - name: Record production bundle artifact name
        id: bundle-name
        run: echo "artifact=production-bundle-${{ github.sha }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload production image bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.bundle-name.outputs.artifact }}
          overwrite: true
          path: ${{ runner.temp }}/deploy-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  production-images:
    name: Build ARM64 ${{ matrix.service }} image
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.production-bundle.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [production-bundle, unit-web-build, unit-web, unit-shared, unit-bot, unit-ws, unit-worker, unit-duel, unit-e2e, ci-scripts, effect-protocol]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: duel
            target: duel-bundled
          - service: web
            target: web
          - service: bot
            target: bot
          - service: worker
            target: worker
          - service: ws
            target: ws
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      IMAGE: ghcr.io/duelingdomain/yugioh-bot-${{ matrix.service }}
    steps:
      - name: Checkout main push commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - name: Build production image
        uses: ./.github/actions/build-production-image
        with:
          service: ${{ matrix.service }}
          target: ${{ matrix.target }}
          bundle-artifact: ${{ needs.production-bundle.outputs.artifact }}
          artifact-suffix: -${{ github.run_attempt }}
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

  production-dry-run:
    name: Production composites dry run (bundle and bot)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
