name: Clean GHCR images

on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

# Serialize registry cleanup with production cache writes and deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Keep recent releases and rolling caches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const org = context.repo.owner;
            const sha = /^[0-9a-f]{40}$/;
            const release = /^release-[0-9a-f]{40}$/;
            // Fixed release-tag cutover date; preserve the legacy rollback window across later runs.
            const releaseTagCutover = Date.parse("2026-10-21T00:00:00Z");
            const manifestTypes = new Set([
              "application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"
            ]);
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            let errors = 0;
            for (const service of ["duel", "web", "worker", "ws", "bot"]) {
              const package_name = `yugioh-bot-${service}`;
              try {
                const versions = await github.paginate("GET /orgs/{org}/packages/container/{package_name}/versions", {
                  org, package_name, per_page: 100
                });
                const tags = version => version.metadata.container.tags;
                versions.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
                const kept = new Set(versions.filter(version => tags(version).some(tag => release.test(tag))).slice(0, 10).map(version => version.id));
                const legacyKept = new Set(versions.filter(version => Date.parse(version.created_at) < releaseTagCutover && tags(version).some(tag => sha.test(tag))).slice(0, 10).map(version => version.id));
                const candidates = versions.filter(version => {
                  const names = tags(version);
                  if (names.length === 0) return Date.parse(version.created_at) < cutoff;
                  // Owner tags, production/previous and rolling caches protect the whole version.
                  if (names.some(tag => !sha.test(tag) && !release.test(tag))) return false;
                  if (names.some(tag => release.test(tag))) return !kept.has(version.id);
                  // Pre-cutover SHA versions may be healthy releases without release tags: keep the newest ten.
                  if (Date.parse(version.created_at) < releaseTagCutover) return !legacyKept.has(version.id);
                  // Failed/cancelled/unreleased builds have no rollback value, but allow in-flight deploys a week.
                  return Date.parse(version.created_at) < cutoff;
                });
                if (candidates.length === 0) { core.info(`${package_name}: no candidates`); continue; }
                const ids = new Set(candidates.map(version => version.id));
                const protectedDigests = new Set(versions.filter(version => !ids.has(version.id)).map(version => version.name));
                // Preserve children of retained indexes from any builds made before attestations were disabled.
                // Packages must be public. Failure to read a retained manifest stops this package before deletion.
                const repository = `${org.toLowerCase()}/${package_name}`;
                const response = await fetch(`https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull`);
                if (!response.ok) throw new Error(`Cannot read retained GHCR manifest token for ${package_name}`);
                const { token } = await response.json();
                const pending = [...protectedDigests];
                const seen = new Set();
                while (pending.length) {
                  const digest = pending.pop();
                  if (seen.has(digest)) continue;
                  seen.add(digest);
                  const manifest = await fetch(`https://ghcr.io/v2/${repository}/manifests/${digest}`, {
                    headers: {
                      Authorization: `Bearer ${token}`,
                      Accept: "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
                    }
                  });
                  if (!manifest.ok) throw new Error(`Cannot read retained GHCR manifest for ${package_name}; no versions were deleted from this package`);
                  const body = await manifest.json();
                  for (const child of body.manifests || []) {
                    // BuildKit cache indexes also contain layer and config blobs.
                    if (!manifestTypes.has(child.mediaType)) continue;
                    protectedDigests.add(child.digest);
                    pending.push(child.digest);
                  }
                }
                for (const version of candidates) {
                  if (protectedDigests.has(version.name)) continue;
                  await github.request("DELETE /orgs/{org}/packages/container/{package_name}/versions/{package_version_id}", {
                    org, package_name, package_version_id: version.id
                  });
                  core.info(`${package_name}: deleted old version ${version.id}`);
                }
              } catch (error) {
                if (error.status === 404) core.info(`${package_name}: package not created yet`);
                else {
                  errors++;
                  core.warning(`${package_name}: ${error.message}`);
                }
                continue;
              }
            }
            if (errors) core.setFailed(`GHCR cleanup failed for ${errors} package(s). See the warnings above.`);
