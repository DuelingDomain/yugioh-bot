name: Build production image
description: Build a pinned ARM64 runtime image, push it to GHCR and record its immutable digest
inputs:
  service:
    description: Runtime service name
    required: true
  target:
    description: Dockerfile build target
    required: true
  bundle-artifact:
    description: Artifact in this run with the verified production engine tarball
    required: true
  artifact-suffix:
    description: Producer attempt suffix for Test artifacts; manual Deploy keeps its existing names
    default: ""
  platform:
    description: Native build platform (PR smoke builds use amd64)
    default: linux/arm64
  push:
    description: Publish runtime images and private artifacts (false for PR dry runs)
    default: "true"
  inputs-hash:
    description: Build-input hash from scripts/ci/image-inputs.mjs; tags the image inputs-<hash> so later runs can reuse it
    default: ""
  publish-artifacts:
    description: Upload the digest artifact for Deploy (false for PR prebuilds, which only publish the reusable image)
    default: "true"
  write-caches:
    description: Write the shared registry caches (depscache, buildcache, nextcache). PR prebuilds pass false so only main refreshes them
    default: "true"
  builder:
    description: Existing Buildx builder with registry login already set up by the caller
    default: ""
runs:
  using: composite
  steps:
    - name: Detect private map export support
      id: map-export
      shell: bash
      run: |
        if grep -Eq '^FROM scratch AS web-sourcemaps$' Dockerfile; then
          echo "supported=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Check production public key
      if: inputs.service == 'web' && inputs.push == 'true'
      shell: bash
      run: |
        printf '%s' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" | grep -Eq '^pk_live_[A-Za-z0-9_-]+$' || {
          echo "Set the production NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository variable." >&2
          exit 1
        }

    - name: Download production engine bundle
      if: inputs.service == 'duel'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.bundle-artifact }}
        path: ${{ runner.temp }}/release

    - name: Prepare named engine context
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/engine"
        if [ "$IMAGE" = ghcr.io/duelingdomain/yugioh-bot-duel ]; then
          tar -C "$RUNNER_TEMP/engine" -xzf "$RUNNER_TEMP/release/deploy-bundle.tar.gz"
        fi

    - name: Set up Docker Buildx
      if: inputs.builder == ''
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      if: inputs.push == 'true' && inputs.builder == ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Find previous Next.js cache
      if: inputs.service == 'web' && inputs.push == 'true' && steps.map-export.outputs.supported == 'true'
      id: next-cache
      shell: bash
      run: |
        if digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:nextcache" 2>/dev/null |
          python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' 2>/dev/null); then
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || exit 1
          echo "context=nextcache=docker-image://$IMAGE@$digest" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js for web asset verification
      if: inputs.service == 'web'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Verify pinned vision index and prepare web image context
      if: inputs.service == 'web'
      id: vision-index
      shell: bash
      run: |
        # A manual Deploy may use this action against an older Dockerfile.
        if grep -Eq '^FROM .* AS vision-index-input$' Dockerfile; then
          context=$(mktemp -d "$RUNNER_TEMP/vision-index-context.XXXXXX")
          index_dir="$context/vision-index"
          if grep -Fxq 'COPY --from=vision-index-input /app /app' Dockerfile; then
            index_dir="$context/app/vision-index"
          fi
          node scripts/vision/index-release.mjs download packages/vision/index-manifest.json "$index_dir"
          find "$context" -exec touch -h -d @0 {} +
          echo "context=vision-index-input=$context" >> "$GITHUB_OUTPUT"
        fi

    # Web exports only final layers (mode=min), so apt and npm ci would rerun on every release.
    # The deps stage deletes source maps, so its layers are safe to cache in full. The builder keeps them
    # locally for the build below. A cache problem only costs time, never the release.
    - name: Cache web dependency layers
      if: inputs.service == 'web' && inputs.push == 'true'
      continue-on-error: true
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: deps
        platforms: ${{ inputs.platform }}
        push: false
        provenance: false
        sbom: false
        cache-from: type=registry,ref=${{ env.IMAGE }}:depscache
        cache-to: ${{ inputs.write-caches == 'true' && format('type=registry,ref={0}:depscache,mode=max,ignore-error=true', env.IMAGE) || '' }}

    - name: Build and push runtime image
      id: runtime-image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        builder: ${{ inputs.builder }}
        context: .
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platform }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.push != 'true' }}
        provenance: false
        sbom: false
        tags: |
          ${{ env.IMAGE }}:${{ env.DEPLOY_COMMIT }}
          ${{ inputs.inputs-hash != '' && format('{0}:inputs-{1}', env.IMAGE, inputs.inputs-hash) || '' }}
        build-args: |
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY=${{ env.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN=${{ inputs.service == 'web' && env.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_ORG=${{ inputs.service == 'web' && env.SENTRY_ORG || '' }}
          SENTRY_PROJECT=${{ inputs.service == 'web' && env.SENTRY_PROJECT || '' }}
          SENTRY_ENVIRONMENT=${{ inputs.service == 'web' && 'production' || '' }}
          SENTRY_RELEASE=${{ inputs.service == 'web' && env.DEPLOY_COMMIT || '' }}
          SENTRY_GENERATE_SOURCEMAPS=${{ inputs.service == 'web' && '1' || '0' }}
        build-contexts: |
          engine=${{ runner.temp }}/engine
          ${{ steps.next-cache.outputs.context }}
          ${{ steps.vision-index.outputs.context }}
        labels: |
          org.opencontainers.image.source=https://github.com/DuelingDomain/yugioh-bot
          org.opencontainers.image.revision=${{ env.DEPLOY_COMMIT }}
          ${{ inputs.inputs-hash != '' && format('dev.duelingdomain.inputs={0}', inputs.inputs-hash) || '' }}
        cache-from: ${{ inputs.push == 'true' && format('type=registry,ref={0}:buildcache', env.IMAGE) || '' }}
        # Web intermediate layers include private maps; export final runtime layers only.
        cache-to: ${{ inputs.push == 'true' && inputs.write-caches == 'true' && format('type=registry,ref={0}:buildcache,mode={1}', env.IMAGE, inputs.service == 'web' && 'min' || 'max') || '' }}

    - name: Record runtime image digest
      if: inputs.push == 'true'
      env:
        SERVICE: ${{ inputs.service }}
        IMAGE_DIGEST: ${{ steps.runtime-image.outputs.digest }}
        INPUTS_HASH: ${{ inputs.inputs-hash }}
      shell: bash
      run: |
        printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || exit 1
        mkdir -p "$RUNNER_TEMP/image-digests"
        printf '%s %s\n' "$SERVICE" "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digests/$SERVICE.digest"
        # Deploy restarts only services whose inputs changed. A full build bakes its own commit as the Sentry release.
        if [ -n "$INPUTS_HASH" ]; then printf '%s %s\n' "$SERVICE" "$INPUTS_HASH" > "$RUNNER_TEMP/image-digests/$SERVICE.inputs"; fi
        if [ "$SERVICE" = web ]; then printf '%s' "$DEPLOY_COMMIT" > "$RUNNER_TEMP/image-digests/sentry-release"; fi
        printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

    - name: Export exact web source maps to private artifact
      if: inputs.service == 'web' && inputs.push == 'true' && steps.map-export.outputs.supported == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: web-sourcemaps
        platforms: ${{ inputs.platform }}
        push: false
        provenance: false
        sbom: false
        outputs: type=local,dest=${{ runner.temp }}/image-digests
        build-args: |
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY=${{ env.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN=${{ inputs.service == 'web' && env.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_ORG=${{ inputs.service == 'web' && env.SENTRY_ORG || '' }}
          SENTRY_PROJECT=${{ inputs.service == 'web' && env.SENTRY_PROJECT || '' }}
          SENTRY_ENVIRONMENT=${{ inputs.service == 'web' && 'production' || '' }}
          SENTRY_RELEASE=${{ inputs.service == 'web' && env.DEPLOY_COMMIT || '' }}
          SENTRY_GENERATE_SOURCEMAPS=${{ inputs.service == 'web' && '1' || '0' }}
        build-contexts: ${{ steps.next-cache.outputs.context }}

    - name: Preserve older manual refs without map export
      if: inputs.service == 'web' && inputs.push == 'true' && steps.map-export.outputs.supported != 'true'
      shell: bash
      run: |
        tar -czf "$RUNNER_TEMP/image-digests/web-sourcemaps.tar.gz" --files-from /dev/null
        echo "Older Dockerfile has no private source-map export; skip Next cache publication and source-map upload." >> "$GITHUB_STEP_SUMMARY"

    # A later run that reuses this image needs its exact source maps and release name. The maps stay in a
    # private artifact: the GHCR packages are public and must never hold them.
    - name: Keep reusable web source maps
      if: inputs.service == 'web' && inputs.push == 'true' && inputs.inputs-hash != '' && steps.map-export.outputs.supported == 'true'
      continue-on-error: true
      shell: bash
      env:
        IMAGE_DIGEST: ${{ steps.runtime-image.outputs.digest }}
      run: |
        set -eu
        mkdir -p "$RUNNER_TEMP/web-maps"
        cp "$RUNNER_TEMP/image-digests/web-sourcemaps.tar.gz" "$RUNNER_TEMP/image-digests/sentry-release" "$RUNNER_TEMP/web-maps/"
        # The reuse step checks that these maps belong to the image it found.
        printf '%s' "$IMAGE_DIGEST" > "$RUNNER_TEMP/web-maps/image-digest"

    - name: Upload reusable web source maps
      if: inputs.service == 'web' && inputs.push == 'true' && inputs.inputs-hash != '' && steps.map-export.outputs.supported == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: web-maps-${{ inputs.inputs-hash }}
        path: ${{ runner.temp }}/web-maps/*
        if-no-files-found: error
        retention-days: 7
        overwrite: true

    - name: Upload runtime image digest
      if: inputs.push == 'true' && inputs.publish-artifacts == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: production-image-${{ inputs.service }}-${{ env.DEPLOY_COMMIT }}${{ inputs.artifact-suffix }}
        path: ${{ runner.temp }}/image-digests/*
        if-no-files-found: error
        retention-days: 1
        overwrite: true

    - name: Save Next.js cache for the next source revision
      if: inputs.service == 'web' && inputs.push == 'true' && inputs.write-caches == 'true' && steps.map-export.outputs.supported == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: web-cache
        platforms: ${{ inputs.platform }}
        push: true
        provenance: false
        sbom: false
        tags: ${{ env.IMAGE }}:nextcache
        build-args: |
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY=${{ env.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN=${{ inputs.service == 'web' && env.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_ORG=${{ inputs.service == 'web' && env.SENTRY_ORG || '' }}
          SENTRY_PROJECT=${{ inputs.service == 'web' && env.SENTRY_PROJECT || '' }}
          SENTRY_ENVIRONMENT=${{ inputs.service == 'web' && 'production' || '' }}
          SENTRY_RELEASE=${{ inputs.service == 'web' && env.DEPLOY_COMMIT || '' }}
          SENTRY_GENERATE_SOURCEMAPS=${{ inputs.service == 'web' && '1' || '0' }}
        build-contexts: ${{ steps.next-cache.outputs.context }}
        labels: |
          org.opencontainers.image.source=https://github.com/DuelingDomain/yugioh-bot
        cache-from: ${{ inputs.push == 'true' && format('type=registry,ref={0}:buildcache', env.IMAGE) || '' }}
