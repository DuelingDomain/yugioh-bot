name: Restore engine test bundle
description: Restore the verified CI bundle and install/build the Node engine test dependencies
inputs:
  key:
    description: Exact bundle cache key from the cores job
    required: true
runs:
  using: composite
  steps:
    - name: Restore engine bundle
      uses: actions/cache/restore@v4
      with:
        path: |
          data/duel-engine-next
          packages/duel-server/domain-core/dist
        key: ${{ inputs.key }}
        fail-on-cache-miss: true
    - name: Restore Node dependencies and Turbo cache
      uses: ./.github/actions/setup-ci-node
    - name: Build shared
      shell: bash
      run: prlimit --core=0 -- npx --no-install turbo run build --cache-dir=.turbo/cache --filter=@yugidraft/shared
