<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <!-- Original table illustration. All cards use geometric backs. -->
  <defs>
    <radialGradient id="table"><stop stop-color="#232444"/><stop offset="1" stop-color="#080D18"/></radialGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#30213D"/><stop offset="1" stop-color="#100F24"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#A78BFA" stroke-opacity=".06"/></pattern>
    <g id="back"><rect width="54" height="78" rx="5" fill="url(#card)" stroke="#C9A45C" stroke-width="2"/><rect x="5" y="5" width="44" height="68" rx="3" fill="none" stroke="#C9A45C" stroke-opacity=".4"/><path d="M27 22 39 39 27 56 15 39Z" fill="none" stroke="#C9A45C" stroke-width="2"/><path d="M27 33 31 39 27 45 23 39Z" fill="#C9A45C"/></g>
    <g id="zones" fill="#0A0E1A" fill-opacity=".6" stroke="#414967"><rect width="64" height="90" rx="5"/><rect x="78" width="64" height="90" rx="5"/><rect x="156" width="64" height="90" rx="5"/><rect x="234" width="64" height="90" rx="5"/><rect x="312" width="64" height="90" rx="5"/></g>
    <g id="seat">
      <rect width="536" height="260" rx="20" fill="#141929" fill-opacity=".65" stroke="#C9A45C" stroke-opacity=".35"/>
      <use href="#zones" x="80" y="27"/><use href="#zones" x="80" y="141"/>
      <use href="#back" x="85" y="33"/><use href="#back" x="241" y="33"/><use href="#back" x="397" y="147"/>
      <rect x="19" y="94" width="38" height="60" rx="5" fill="none" stroke="#A78BFA"/>
      <path d="M38 111 46 124 38 137 30 124Z" fill="#A78BFA"/>
    </g>
  </defs>
  <rect width="1440" height="900" fill="url(#table)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <ellipse cx="720" cy="476" rx="650" ry="361" fill="none" stroke="#C9A45C" stroke-opacity=".15"/>
  <ellipse cx="720" cy="476" rx="615" ry="334" fill="none" stroke="#A78BFA" stroke-opacity=".12"/>
  <g font-family="sans-serif" font-size="14" letter-spacing="4" fill="#8892B0">
    <text x="80" y="58">DUELING DOMAIN</text><text x="1080" y="58">TABLE ILLUSTRATION</text>
    <text x="165" y="145">PLAYER ONE</text><text x="865" y="145">PLAYER TWO</text><text x="472" y="584">PLAYER THREE</text>
  </g>
  <use href="#seat" x="115" y="170"/><use href="#seat" x="789" y="170"/>
  <use href="#seat" x="452" y="610"/>
  <g transform="translate(720 511)" fill="none">
    <circle r="60" stroke="#C9A45C" stroke-opacity=".6"/><circle r="49" stroke="#A78BFA" stroke-opacity=".4"/>
    <path d="M0 -30 24 0 0 30 -24 0Z" stroke="#C9A45C" stroke-width="2"/>
    <path d="M-64 -16 -191 -65M64 -16 191 -65M0 64v23" stroke="#C9A45C" stroke-dasharray="4 8" stroke-opacity=".4"/>
  </g>
</svg>
