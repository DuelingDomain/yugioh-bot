<svg xmlns="http://www.w3.org/2000/svg" class="live anim o1 " viewBox="0 0 96 96" role="img"><title>Dueling Domain: In the slot, animated</title><style>svg{fill:#C9A45C}
.o1-card{opacity:0;fill:#F3DDA0}
.o1-card,.o1-gem{transform-box:fill-box;transform-origin:center}
.live .o1-body{animation:o1body 320ms cubic-bezier(.23,1,.32,1) both}
.live .o1-card{animation:o1card 1150ms cubic-bezier(.23,1,.32,1) 160ms both}
.live .o1-gem{animation:o1gem 340ms cubic-bezier(.23,1,.32,1) 1180ms both}
.live .glint{animation:glint 8s linear 1.6s infinite}
@keyframes o1body{from{opacity:0;transform:translateY(5px)}}
@keyframes o1card{0%{opacity:0;transform:translateY(-70px) rotate(-14deg)}12%{opacity:1}42%{opacity:1;transform:translateY(0) rotate(-5deg)}58%{opacity:1;transform:rotate(0) scale(1)}72%{opacity:1;transform:rotate(0) scale(1)}100%{opacity:0;transform:rotate(45deg) scale(.24)}}
@keyframes o1gem{0%{opacity:0;transform:scale(.3) rotate(-45deg)}60%{opacity:1;transform:scale(1.22)}100%{opacity:1;transform:scale(1)}}
@keyframes glint{0%{transform:translateX(0)}9%,100%{transform:translateX(170px)}}
.o2-wheel,.o2-c{transform-box:view-box;transform-origin:48px 48px}
.live .o2-c{animation:o2deal 340ms cubic-bezier(.23,1,.32,1) calc(var(--i) * 80ms) both}
.live .o2-wheel{animation:o2pass 6s cubic-bezier(.23,1,.32,1) 700ms infinite}
@keyframes o2deal{from{opacity:0;transform:scale(.25)}}
@keyframes o2pass{0%{transform:rotate(0)}13%,100%{transform:rotate(90deg)}}
.o3-turn{transform-box:view-box;transform-origin:48px 48px}
.o3-spark{opacity:0;transform-box:fill-box;transform-origin:left center}
.live .o3-a{animation:o3a 460ms cubic-bezier(.23,1,.32,1) both}
.live .o3-b{animation:o3b 460ms cubic-bezier(.23,1,.32,1) both}
.live .o3-spark{animation:o3spark 720ms cubic-bezier(.23,1,.32,1) 320ms both}
.live .o3-turn{animation:o3turn 7s cubic-bezier(.23,1,.32,1) 1.6s infinite}
@keyframes o3a{from{opacity:0;transform:translate(-16px,-16px)}}
@keyframes o3b{from{opacity:0;transform:translate(16px,16px)}}
@keyframes o3spark{0%{opacity:0;transform:scaleX(0)}30%{opacity:1}70%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
@keyframes o3turn{0%{transform:rotate(0)}12%,100%{transform:rotate(180deg)}}
@media (prefers-reduced-motion:reduce){.anim,.anim *{animation:none!important}}
</style><defs><clipPath id="o1clip-o1file"><path fill-rule="evenodd" d="M18 12H56L78 34V62L56 84H18Z M33 26H55A3 3 0 0 1 58 29V67A3 3 0 0 1 55 70H33A3 3 0 0 1 30 67V29A3 3 0 0 1 33 26Z"/></clipPath><linearGradient id="glint-o1file" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#FFF3D6" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="spark-o1file" x1="0" x2="1"><stop offset="0" stop-color="#F59E0B" stop-opacity="0"/><stop offset=".5" stop-color="#FFE7B0"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></linearGradient></defs><g class="o1-body"><path fill-rule="evenodd" d="M18 12H56L78 34V62L56 84H18Z M33 26H55A3 3 0 0 1 58 29V67A3 3 0 0 1 55 70H33A3 3 0 0 1 30 67V29A3 3 0 0 1 33 26Z"/></g>
<g class="o1-card"><rect x="30" y="26" width="28" height="44" rx="3"/></g>
<g class="o1-gem"><path d="M44 41L51 48L44 55L37 48Z"/></g>
<g clip-path="url(#o1clip-o1file)"><g transform="rotate(20 48 48)"><rect class="glint" x="-40" y="-10" width="18" height="120" fill="url(#glint-o1file)"/></g></g></svg>
