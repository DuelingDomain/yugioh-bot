<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Dueling Domain (A, Sealed pack)</title>
<meta name="theme-color" content="#0A0E1A">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="pack.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#form-zone">Skip to the sign-in form</a>
<div class="a-page">
  <div class="a-bg" aria-hidden="true">
    <div class="rings">
      <svg viewBox="0 0 1000 1000" fill="none" stroke="currentColor"><g class="r1" style="transform-origin:500px 500px"><circle cx="500" cy="500" r="470" stroke-opacity=".16"/><circle cx="500" cy="500" r="470" stroke-opacity=".5" stroke-width="5" stroke-dasharray="1 29.5"/></g></svg>
      <svg viewBox="0 0 1000 1000" fill="none" stroke="currentColor"><g class="r2" style="transform-origin:500px 500px"><circle cx="500" cy="500" r="385" stroke-opacity=".2"/><circle cx="500" cy="500" r="385" stroke-opacity=".28" stroke-width="12" stroke-dasharray="2 60"/></g></svg>
      <svg viewBox="0 0 1000 1000" fill="none" stroke="currentColor"><g class="r3" style="transform-origin:500px 500px"><circle cx="500" cy="500" r="300" stroke-opacity=".22"/><path d="M500 190v28M500 782v28M190 500h28M782 500h28" stroke-opacity=".5" stroke-width="2"/></g></svg>
    </div>
    <div class="ghost g1"><div class="ghost-in"></div></div><div class="ghost g2"><div class="ghost-in"></div></div><div class="ghost g3"><div class="ghost-in"></div></div>
    <div class="dust" id="dust"></div>
  </div>

  <header class="nav">
    <div class="wrap nav-in">
      <a class="brand" href="https://duelingdomain.com/" aria-label="Dueling Domain, home"><svg class="lockup" aria-hidden="true" focusable="false"><use href="#dd-lockup"/></svg></a>
      <div class="nav-r"><span class="chip"><i></i>Closed alpha</span><a class="back" href="https://duelingdomain.com/">Back to site</a></div>
    </div>
  </header>

  <main class="wrap a-grid">
    <div class="a-form" id="form-zone"><div id="screens"></div></div>

    <div class="a-stage" aria-hidden="true">
      <div class="pack-stage3d"><div class="pack-enter"><div class="pack-bob"><div class="pack-hit"><div class="pack-tilt">
        <div class="pack" id="pack">
          <div class="pk-peek"><img src="../shared/card-back-main-hd.webp" alt="" width="200" height="292"><img src="../shared/card-back-extra-hd.webp" alt="" width="200" height="292"><img src="../shared/card-back-main-hd.webp" alt="" width="200" height="292"></div>
          <div class="pk-rays"></div><div class="pk-lip"></div>
          <div class="pk-body">
            <div class="pk-foil"></div><div class="pk-holo"><div class="holo-x"><div class="holo"></div></div></div><div class="pk-light"></div>
            <div class="pk-face">
              <div class="pk-name"><span class="a">Dueling</span><span class="b">Domain</span></div>
              <svg class="pk-glyph" viewBox="6 6 84 84" focusable="false">
                <g class="mk-body"><path fill-rule="evenodd" d="M18 12H56L78 34V62L56 84H18Z M33 26H55A3 3 0 0 1 58 29V67A3 3 0 0 1 55 70H33A3 3 0 0 1 30 67V29A3 3 0 0 1 33 26Z"/></g>
                <g class="mk-card"><rect x="30" y="26" width="28" height="44" rx="3"/></g>
                <g class="mk-gem"><path d="M44 41L51 48L44 55L37 48Z"/></g>
                <g clip-path="url(#dd-clip)"><g transform="rotate(20 48 48)"><rect class="mk-glint" x="-40" y="-10" width="18" height="120" fill="url(#dd-glint)"/></g></g>
              </svg>
            </div>
            <div class="pk-ribbon">Alpha edition</div><div class="pk-tag">Draft · Duel · Domain</div><div class="pk-crimp b"></div><div class="pk-edge"></div>
          </div>
          <div class="pk-burst"></div>
          <div class="pk-top"><div class="pk-foil"></div><div class="pk-holo"><div class="holo-x"><div class="holo"></div></div></div><div class="pk-crimp t"></div><div class="pk-band"><i></i>Closed alpha<i></i></div><div class="pk-edge"></div></div>
        </div>
      </div></div></div></div></div>
      <div class="pack-hint"><i><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="7" height="5" rx="1"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5"/></svg></i><span class="t1">Sealed until you sign in</span><span class="t2">Pack's open</span></div>
    </div>
  </main>
</div>

<template id="tpl-screen">
  <section class="scr">
    <p class="eyebrow" data-slot="eyebrow"></p>
    <h1 class="ttl" data-slot="title"></h1>
    <p class="lede" data-slot="lede"></p>
    <div data-slot="form"></div>
    <div class="foot-links" data-slot="foot"></div>
  </section>
</template>

<script src="../shared/forms.js"></script>
<script>
(function () {
  /* the success frame belongs to this concept: the pack tears and the app loads */
  DD.screens.success = { tab: 'Success (pack torn)', face: 'back', eyebrow: 'Signed in', title: 'You’re <em>in</em>', lede: 'The pack is open. Loading your drafts.',
    form: function () { return '<div class="form"><div class="done-row" role="status"><span class="done-gem">' + DD.icons.tick + '</span><div><p class="done-t">Welcome in</p><p class="done-s">Opening Dueling Domain…</p></div></div></div>'; },
    foot: 'none', name: 'Welcome in', type: '', code: '', clerk: 'Session active, redirect to the app' };
  DD.extra = ['success'];
  DD.mount(function () { return document.getElementById('screens'); });

  var pack = document.getElementById('pack');
  var timer = null;
  DD.hooks.push(function (id, prev) {
    clearTimeout(timer);
    var open = id === 'success';
    pack.classList.toggle('is-open', open);
    pack.classList.toggle('mark-play', open);
    if (id === 'signing' && !new URLSearchParams(location.search).has('shot')) timer = setTimeout(function () { DD.go('success'); }, 1400);
  });
  DD.start();

  var dust = document.getElementById('dust');
  for (var i = 0; i < 14; i++) {
    var d = document.createElement('i');
    d.style.left = (8 + (i * 61) % 86) + '%'; d.style.top = (30 + (i * 37) % 60) + '%';
    d.style.setProperty('--d', (7 + (i % 5) * 1.6) + 's'); d.style.setProperty('--dl', (-(i * 1.3)) + 's');
    dust.appendChild(d);
  }
})();
</script>
</body>
</html>
