services:
  shared:
    build:
      context: .
      target: web-dev
    working_dir: /app
    command: ["node_modules/.bin/tsc", "-p", "packages/shared/tsconfig.build.json", "--watch", "--preserveWatchOutput"]
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist

  web:
    build:
      target: web-dev
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./packages/web/app:/app/packages/web/app
      - ./packages/web/public:/app/packages/web/public
      - ./packages/web/src:/app/packages/web/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
      - ./packages/shared/package.json:/app/packages/shared/package.json:ro
      - /app/packages/web/.next
    depends_on:
      - shared

  ws:
    ports:
      - "3001:3001"

  duel:
    # Local development reads its existing engine volume; no CI bundle build context.
    build:
      target: duel
      additional_contexts: !reset {}

  worker:
    build:
      target: web-dev
    working_dir: /app
    command: ["node_modules/.bin/tsx", "watch", "packages/worker/src/index.ts"]
    volumes:
      - ./packages/worker/src:/app/packages/worker/src
      - ./packages/shared/dist:/app/packages/shared/dist
      - ./packages/shared/package.json:/app/packages/shared/package.json:ro
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "packages/worker/src/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - shared
      - ws
